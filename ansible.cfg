# ansible.cfg (repo root)
#
# Ansible only auto-loads ansible.cfg from the CURRENT directory (or
# ~/.ansible.cfg, /etc/ansible/ansible.cfg) - it never walks up parents. The
# playbooks and the README both say to run from the repo root
# (`ansible-playbook ansible/deploy_ha_automations.yml`), which with only
# ansible/ansible.cfg present parsed NO inventory and exited 0 with
# "skipping: no hosts matched" - a deploy that silently did nothing. This file
# makes the documented invocation work; running from ansible/ still picks up
# ansible/ansible.cfg as before, so both entry points behave the same.
#
# Keep the two files in sync (paths here are prefixed with ansible/).

[defaults]
inventory = ./ansible/inventory/
forks = 10
# Logging to disk is disabled — ansible-inventory --host and any debug task
# dump full hostvars (including vault-decrypted secrets) into log_path. Keep
# this commented out unless you have a sanitization pipeline for the log.
# log_path = ./ansible.log
host_key_checking = True
fact_caching = jsonfile
fact_caching_connection = ./ansible/facts_cache
fact_caching_timeout = 7200
vault_password_file = ./ansible/vault-pass

[inventory]
enable_plugins = yaml, ini

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=yes
