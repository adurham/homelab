# Official Ookla Speedtest CLI (native aarch64 binary at /config/bin/speedtest,
# wrapper /config/bin/run_speedtest.sh -- BOTH live only on the HA host and are
# NOT in this repo; they are rebuilt by hand if the host is ever restored from
# backup).
#
# History: replaced the Cloudflare-based cloudflare_speed_test integration
# (hard rate-limits with HTTP 429 under any real concurrent load, so it could
# not measure a gigabit connection) AND HA-core speedtestdotnet (its legacy
# Python speedtest-cli server-discovery API returned only Canadian servers for
# this connection). The official Ookla Go binary has neither problem. Verified
# 2026-08-08: 887-894 Mbps down / 891-929 Mbps up, matching the native macOS
# Speedtest app (883/866) within run-to-run variance.
#
# `command_line:` is the modern top-level integration key. The legacy
# `- platform: command_line` list-style under `sensor:` is silently ignored by
# current HA Core (config validates "valid", entity never appears).
#
# REGRESSION NOTE (2026-09-28): this file was never added to the repo, and
# `configuration.yaml` (which IS repo-managed) had no `command_line:` include
# -- so the first deploy that overwrote configuration.yaml dropped the include
# and the sensor silently disappeared, taking the Internet Speed dashboard's
# data source with it. The include now lives in the repo's configuration.yaml
# and this file is deployed with the rest of the config surface.
- sensor:
    name: "Ookla Speedtest"
    unique_id: ookla_speedtest
    command: "/config/bin/run_speedtest.sh"
    scan_interval: 3600
    command_timeout: 60
    value_template: "{{ value_json.download_mbps }}"
    unit_of_measurement: "Mbit/s"
    device_class: data_rate
    state_class: measurement
    json_attributes:
      - download_mbps
      - upload_mbps
      - ping_ms
      - jitter_ms
      - packet_loss
      - isp
      - server_name
      - server_location
      - external_ip
      - result_url
      - timestamp

# ---------------------------------------------------------------------------
# amd-workstation AC power — Shelly Plug US Gen4 (S4PL-00116US, 192.168.86.100)
# Added 2026-10-17.  The native Shelly integration does not auto-discover this
# Gen4 model yet, so the plug is surfaced here (repo-managed, no UI-only state).
# The relay IS the box's AC supply; power-on default is ON so an AC restore
# boots the box (BIOS "Ac Loss Control = Always On").
# 2026-11-03: the box took its .57 reservation on boot; the plug is now pinned
# at .100 by a dnsmasq reservation (shelly-workstation-plug) and lives here.
# NEVER toggle this while a test is running on the box.
# ---------------------------------------------------------------------------
- switch:
    name: "amd-workstation power"
    unique_id: amd_workstation_power
    # Device login is enabled on the Shelly fleet (HTTP digest, SHA-256), which
    # urllib cannot do natively; /config/bin/shelly_rpc.py does the
    # challenge/response. Password comes from secrets.yaml
    # (shelly_device_password).
    command_on: >-
      python3 /config/bin/shelly_rpc.py http://192.168.86.100/rpc/Switch.Set '{"id":0,"on":true}'
    command_off: >-
      python3 /config/bin/shelly_rpc.py http://192.168.86.100/rpc/Switch.Set '{"id":0,"on":false}'
    command_state: >-
      python3 /config/bin/shelly_rpc.py 'http://192.168.86.100/rpc/Switch.GetStatus?id=0'
      | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["output"]).lower())'
    value_template: "{{ value == 'true' }}"
    scan_interval: 30

- sensor:
    name: "amd-workstation plug power"
    unique_id: amd_workstation_plug_power
    command: >-
      python3 /config/bin/shelly_rpc.py 'http://192.168.86.100/rpc/Switch.GetStatus?id=0'
      | python3 -c 'import json,sys; print(json.load(sys.stdin)["apower"])'
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    scan_interval: 30

# ---------------------------------------------------------------------------
# Hourly Wi-Fi / LAN health check (added 2026-11-19). HOME ASSISTANT IS THE SCHEDULER.
# The measurements need the workstation's idle AX210 (monitor mode on 5 GHz ch149), its wired NIC
# (multicast census), an iperf3 server for the MacBook and the privileged docker chroot -- none of which
# exist on the HA Green -- so HA triggers the job over SSH and the workstation does the work.
#   * The key (/config/.ssh/id_net_health, 0600, host-only, NOT in this repo) is a dedicated ed25519 key whose
#     authorized_keys entry on amd-workstation is `from="192.168.86.2",no-pty,... command="python3
#     ~/.hermes/scripts/net_health.py --json"`: it can run that one script and nothing else.
#   * The run takes ~75 s and prints one JSON line; the sensor state is the number of problem flags
#     (-1 = the run failed or an earlier run was still going). Details: attributes below.
#   * The job also writes /var/lib/prometheus/node-exporter/netheal.prom, which is what feeds the
#     "Network & Wi-Fi Health" Grafana dashboard (uid network-health).
#   * Replaces the Hermes cron job on the workstation. Source of the script: ~/.hermes/scripts/net_health.py
#     on amd-workstation (outside this repo). Runs at HA start/reload and then every hour.
# ---------------------------------------------------------------------------
- sensor:
    name: "Network health"
    unique_id: network_health_check
    command: >-
      ssh -i /config/.ssh/id_net_health -o BatchMode=yes -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile=/config/.ssh/known_hosts -o ConnectTimeout=10
      adam.durham@192.168.86.19 run
    scan_interval: 3600
    command_timeout: 170
    value_template: "{{ value_json.nflags if value_json.nflags is not none else -1 }}"
    unit_of_measurement: "flags"
    state_class: measurement
    json_attributes:
      - when
      - flags
      - wifi_down_mbps
      - wifi_up_mbps
      - wifi_band
      - air_total_pct
      - air_node_mc_pct
      - lan_mc_pps
      - ecobee_pps
      - node_ping_max_ms
      - max_loss_pct
      - dhcp_offers
      - mac_ping_p90_ms
      - wan_down
      - wan_up
      - busy
      - error


# ---------------------------------------------------------------------------
# Wired half of the network health check. Owner's rule (2026-11-23): every
# physically-cabled measurement runs on the HA box; the workstation may only
# measure Wi-Fi. /config/scripts/net_wired.py (python3, stdlib only) does ICMP
# loss/latency to the mesh nodes, AT&T gateway, both resolvers and the WAN, DNS
# query time, the Nest router status API, one real DHCP DISCOVER (offer count)
# and a 45 s wired multicast/broadcast census. State = DHCP offers (-1 = failed).
# The hourly Wi-Fi job on amd-workstation reads this sensor and merges the two.
- sensor:
    name: "Network health wired"
    unique_id: network_health_wired
    command: "python3 /config/scripts/net_wired.py"
    scan_interval: 3600
    command_timeout: 240
    value_template: "{{ value_json.dhcp.offers if value_json.dhcp.offers is not none else -1 }}"
    unit_of_measurement: "offers"
    state_class: measurement
    json_attributes:
      - ping
      - dns_ms
      - router
      - dhcp
      - mc
