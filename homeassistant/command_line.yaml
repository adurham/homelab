# Official Ookla Speedtest CLI (native aarch64 binary at /config/bin/speedtest,
# wrapper /config/bin/run_speedtest.sh -- BOTH live only on the HA host and are
# NOT in this repo; they are rebuilt by hand if the host is ever restored from
# backup).
#
# History: replaced the Cloudflare-based cloudflare_speed_test integration
# (hard rate-limits with HTTP 429 under any real concurrent load, so it could
# not measure a gigabit connection) AND HA-core speedtestdotnet (its legacy
# Python speedtest-cli server-discovery API returned only Canadian servers for
# this connection). The official Ookla Go binary has neither problem. Verified
# 2026-08-08: 887-894 Mbps down / 891-929 Mbps up, matching the native macOS
# Speedtest app (883/866) within run-to-run variance.
#
# `command_line:` is the modern top-level integration key. The legacy
# `- platform: command_line` list-style under `sensor:` is silently ignored by
# current HA Core (config validates "valid", entity never appears).
#
# REGRESSION NOTE (2026-09-28): this file was never added to the repo, and
# `configuration.yaml` (which IS repo-managed) had no `command_line:` include
# -- so the first deploy that overwrote configuration.yaml dropped the include
# and the sensor silently disappeared, taking the Internet Speed dashboard's
# data source with it. The include now lives in the repo's configuration.yaml
# and this file is deployed with the rest of the config surface.
- sensor:
    name: "Ookla Speedtest"
    unique_id: ookla_speedtest
    command: "/config/bin/run_speedtest.sh"
    scan_interval: 3600
    command_timeout: 60
    value_template: "{{ value_json.download_mbps }}"
    unit_of_measurement: "Mbit/s"
    device_class: data_rate
    state_class: measurement
    json_attributes:
      - download_mbps
      - upload_mbps
      - ping_ms
      - jitter_ms
      - packet_loss
      - isp
      - server_name
      - server_location
      - external_ip
      - result_url
      - timestamp

# ---------------------------------------------------------------------------
# amd-workstation AC power — Shelly Plug US Gen4 (S4PL-00116US, 192.168.86.57)
# Added 2026-10-17.  The native Shelly integration does not auto-discover this
# Gen4 model yet, so the plug is surfaced here (repo-managed, no UI-only state).
# The relay IS the box's AC supply; power-on default is ON so an AC restore
# boots the box (BIOS "Ac Loss Control = Always On").
# NEVER toggle this while a test is running on the box.
# ---------------------------------------------------------------------------
- switch:
    name: "amd-workstation power"
    unique_id: amd_workstation_power
    # Device login is enabled on the Shelly fleet (HTTP digest, SHA-256), which
    # urllib cannot do natively; /config/bin/shelly_rpc.py does the
    # challenge/response. Password comes from secrets.yaml
    # (shelly_device_password).
    command_on: >-
      python3 /config/bin/shelly_rpc.py http://192.168.86.57/rpc/Switch.Set '{"id":0,"on":true}'
    command_off: >-
      python3 /config/bin/shelly_rpc.py http://192.168.86.57/rpc/Switch.Set '{"id":0,"on":false}'
    command_state: >-
      python3 /config/bin/shelly_rpc.py 'http://192.168.86.57/rpc/Switch.GetStatus?id=0'
      | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["output"]).lower())'
    value_template: "{{ value == 'true' }}"
    scan_interval: 30

- sensor:
    name: "amd-workstation plug power"
    unique_id: amd_workstation_plug_power
    command: >-
      python3 /config/bin/shelly_rpc.py 'http://192.168.86.57/rpc/Switch.GetStatus?id=0'
      | python3 -c 'import json,sys; print(json.load(sys.stdin)["apower"])'
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    scan_interval: 30

- binary_sensor:
    name: "amd-workstation reachable"
    unique_id: amd_workstation_reachable
    # SSH-port probe, not ICMP: a zombie (kernel up, sshd dead) must read as DOWN.
    command: >-
      bash -c 'timeout 4 bash -c "exec 3<>/dev/tcp/100.66.90.53/22" 2>/dev/null && echo 1 || echo 0'
    device_class: connectivity
    payload_on: "1"
    payload_off: "0"
    scan_interval: 30
