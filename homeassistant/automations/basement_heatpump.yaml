- alias: "Basement Heat Pump Track Room Target"
  id: "basement_heatpump_track_target"
  description: >-
    The head's own thermostat cannot be trusted to hold a temperature, so the
    unit is run as a dumb heater/cooler and the ROOM sensor makes every
    decision.

    Measured 2026-11-13: the head's return-air sensor (climate
    current_temperature) wandered 70F -> 78F -> 74F in five minutes with the
    compressor drawing 0W, i.e. it tracks its own electronics, not the room.
    It read 78F while the room was 67.8F, and all of November in cool mode it
    read 4-7F LOW, so the unit sat satisfied and never ran in either season.
    Because the reading drifts on its own, an offset-corrected setpoint just
    chases it upward (tested: the commanded setpoint was walked 69 -> 72 -> 75
    while the compressor stayed at 0W). So the setpoint is used only as an
    on/off switch: 84F = "run" in heat, 61F = "idle" in heat (mirrored in
    cool; not 85/60 because HA rejects those two exact values on the
    Fahrenheit->Celsius boundary). Nothing else about it is load-bearing.

    Target is what the other automations already plan for this room: ecobee
    heat setpoint + 2F (the vent controller's downstairs heating bonus) or
    ecobee cool setpoint - 2F in cooling, plus
    input_number.basement_heatpump_offset for tuning. Reference is
    sensor.7wq7_temperature (the local Zigbee sensor the vent controller
    already uses for this room), falling back to the ecobee basement sensor
    when the Zigbee one is stale or missing.
  mode: single
  max_exceeded: silent

  trigger:
    - platform: time_pattern
      minutes: "/2"
    - platform: homeassistant
      event: start
    # React to the room moving, not just to the clock.
    - platform: state
      entity_id:
        - sensor.7wq7_temperature
        - sensor.ecobee_edgewater_road_basement_temperature
        - sensor.ecobee_edgewater_road_desired_heat
        - sensor.ecobee_edgewater_road_desired_cool

  condition:
    - condition: state
      entity_id: input_boolean.basement_heatpump_auto
      state: "on"
    - condition: template
      value_template: >-
        {% set l = states('sensor.7wq7_temperature') | float(0) %}
        {% set lu = states['sensor.7wq7_temperature'].last_updated %}
        {% set ca = (as_timestamp(now()) - as_timestamp(lu)) if lu else 99999 %}
        {% set c = states('sensor.ecobee_edgewater_road_basement_temperature') | float(0) %}
        {{ (ca < 1200 and 40 < l < 100) or (40 < c < 100) }}

  action:
    - variables:
        ref: >-
          {% set l = states('sensor.7wq7_temperature') | float(0) %}
          {% set lu = states['sensor.7wq7_temperature'].last_updated %}
          {% set ca = (as_timestamp(now()) - as_timestamp(lu)) if lu else 99999 %}
          {% set c = states('sensor.ecobee_edgewater_road_basement_temperature') | float(0) %}
          {{ l if (ca < 1200 and 40 < l < 100) else (c if 40 < c < 100 else 0) }}
        sp: "{{ state_attr('climate.basement_heatpump_basement_office_ac', 'temperature') | float(0) }}"
        offs: "{{ states('input_number.basement_heatpump_offset') | float(0) }}"
        heat_target: "{{ (states('sensor.ecobee_edgewater_road_desired_heat') | float(64)) + 2 + offs }}"
        cool_target: "{{ (states('sensor.ecobee_edgewater_road_desired_cool') | float(72)) - 2 + offs }}"

    # Is the unit already being told to run? The setpoint extreme encodes it.
    - variables:
        heating_now: "{{ is_state('climate.basement_heatpump_basement_office_ac', 'heat') and sp | float(0) >= 80 }}"
        cooling_now: "{{ is_state('climate.basement_heatpump_basement_office_ac', 'cool') and sp | float(0) <= 65 }}"
        # 0.7F to start, 0.3F past target to stop: hysteresis across the whole band.
        do_heat: >-
          {{ (heating_now and ref | float(0) < heat_target | float(0) + 0.3)
             or (not heating_now and ref | float(0) <= heat_target | float(0) - 0.7) }}
        do_cool: >-
          {{ (cooling_now and ref | float(0) > cool_target | float(0) - 0.3)
             or (not cooling_now and ref | float(0) >= cool_target | float(0) + 0.7) }}

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ do_heat }}"
          sequence:
            - if: "{{ not is_state('climate.basement_heatpump_basement_office_ac', 'heat') }}"
              then:
                - service: climate.set_hvac_mode
                  target:
                    entity_id: climate.basement_heatpump_basement_office_ac
                  data:
                    hvac_mode: heat
            - if: "{{ sp | float(0) < 83 }}"
              then:
                - service: climate.set_temperature
                  target:
                    entity_id: climate.basement_heatpump_basement_office_ac
                  data:
                    temperature: 84

        - conditions:
            - condition: template
              value_template: "{{ do_cool }}"
          sequence:
            - if: "{{ not is_state('climate.basement_heatpump_basement_office_ac', 'cool') }}"
              then:
                - service: climate.set_hvac_mode
                  target:
                    entity_id: climate.basement_heatpump_basement_office_ac
                  data:
                    hvac_mode: cool
            - if: "{{ sp | float(0) > 62 }}"
              then:
                - service: climate.set_temperature
                  target:
                    entity_id: climate.basement_heatpump_basement_office_ac
                  data:
                    temperature: 61

        # Inside the band with nothing demanded: make sure the unit is idling,
        # using the off-side extreme for whichever mode it is sitting in.
        - conditions: []
          sequence:
            - if: "{{ is_state('climate.basement_heatpump_basement_office_ac', 'heat') and sp | float(0) >= 70 }}"
              then:
                - service: climate.set_temperature
                  target:
                    entity_id: climate.basement_heatpump_basement_office_ac
                  data:
                    temperature: 61
            - if: "{{ is_state('climate.basement_heatpump_basement_office_ac', 'cool') and sp | float(0) <= 74 }}"
              then:
                - service: climate.set_temperature
                  target:
                    entity_id: climate.basement_heatpump_basement_office_ac
                  data:
                    temperature: 84

- alias: "Basement Heat Pump Room Sensor Lost"
  id: "basement_heatpump_room_sensor_lost"
  description: >-
    Both room references are gone (Zigbee stale AND ecobee unavailable), so
    the only reading left is the head's own unusable sensor. Park the unit at
    idle rather than let it run on that reading, and say so once.
  mode: single
  max_exceeded: silent

  trigger:
    - platform: state
      entity_id:
        - sensor.7wq7_temperature
        - sensor.ecobee_edgewater_road_basement_temperature
      to: "unavailable"
      for: "00:15:00"

  condition:
    - condition: state
      entity_id: input_boolean.basement_heatpump_auto
      state: "on"
    - condition: template
      value_template: >-
        {% set l = states('sensor.7wq7_temperature') | float(0) %}
        {% set c = states('sensor.ecobee_edgewater_road_basement_temperature') | float(0) %}
        {{ not (40 < l < 100) and not (40 < c < 100) }}

  action:
    - service: climate.set_temperature
      target:
        entity_id: climate.basement_heatpump_basement_office_ac
      data:
        temperature: 60
    - service: persistent_notification.create
      data:
        title: Basement heat pump has no room reference
        notification_id: basement_heatpump_ref_lost
        message: >-
          Both the Zigbee basement sensor and the ecobee basement sensor are
          unavailable, so the heat pump was set to idle (60F setpoint) rather
          than left running on its own bad sensor. Check the sensor, or turn
          off Basement Heat Pump Auto and run it manually.
