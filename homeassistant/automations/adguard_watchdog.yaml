# AdGuard Health Watchdog
#
# Self-heal only -- alerting migrated to Grafana (uid: adguard_dns_down,
# roles/grafana/templates/alerting_rules.yml.j2) 2026-08-09, so this can
# route through the same ack/silence Discord flow as every other infra
# alert instead of a separate iPhone-push channel. See that rule's
# comment for why: this automation's OWN trigger entity
# (binary_sensor.adguard_home_running) doesn't exist on this HA
# instance, so the automation itself has been silently dead code, never
# firing -- the restart action below is kept in case that entity gets
# fixed later, but the actual working liveness check now lives in
# Grafana against switch.adguard_home_protection's availability.
- alias: "Infrastructure: AdGuard Home Watchdog"
  id: "infrastructure_adguard_watchdog"
  description: "Restart AdGuard if DNS service stops (alerting is in Grafana, see uid: adguard_dns_down)"
  mode: single

  trigger:
    - platform: state
      entity_id: binary_sensor.adguard_home_running
      to: "off"
      for: "00:02:00"

  action:
    - service: hassio.addon_restart
      data:
        addon: "a0d7b954_adguard"
