# Let's Encrypt Certificate Auto-Renewal
# Added 2026-07-26 after the cert silently expired ~3 months ago (issued
# 2026-01-26, expired 2026-04-26) and went unnoticed until AdGuard started
# throwing TLS errors. Root cause: the core_letsencrypt add-on has NO
# built-in scheduler (confirmed via `ha apps info core_letsencrypt` ->
# startup: once, and the add-on's own certbot log literally says "you may
# need to take steps to enable [background renewal]"). It only renews when
# something external starts it — and nothing ever did.
#
# certbot only actually renews within ~30 days of expiry (no-op otherwise),
# so it's safe/cheap to trigger this on a tight schedule. Monthly, on the
# 1st, gives 3 attempts inside any 90-day cert lifetime before expiry.
- alias: "Infrastructure: Let's Encrypt Cert Renewal"
  id: "infrastructure_letsencrypt_renewal"
  description: "Start the Let's Encrypt add-on monthly so certbot can renew before the 90-day cert expires"
  mode: single

  trigger:
    - platform: time
      at: "03:30:00"

  condition:
    - condition: template
      value_template: "{{ now().day == 1 }}"

  action:
    - service: hassio.addon_start
      data:
        addon: "core_letsencrypt"

    # Give certbot ~3 minutes to finish the DNS-01 challenge (180s
    # propagation wait per the addon's `propagation_seconds: 180` config)
    # before checking whether it needs a nudge, and to avoid double-firing.
    - delay: "00:04:00"
