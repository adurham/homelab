# Frigate NVR Health Watchdog
#
# 2026-07-28: a power blip corrupted containerd's state inside CT 170
# (frigate-01, pve01). Proxmox kept reporting the LXC as "running" for
# 45 hours while docker/Frigate/go2rtc were completely dead inside it,
# so Nest cameras were dark with zero alert until manually caught on
# the HA dashboard. Container-alive is not a health signal for what's
# running inside it — this watches Frigate's own HTTP API via
# sensor.frigate_api_reachable (see sensors.yaml), which the platform
# marks `unavailable` on any connection failure/timeout.
#
# Push-notification alerting migrated to Grafana (uid: frigate_api_down,
# roles/grafana/templates/alerting_rules.yml.j2) 2026-08-09, so it goes
# through the same ack/silence Discord flow as every other infra alert.
# This automation now only maintains a local persistent_notification --
# dropped the mobile_app push (both directions) and the
# input_boolean.frigate_watchdog_alerted gating that existed purely to
# avoid a spurious "back online" push for an outage that was never
# critically alerted; with no push left, that gating is moot.
- alias: "Infrastructure: Frigate NVR Watchdog"
  id: "infrastructure_frigate_watchdog"
  description: >-
    Track Frigate's own API (192.168.86.85:5000) reachability with a
    local persistent_notification. Push alerting for outages 5+ minutes
    is in Grafana (uid: frigate_api_down).
  mode: single

  trigger:
    - platform: state
      id: "down"
      entity_id: sensor.frigate_api_reachable
      to: "unavailable"
      for: "00:05:00"
    - platform: state
      id: "up"
      entity_id: sensor.frigate_api_reachable
      from: "unavailable"

  action:
    - choose:
        - conditions:
            - condition: trigger
              id: "down"
          sequence:
            - service: persistent_notification.create
              data:
                title: "Frigate NVR Offline"
                message: >-
                  Frigate API unreachable for 5+ minutes as of
                  {{ now().strftime('%Y-%m-%d %H:%M:%S') }}. See Grafana
                  / #infra-alerts for remediation steps.
                notification_id: "frigate_watchdog"

        - conditions:
            - condition: trigger
              id: "up"
          sequence:
            - service: persistent_notification.dismiss
              data:
                notification_id: "frigate_watchdog"
