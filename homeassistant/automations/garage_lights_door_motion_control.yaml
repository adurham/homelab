# Garage Lights - Door Open and Motion Control
- id: 'garage_lights_door_motion_control'
  alias: 'Garage Lights - Door Open and Motion Control'
  description: >-
    Turns on garage lights when any garage door opens or motion is detected,
    stays on for 15 minutes after last motion
  trigger:
    # Trigger when any garage door opens
    - platform: state
      entity_id:
        - binary_sensor.garage_door_contact
        - binary_sensor.left_garage_bay_garage_door
        - binary_sensor.middle_garage_bay_garage_door
        - binary_sensor.right_garage_bay_garage_door
      to: 'on'
      # Friendly entity_id fix 2026-09-10: the 4th entry was the raw Shelly
      # device-ID entity_id (binary_sensor.shelly1minig3_b08184ee0fd0_garage_door),
      # which does not exist in HA's current entity registry (confirmed
      # via /api/states) -- likely stale from before this device got its
      # friendly entity_id. The right garage bay door was silently NOT
      # triggering the lights on its own open event (motion detection
      # still caught it as a fallback, so this wasn't a total outage,
      # just a redundant-not dead-simple gap). Retargeted to the real,
      # currently-live entity_id, matching left/middle's naming pattern.
    # Person-door redundancy (added 2026-10-02): the ecobee contact above
    # silently MISSES opens -- recorder-verified 2026-09-24 18:31 (4s open,
    # light only came on 42s late via motion; contact never fired) and
    # 2026-10-01 02:32-03:23 (the lock's own sensor showed the door open
    # across multiple BLE reconnects; the contact never fired once). The
    # Yale/August lock's door sensor reads the same physical person door
    # over an independent BLE path, so it's added as a second trigger. The
    # 2s `for` filters that sensor's sub-second lock-reconnect blips; the
    # shortest confirmed-real open was 4s, so a genuine open can't be masked.
    - platform: state
      entity_id: binary_sensor.garage_door_door_3
      to: 'on'
      for: '00:00:02'
    # Trigger when motion is detected in garage
    - platform: state
      entity_id: binary_sensor.garage_door_motion
      to: 'on'
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.garage_main_lights
    - service: timer.start
      target:
        entity_id: timer.garage_lights_motion_timeout
    - service: system_log.write
      data:
        message: "Garage Lights: Turned ON by {{ trigger.to_state.name if trigger.to_state else 'motion detection' }}"
        level: info
  mode: single

# Garage Lights - Turn Off After Motion Timeout
- id: 'garage_lights_turn_off_timeout'
  alias: 'Garage Lights - Turn Off After Motion Timeout'
  description: 'Turns off garage lights when motion timeout expires'
  trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.garage_lights_motion_timeout
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.garage_main_lights
    - service: system_log.write
      data:
        message: "Garage Lights: Turned OFF after 15 minutes of no motion"
        level: info
  mode: single

# Garage Lights - Reset Timer on Motion
- id: 'garage_lights_reset_timer_on_motion'
  alias: 'Garage Lights - Reset Timer on Motion'
  description: 'Resets the motion timeout timer when motion is detected while lights are on'
  trigger:
    - platform: state
      entity_id: binary_sensor.garage_door_motion
      to: 'on'
  condition:
    - condition: state
      entity_id: switch.garage_main_lights
      state: 'on'
  action:
    - service: timer.start
      target:
        entity_id: timer.garage_lights_motion_timeout
    - service: system_log.write
      data:
        message: "Garage Lights: Motion detected, resetting 15-minute timeout"
        level: info
  mode: single
