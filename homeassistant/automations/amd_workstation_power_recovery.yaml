# amd-workstation auto power-cycle (Shelly Plug US Gen4, 192.168.86.57)
# Liveness = binary_sensor.amd_workstation_reachable (SSH-port probe, 30 s poll).
# MAINTENANCE MODE = disable this automation (e.g. while working inside the box).
- id: amd_workstation_power_recovery
  alias: "amd-workstation: auto power-cycle if unreachable"
  description: >
    If amd-workstation stops answering on SSH for 5 minutes, power-cycle its Shelly plug.
    Rate-limited to one cycle per 10 minutes. To suspend auto-recovery, DISABLE THIS
    AUTOMATION. If the box is still down 90 s after a cycle it stops and notifies instead
    of looping on a dead part.
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: binary_sensor.amd_workstation_reachable
      to: "off"
      for: "00:05:00"
  condition:
    - condition: template
      value_template: >
        {{ state_attr('this', 'last_triggered') is none
           or (as_timestamp(now()) - as_timestamp(state_attr('this', 'last_triggered')) > 600) }}
  action:
    - action: switch.turn_off
      target:
        entity_id: switch.amd_workstation_power
    - delay: "00:00:15"
    - action: switch.turn_on
      target:
        entity_id: switch.amd_workstation_power
    - delay: "00:01:30"
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.amd_workstation_reachable
              state: "off"
          sequence:
            - action: persistent_notification.create
              data:
                title: "amd-workstation did not come back"
                message: >-
                  Power-cycled the plug; the box is still unreachable. Auto-recovery stopped
                  and will not retry for 10 minutes - needs a manual look.
      default:
        - action: persistent_notification.create
          data:
            title: "amd-workstation recovered"
            message: "Auto power-cycle worked; the box is back."
