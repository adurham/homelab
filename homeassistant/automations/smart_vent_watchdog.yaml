# Smart Vent Controller Heartbeat Watchdog
#
# 2026-08-08 incident: the AppDaemon smart_vent_controller app runs on a
# single pinned worker thread (control_loop, occupancy listeners, and the
# heartbeat write all share it). A cover/set_cover_tilt_position HA
# websocket call went silent mid-cycle — no exception, no further log
# lines — and never returned, which froze that one thread forever. Every
# future scheduled control_loop run queued up behind it and never
# executed. Vents held whatever position they'd last been set to for
# ~4.5 hours (Game Room stuck at 0% while +6.9F over setpoint) until a
# manual `ha addons restart a0d7b954_appdaemon`, which un-wedged it in
# under 10 seconds. Supervisor reported the add-on as healthy (state:
# started, normal CPU/mem) throughout — container-alive was not a
# meaningful health signal, same lesson as the Frigate watchdog.
#
# sensor.smart_vent_controller_heartbeat is a timestamp string the app
# stamps at the top of every control_loop call (every 120s) specifically
# so an external watchdog can distinguish "app process alive" from
# "control loop actually running." Its state VALUE is the current
# timestamp each cycle, so last_changed tracks freshness accurately.
#
# Self-heals via hassio.addon_restart on first detection (this fixed the
# real incident in under 10s). Rate-limited to at most one restart per
# 15 minutes via input_datetime.smart_vent_watchdog_last_restart so a
# recurring/flapping failure can't restart-loop the WHOLE AppDaemon addon
# (which would bounce every app it hosts, not just this one). If the
# heartbeat is STILL stale after a restart was already tried within the
# last 15 minutes, escalate to a critical push instead of restarting
# again — this needs a human, not another automatic restart.
- alias: "Infrastructure: Smart Vent Controller Watchdog"
  id: "infrastructure_smart_vent_watchdog"
  description: >-
    Detect a frozen smart_vent_controller AppDaemon thread (heartbeat
    sensor stale >6min = 3 missed 120s cycles), self-heal via add-on
    restart (rate-limited to 1 per 15min), and escalate to a critical
    push if the restart doesn't clear it.
  mode: single

  trigger:
    - platform: time_pattern
      id: "check"
      minutes: "/2"
    - platform: state
      id: "recovered"
      entity_id: sensor.smart_vent_controller_heartbeat

  variables:
    hb_stale: >-
      {% set hb = states.sensor.smart_vent_controller_heartbeat %}
      {{ hb is none or hb.state in ('unknown', 'unavailable') or
         (now() - hb.last_changed).total_seconds() > 360 }}
    last_restart_age_min: >-
      {% set lr = states('input_datetime.smart_vent_watchdog_last_restart') %}
      {% if lr in ('unknown', 'unavailable', none) %}
        99999
      {% else %}
        {{ ((now() - strptime(lr, '%Y-%m-%d %H:%M:%S')).total_seconds() / 60) | round(1) }}
      {% endif %}

  action:
    - choose:
        # Stale, and either never restarted or the last restart was long
        # enough ago that a fresh restart is warranted (not a loop).
        - conditions:
            - condition: template
              value_template: "{{ hb_stale }}"
            - condition: template
              value_template: "{{ last_restart_age_min | float > 15 }}"
          sequence:
            - service: input_datetime.set_datetime
              target:
                entity_id: input_datetime.smart_vent_watchdog_last_restart
              data:
                datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

            - service: notify.mobile_app_adams_iphone_16
              data:
                title: "WARNING: Smart Vent Controller Frozen"
                message: >-
                  sensor.smart_vent_controller_heartbeat has been stale
                  for 6+ minutes — the AppDaemon control loop is not
                  running (vents are frozen at their last position, not
                  responding to room temp/occupancy). Attempting
                  self-heal: restarting the AppDaemon add-on.
                data:
                  push:
                    sound:
                      name: "default"
                      critical: 0
                      volume: 0.8

            - service: hassio.addon_restart
              data:
                addon: "a0d7b954_appdaemon"

        # Stale AND we already tried a restart within the last 15 minutes
        # (still stale means the restart didn't fix it, or it's flapping)
        # — don't restart again, escalate instead. Only fire once per
        # incident (gated on the escalated flag) so this doesn't spam
        # every 2 minutes.
        - conditions:
            - condition: template
              value_template: "{{ hb_stale }}"
            - condition: template
              value_template: "{{ last_restart_age_min | float <= 15 }}"
            - condition: state
              entity_id: input_boolean.smart_vent_watchdog_escalated
              state: "off"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.smart_vent_watchdog_escalated

            - service: notify.mobile_app_adams_iphone_16
              data:
                title: "CRITICAL: Smart Vent Controller Still Frozen"
                message: >-
                  Heartbeat is still stale after a self-heal restart
                  attempt ~{{ last_restart_age_min }} min ago. Automatic
                  recovery failed — needs manual intervention. Check
                  `ha addons logs a0d7b954_appdaemon` on
                  homeassistant.local:2222 for a repeating HASS websocket
                  timeout/hang, and restart manually if needed:
                  `ha addons restart a0d7b954_appdaemon`.
                data:
                  push:
                    sound:
                      name: "default"
                      critical: 1
                      volume: 1.0

            - service: persistent_notification.create
              data:
                title: "Smart Vent Controller Still Frozen"
                message: >-
                  Heartbeat stale as of {{ now().strftime('%Y-%m-%d %H:%M:%S') }},
                  self-heal restart did not clear it. See mobile
                  notification for remediation steps.
                notification_id: "smart_vent_watchdog"

        # Recovered — only send a clear notice if we'd actually escalated
        # (mirrors the Frigate watchdog pattern: don't notify "back
        # online" for an outage nobody was ever critically alerted about).
        - conditions:
            - condition: template
              value_template: "{{ not hb_stale }}"
            - condition: state
              entity_id: input_boolean.smart_vent_watchdog_escalated
              state: "on"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.smart_vent_watchdog_escalated

            - service: persistent_notification.dismiss
              data:
                notification_id: "smart_vent_watchdog"

            - service: notify.mobile_app_adams_iphone_16
              data:
                title: "RESOLVED: Smart Vent Controller Back Online"
                message: "Heartbeat is fresh again. Vent control has resumed."
