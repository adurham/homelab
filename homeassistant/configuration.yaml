# Loads default set of integrations. Do not remove.
default_config:

# go2rtc integration — point to the Frigate LXC's go2rtc instance
# (192.168.86.85:1984) instead of the local HA-managed one.
go2rtc:
  url: http://192.168.86.85:1984

# SSO via Authentik (hass-oidc-auth custom component, installed via HACS).
# Public client (PKCE) — matches hass-oidc-auth's own recommendation for a
# home setup: no client_secret to store/leak, redirect URL + PKCE is enough.
# Authentik provider: pk=12, client_id=home-assistant, app slug=home-assistant.
auth_oidc:
  client_id: "home-assistant"
  discovery_url: "https://auth.chi.lab.amd-e.com/application/o/home-assistant/.well-known/openid-configuration"

# Trust lb-01's reverse-proxy headers for the new
# homeassistant.chi.lab.amd-e.com vhost (nginx TLS-terminates + forwards
# X-Forwarded-For/-Proto/-Host; without this HA won't trust them and
# things like the client IP shown in the frontend/logbook would show
# lb-01's IP instead of the real client, and some auth flows validate
# the Host header against what HA thinks it's bound to). HA lives on
# the plain LAN (192.168.86.2), so lb-01 reaches it via its LAN NIC
# (192.168.86.86, directly-connected route) — NOT its SDN IP
# (172.16.0.30), which is a different subnet entirely.
#
# KNOWN BROKEN as of 2026-08-04 on core 2026.8.0b5 (beta): a `ha core
# restart` unexpectedly auto-upgraded this instance 2026.7.4 -> 2026.8
# beta mid-session. That release moves trusted_proxies to a new
# storage-backed network config (Settings > System > Network in the
# UI) and — per the 2026.8 changelog itself ("Fix trusted proxies type
# when HTTP config is loaded from storage") — has an active bug where
# this YAML block gets silently ignored: `ha core logs` still shows
# "A request from a reverse proxy was received from 192.168.86.86, but
# your HTTP integration is not set-up for reverse proxies" for every
# single request through homeassistant.chi.lab.amd-e.com, even after a
# confirmed clean restart with this exact config on disk (verified via
# md5sum match + version bump in /api/config). DNS (A record) and the
# nginx vhost for homeassistant.chi.lab.amd-e.com are both deployed and
# correct — only this trusted_proxies piece is blocked, pending either
# (a) 2026.8 going stable with the fix backported, or (b) configuring
# it via the new UI network settings instead of YAML. The SSO login
# flow (auth_oidc above) is UNAFFECTED — it's an outbound call from HA
# to Authentik, not an inbound proxied request, so it doesn't touch
# trusted_proxies at all.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.86.86  # lb-01 LAN ingress (directly-connected to HA's subnet)

# Prometheus Metrics
prometheus:

# Load frontend themes from the themes folder
logger:
  default: warning
  logs:
    homeassistant.components.automation: debug
    homeassistant.core: debug
    homeassistant.helpers.script: debug

frontend:
  themes: !include_dir_merge_named themes


# Packages for manual configuration
homeassistant:
  packages:
    manual_automations:
      automation: !include_dir_merge_list automations/

template: !include templates.yaml
sensor: !include sensors.yaml
automation: !include automations.yaml
script: !include scripts.yaml
script custom: !include_dir_merge_list scripts/
scene: !include scenes.yaml
scene custom: !include_dir_merge_list scenes/
input_datetime: !include input_datetime.yaml
input_number: !include input_number.yaml

input_text:
  living_room_active_scene:
    name: "Living Room Active Scene"
    initial: "none"

input_boolean:
  # Tracks whether the Frigate NVR watchdog has an active unresolved
  # alert. persistent_notification entities are NOT real state-machine
  # objects on this HA instance (states() on them always returns
  # "unknown" — confirmed 2026-07-28), so they can't be used to gate
  # "only send recovery notice if we actually alerted" logic. This
  # input_boolean is a real, queryable substitute for that purpose.
  frigate_watchdog_alerted:
    name: "Frigate Watchdog Alerted"
    initial: false

timer:
  garage_lights_motion_timeout:
    name: "Garage Lights Motion Timeout"
    duration: "00:15:00"
  exhaust_fan_post_hvac:
    name: "Exhaust Fan Post-HVAC Countdown"
    duration: "00:05:00"
