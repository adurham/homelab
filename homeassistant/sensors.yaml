- platform: integration
  source: sensor.econet_hpwh_power
  name: "Water Heater Energy Total"
  unique_id: water_heater_energy_total
  unit_prefix: k
  method: left
  round: 2

# Grid consumption total (kWh) — Riemann sum of the Emporia whole-house
# power sensor. Replaces the broken UI template sensor
# sensor.edgewater_road_grid_consumption (platform=template, restored:true,
# referencing a deleted source). The Emporia integration provides per-circuit
# energy_today/energy_this_month windows but NOT a cumulative total; this
# integration sensor fills that gap for the HA Energy dashboard + VM export.
- platform: integration
  source: sensor.edgewater_road_power_minute_average
  name: "Grid Consumption Total"
  unique_id: grid_consumption_total
  unit_prefix: k
  method: left
  round: 2

# Sony TV Picture Mode (REST API)
- platform: rest
  name: "Sony TV Picture Mode"
  resource: http://192.168.86.195/sony/video
  method: POST
  headers:
    X-Auth-PSK: !secret sony_tv_psk
  payload: '{"method": "getPictureQualitySettings", "version": "1.0", "params": [{"target": "pictureMode"}], "id": 1}'
  value_template: "{{ value_json.result[0][0].currentValue }}"
  scan_interval: 10

# Frigate NVR reachability (CT 170, frigate-01 on pve01).
# 2026-07-28: after a power blip, Proxmox reported the LXC as "running"
# for 45 hours while containerd inside it was crash-looping (corrupted
# bbolt metadata DB) and docker/Frigate/go2rtc were completely dead —
# Nest cameras went dark with no alert until manually caught. Container
# "running" state is NOT a reliable health signal; poll Frigate's own
# HTTP API directly instead. entity value is the Frigate version string
# when healthy; the REST sensor goes `unavailable` on any connection
# failure/timeout, which is what the paired watchdog automation keys on.
- platform: rest
  name: "Frigate API Reachable"
  unique_id: frigate_api_reachable
  resource: http://192.168.86.85:5000/api/version
  scan_interval: 60
  timeout: 10
  value_template: "{{ value }}"
