# -------------------------------------------------------------------------
# AMD-Enterprises branding (2026-08-04, image handling reworked 2026-09-12).
# Replaces the stock Authentik wordmark/favicon/flow-background/accent-color
# on the default brand with an AMD-Enterprises look: custom logo + favicon
# (so the login/library pages read "AMD-Enterprises" instead of
# "authentik"), a dark navy blueprint-grid background applied to BOTH the
# login flow pages (via branding_default_flow_background) AND the "My
# applications" library page (via custom CSS body background — see
# templates/amd_enterprises_custom.css.j2 GOTCHA #2 for why the two need
# separate mechanisms), and custom CSS overriding the default orange accent
# with the brand blue (--ak-accent / --pf-global--primary-color--* / link
# colors — see that same file's GOTCHA #1).
#
# IMAGE FIELDS (logo/favicon/flow-background): 2026-09-12 REWORK.
# Originally these were pushed as raw data: URIs directly via PATCH — at
# the time (2026-08-04) Authentik's docs confirmed there was no separate
# file-upload API endpoint, so a data: URI was the only API-only way to
# set an image value, and it worked and was confirmed live.
#
# That broke after this session's 2025.8.1 -> 2026.8.0 upgrade: Authentik
# now unconditionally prepends /files/media/public/ to whatever string is
# stored in these fields when building the URL the frontend fetches — even
# when the stored value is already a full data: URI — producing a garbage
# URL like /files/media/public/data:image/svg+xml;base64,.... This is a
# known upstream regression (goauthentik/authentik#19541, #19573), not a
# config mistake on our end; confirmed by reproducing the same duplicate/
# mishandled-path symptom independently of our specific setup.
#
# Fix: the authentik_service role (roles/authentik_service/tasks/main.yml)
# now copies these same SVG files into the running container's real
# /media/public/brand/ directory (Authentik's actual, still-working file
# storage backend) BEFORE this play runs. We PATCH the brand with plain
# relative paths into that directory instead of data: URIs. Relative
# paths resolve correctly via /files/media/public/<path>?token=...
# regardless of the upstream bug above, because that bug is specifically
# in the data:-URI handling branch, not the plain-relative-path branch.
# Verified live 2026-09-12: this exact pattern returns a real 200
# image/svg+xml for the logo.
#
# branding_custom_css is UNAFFECTED by this bug (it's a raw CSS string
# field, not a file-picker image field) and is left as a data: URI
# embedded inside the CSS background-image — that continues to work fine
# via normal CSS url(data:...) syntax, which is standard browser behavior
# unrelated to Authentik's own file-resolution logic.
#
# branding_title was already "AMD-Enterprises" (set outside ansible,
# pre-existing) — left as-is, only visual assets are managed here.
# -------------------------------------------------------------------------

- name: Get default brand
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/core/brands/"
    method: GET
    headers: "{{ headers }}"
  register: all_brands

- name: Select the default brand record
  ansible.builtin.set_fact:
    default_brand:
      json:
        results: "{{ all_brands.json.results | selectattr('default') | list }}"

- name: Read AMD-Enterprises flow background SVG (still used inline in custom CSS)
  ansible.builtin.set_fact:
    amd_enterprises_flow_bg_b64: "{{ lookup('file', role_path + '/files/amd_enterprises_flow_bg.svg') | b64encode }}"

- name: Render AMD-Enterprises custom CSS (templates in the flow-bg data URI)
  ansible.builtin.set_fact:
    amd_enterprises_custom_css: >-
      {{ lookup('template', role_path + '/templates/amd_enterprises_custom.css.j2') }}
  vars:
    AMD_ENTERPRISES_FLOW_BG_DATA_URI: "data:image/svg+xml;base64,{{ amd_enterprises_flow_bg_b64 }}"

- name: Apply AMD-Enterprises branding to default brand
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/core/brands/{{ default_brand.json.results[0].brand_uuid }}/"
    method: PATCH
    headers: "{{ headers }}"
    body_format: json
    body:
      branding_title: "AMD-Enterprises"
      # Relative paths into /media/public/ (populated by authentik_service
      # role) — NOT data: URIs. See the file-header comment above for why.
      branding_logo: "brand/logo.svg"
      branding_favicon: "brand/favicon.svg"
      branding_default_flow_background: "brand/flow_bg.svg"
      branding_custom_css: "{{ amd_enterprises_custom_css }}"
      # settings.layout.type controls the "My applications" library page
      # grid: row (default) / 2-column / 3-column. Read by
      # web/src/user/LibraryPage's uiConfig via GET
      # /api/v3/core/users/me/ (user.settings, brand attrs merged in) —
      # confirmed live: PATCHing this and re-fetching /core/users/me/
      # shows settings.layout.type immediately reflects the new value.
      #
      # Tried 3-column and 2-column live (2026-08-04) — both rejected
      # by the user as "lopsided": Authentik places each app-group
      # (header + its tiles) as its own grid item, so with narrower
      # columns, DIFFERENT groups with different app counts land
      # side-by-side in the same row and their bottoms don't align —
      # this is inherent to Authentik's layout engine (grid items of
      # varying content height in the same row), not fixable via CSS.
      # "row" avoids this entirely: one full-width row per group, tiles
      # wrap within that row, groups never sit side-by-side. Settled on
      # "row" as the keeper.
      attributes:
        settings:
          layout:
            type: "row"
    status_code: [200]
  when: default_brand.json.results | length > 0
