# -------------------------------------------------------------------------
# AMD-Enterprises branding (2026-08-04). Replaces the stock Authentik
# wordmark/favicon/flow-background/accent-color on the default brand
# with an AMD-Enterprises look: custom logo + favicon (so the
# login/library pages read "AMD-Enterprises" instead of "authentik"),
# a dark navy blueprint-grid background applied to BOTH the login flow
# pages (via branding_default_flow_background) AND the "My
# applications" library page (via custom CSS body background — see
# templates/amd_enterprises_custom.css.j2 GOTCHA #2 for why the two
# need separate mechanisms), and custom CSS overriding the default
# orange accent with the brand blue (--ak-accent /
# --pf-global--primary-color--* / link colors — see that same file's
# GOTCHA #1).
#
# Authentik's branding_logo/branding_favicon/branding_default_flow_
# background/branding_custom_css fields all accept plain values
# directly via PATCH — images as data: URIs, CSS as a raw string
# (confirmed live). No separate file-upload endpoint needed here,
# unlike application icons which require the set_icon/ multipart
# endpoint (see tasks/bookmarks.yml for that gotcha).
#
# branding_title was already "AMD-Enterprises" (set outside ansible,
# pre-existing) — left as-is, only visual assets are managed here.
# -------------------------------------------------------------------------

- name: Get default brand
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/core/brands/"
    method: GET
    headers: "{{ headers }}"
  register: all_brands

- name: Select the default brand record
  ansible.builtin.set_fact:
    default_brand:
      json:
        results: "{{ all_brands.json.results | selectattr('default') | list }}"

- name: Read AMD-Enterprises logo SVG
  ansible.builtin.set_fact:
    amd_enterprises_logo_b64: "{{ lookup('file', role_path + '/files/amd_enterprises_logo.svg') | b64encode }}"

- name: Read AMD-Enterprises favicon SVG
  ansible.builtin.set_fact:
    amd_enterprises_favicon_b64: "{{ lookup('file', role_path + '/files/amd_enterprises_favicon.svg') | b64encode }}"

- name: Read AMD-Enterprises flow background SVG
  ansible.builtin.set_fact:
    amd_enterprises_flow_bg_b64: "{{ lookup('file', role_path + '/files/amd_enterprises_flow_bg.svg') | b64encode }}"

- name: Render AMD-Enterprises custom CSS (templates in the flow-bg data URI)
  ansible.builtin.set_fact:
    amd_enterprises_custom_css: >-
      {{ lookup('template', role_path + '/templates/amd_enterprises_custom.css.j2') }}
  vars:
    AMD_ENTERPRISES_FLOW_BG_DATA_URI: "data:image/svg+xml;base64,{{ amd_enterprises_flow_bg_b64 }}"

- name: Apply AMD-Enterprises branding to default brand
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/core/brands/{{ default_brand.json.results[0].brand_uuid }}/"
    method: PATCH
    headers: "{{ headers }}"
    body_format: json
    body:
      branding_title: "AMD-Enterprises"
      branding_logo: "data:image/svg+xml;base64,{{ amd_enterprises_logo_b64 }}"
      branding_favicon: "data:image/svg+xml;base64,{{ amd_enterprises_favicon_b64 }}"
      branding_default_flow_background: "data:image/svg+xml;base64,{{ amd_enterprises_flow_bg_b64 }}"
      branding_custom_css: "{{ amd_enterprises_custom_css }}"
      # settings.layout.type controls the "My applications" library page
      # grid: row (default, one column of full-width rows) vs 2-column
      # vs 3-column (a proper tile grid, more myapps.microsoft.com-like).
      # Read by web/src/user/LibraryPage's uiConfig via GET
      # /api/v3/core/users/me/ (user.settings, brand attrs merged in) —
      # confirmed live: PATCHing this and re-fetching /core/users/me/
      # shows settings.layout.type immediately reflects the new value.
      attributes:
        settings:
          layout:
            type: "3-column"
    status_code: [200]
  when: default_brand.json.results | length > 0
