---
# The bot runs as an unprivileged system user, created by the role if absent.
grafana_ack_bot_user: hermes
grafana_ack_bot_group: hermes

# false on a standby replica: its state.json does not know the primary's live messages, so the
# startup orphan sweep would delete them (happened 2026-11-16). Set per host in the inventory.
grafana_ack_bot_channel_reconcile: true
