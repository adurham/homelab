---
- name: Configure /etc/hosts for cluster members
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item].ansible_host }} {{ item }} {{ item }}.homelab.local"
    state: present
  loop: "{{ groups['proxmox_nodes'] }}"

- name: Remove Enterprise Repository Source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
    state: absent

- name: Remove Ceph Enterprise Repository Source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/ceph.sources
    state: absent

- name: Enable No-Subscription Repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve {{ ansible_facts['distribution_release'] }} pve-no-subscription"
    state: present
    filename: pve-no-subscription

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - vim
      - htop
      - git
      - curl
      - zsh
    state: present

# ----- pve fleet hardening -----

- name: Purge unused squid from pve hosts
  # Was running on pve02 with zero access.log entries — leftover from
  # an earlier experiment, listening on 0.0.0.0:3128 unprotected. The
  # supported squid lives in CT 108 (roles/squid_proxy/) on :3129.
  ansible.builtin.apt:
    name: squid
    state: absent
    purge: true

- name: Disable + mask rpcbind (NFS portmap; we don't use NFS)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - rpcbind.service
    - rpcbind.socket
  failed_when: false  # idempotent: already-masked / not-installed both ok

- name: Persist overlay kernel module load at boot (host-level, for LXC docker/containerd guests)
  # 2026-07-28: power blip rebooted pve01 without the overlay module auto-loading
  # (no /etc/modules-load.d entry existed on any node). Unprivileged LXCs can't
  # modprobe themselves, so frigate-01's containerd hung retrying modprobe
  # overlay forever -> docker never started -> Nest cameras dark for 45h until
  # manually caught. This makes the module load unconditionally on every boot
  # on all 3 pve nodes, closing that specific failure mode fleet-wide.
  ansible.builtin.copy:
    dest: /etc/modules-load.d/overlay.conf
    content: |
      overlay
    owner: root
    group: root
    mode: "0644"

# 2026-10-03: pve01's /etc/aliases.db was MISSING while /etc/aliases existed
# -- postfix's alias_maps = hash:/etc/aliases then fails every local
# delivery lookup ("alias database unavailable"), so all root mail (vzdump
# notifications, smartd, cron) deferred in the queue for days. newaliases
# rebuilt it and 46 stuck messages delivered immediately. Not worth
# root-causing why dpkg lost the .db on that one node; ensuring it exists
# is the durable fix and is cheap to keep idempotent.
- name: Check postfix alias database exists
  ansible.builtin.stat:
    path: /etc/aliases.db
  register: pve_aliases_db

- name: Build /etc/aliases.db when missing (root mail defers without it)
  ansible.builtin.command: newaliases
  when: not pve_aliases_db.stat.exists
  changed_when: true

# ----- Orphan guest detector -----
# The 2026-10-21 gap this closes: two unmanaged duplicate guests were running
# on the cluster and NOTHING alerted -- a container double-started on two
# nodes with the same MACs/IPs for 22h, and VM 'ts-01' running on pve01 while
# the real one ran on pve02 (its NIC counters at zero). `pct list`/`qm list`
# only know guests registered in THAT node's config, so a leftover lxc-start or
# /usr/bin/kvm is invisible to Proxmox. This timer compares the two views every
# 5 minutes, journals an ORPHAN-GUEST marker and exports an
# orphan_guests{node,vmid,kind} textfile metric that the `orphan_guests` Grafana
# rule (critical) watches. See files/orphan-guest-check.sh for the full writeup.

- name: Ensure orphan-guest textfile output directory exists
  ansible.builtin.file:
    path: "{{ proxmox_common_orphan_guest_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install orphan guest detector script
  ansible.builtin.copy:
    src: orphan-guest-check.sh
    dest: /usr/local/bin/orphan-guest-check.sh
    owner: root
    group: root
    mode: '0755'
  notify: Restart orphan-guest-check timer

- name: Install orphan guest detector systemd service
  ansible.builtin.template:
    src: orphan-guest-check.service.j2
    dest: /etc/systemd/system/orphan-guest-check.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart orphan-guest-check timer

- name: Install orphan guest detector systemd timer
  ansible.builtin.template:
    src: orphan-guest-check.timer.j2
    dest: /etc/systemd/system/orphan-guest-check.timer
    owner: root
    group: root
    mode: '0644'
  notify: Restart orphan-guest-check timer

- name: Flush handlers so the timer picks up a fresh script/unit before enabling
  ansible.builtin.meta: flush_handlers

- name: Start and enable orphan guest detector timer
  ansible.builtin.systemd:
    name: orphan-guest-check.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Run one orphan scan immediately so the textfile exists before the first timer tick
  ansible.builtin.systemd:
    name: orphan-guest-check.service
    state: started
  changed_when: false

# ── Lab VM snapshots: the only protection that fits ──────────────────────
# VMs 200-205 (Tanium lab) and 270-272 (small clones) are real state the owner
# does not consider disposable, but their disks are 500 GB-1 TB of sparse zvol:
# vzdump is impractical and a full zfs send does not fit any node's free space.
# Weekly ZFS snapshots cost ~0 bytes until blocks diverge and are the only
# protection that fits. Deliberately plain `zfs snapshot`, NOT `qm snapshot` --
# qm writes a snapshot stanza into the guest config and takes a VM lock, and a
# half-failed delete leaves the VM locked in `snapshot-delete` with a phantom
# section (hit on vm270 while building this). See files/lab-vm-snapshots.sh.
- name: Install lab VM snapshot script
  ansible.builtin.copy:
    src: lab-vm-snapshots.sh
    dest: /usr/local/bin/lab-vm-snapshots.sh
    owner: root
    group: root
    mode: '0755'
  notify: Restart lab-vm-snapshots timer

- name: Install lab VM snapshot systemd service
  ansible.builtin.template:
    src: lab-vm-snapshots.service.j2
    dest: /etc/systemd/system/lab-vm-snapshots.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart lab-vm-snapshots timer

- name: Install lab VM snapshot systemd timer
  ansible.builtin.template:
    src: lab-vm-snapshots.timer.j2
    dest: /etc/systemd/system/lab-vm-snapshots.timer
    owner: root
    group: root
    mode: '0644'
  notify: Restart lab-vm-snapshots timer

- name: Enable and start lab VM snapshot timer
  ansible.builtin.systemd:
    name: lab-vm-snapshots.timer
    enabled: true
    state: started
    daemon_reload: true
