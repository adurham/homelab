# Crash capture + fast recovery for the pve nodes (owner-approved 2026-10-30).
#
# Why: these nodes were dying of a kernel fault that left no trace behind. The
# one record that survived -- in pve02's firmware pstore -- was an Oops in ZFS's
# ARC eviction path (arc_evictable_space_decrement, comm arc_evict). After it,
# the machine wedged: no logs, no network in either direction, link still up,
# until the software watchdog or the HA fence reset it ~2 minutes later.
#
# Armed here:
#   panic_on_oops     an Oops panics instead of leaving a wedged kernel that can
#                     no longer write its own logs. The panic writes a record
#                     into the firmware (efi_pstore) slot that systemd-pstore
#                     archives on the next boot under /var/lib/systemd/pstore/.
#   softlockup_panic  a CPU stuck in kernel code for >20 s panics instead of
#                     hanging silently.
#   hardlockup_panic  same for an NMI-detected hard lockup (nmi_watchdog is
#                     enabled on these hosts).
#   panic             reboot 20 s after a panic. The kernel default of 0 means
#                     "hang forever", which is what turned a crash into a
#                     multi-minute outage.
#
# Reverting: delete this file and run `sysctl --system`; the kernel returns to
# defaults (panic_on_oops=0, softlockup_panic=0, hardlockup_panic=0, panic=0).
kernel.panic_on_oops = 1
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.panic = 20
