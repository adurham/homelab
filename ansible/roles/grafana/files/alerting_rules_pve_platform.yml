# PVE platform alerts: HA fencing, e1000e NIC hang, ZFS pool and vzdump capacity.
# Source of truth is this file (roles/grafana/files/alerting_rules_pve_platform.yml); the
# 'Provision Grafana Alert Rules (pve platform)' task copies it next to the media-pipeline file.
apiVersion: 1
groups:
  - orgId: 1
    name: pve-platform
    folder: Infrastructure
    interval: 1m
    rules:
      - uid: pve_node_fenced
        title: PVE node fenced or lost by HA
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: max by (id, state) (pve_ha_state{id=~"node/.*", state=~"fence|gone|unknown"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: HA reports {{ $labels.id }} in state {{ $labels.state }}
          description: 'The Proxmox HA manager no longer sees {{ $labels.id }} as online (state {{ $labels.state
            }}). A node that stays in ''unknown'' for about a minute is fenced and its HA services are recovered
            on the other nodes about 3 minutes after the loss. If the node is pve01 this is probably the e1000e
            Hardware Unit Hang (docs/pve01-network-stall-2026-11-15.md): when it is back, read /root/kernel_witness.log
            and the newest directory under /root/nic-hang/ on the node BEFORE anything else, then move displaced
            guests back (ha-manager migrate ct:<id> <node>) -- HA does not fail guests back by itself.'
        labels:
          severity: critical
        isPaused: false
      - uid: pve_nic_hang_recent
        title: PVE node NIC reported a Hardware Unit Hang in the last 24h
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: max by (instance) ((time() - pve_nic_hang_last_timestamp_seconds) < 86400 and pve_nic_hang_last_timestamp_seconds
                > 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: '{{ $labels.instance }}: e1000e Detected Hardware Unit Hang within the last 24h'
          description: 'The persistent kernel witness on {{ $labels.instance }} logged ''e1000e ... Detected Hardware
            Unit Hang'' in the last 24 hours. It is published from /root/kernel_witness.log, so it appears when
            the node is back (the network is dead during the hang itself; pve_node_fenced is the live signal). pve01
            runs TSO/GSO off as an UNPROVEN mitigation: a hang with TSO off means the mitigation did not work. Evidence
            on the node: /root/kernel_witness.log (full kernel log) and /root/nic-hang/<stamp>/ (registers, ring
            state, interrupts, pcap, one pass every 2 s). If it recurs, try in this order: ethtool -A nic0 rx off
            tx off, then the disable-k1 private flag, then BIOS/ME update with AMT off, then TX checksum offload
            off.'
        labels:
          severity: critical
        isPaused: false
      - uid: pve_nic_mitigation_missing
        title: pve01 NIC TSO is on again (hang mitigation not in effect)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: max by (instance) (pve_nic_offload_enabled{instance="pve01", feature="tso"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: pve01 nic0 has TCP segmentation offload enabled again
          description: 'pve01''s e1000e hang mitigation is TSO/GSO off (post-up in /etc/network/interfaces, roles/proxmox_network).
            TSO reads on, so the setting was lost: check `ethtool -k nic0 | grep segmentation` on pve01 and re-apply
            `ethtool -K nic0 tso off gso off`.'
        labels:
          severity: warning
        isPaused: false
      - uid: pve_kernel_witness_down
        title: PVE kernel witness is not running
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: max by (instance) (pve_kernel_witness_active{instance=~"pve0[123]"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: kernel-witness.service is not running on {{ $labels.instance }}
          description: kernel-witness.service keeps the full kernel log on disk across the HA self-fence reset (the
            journal is volatile) and starts the NIC hang capture. While it is down a hang leaves no evidence. `systemctl
            status kernel-witness` on the node; roles/pve_stall_witness deploys it.
        labels:
          severity: warning
        isPaused: false
      - uid: pve_pool_capacity_high
        title: PVE ZFS pool above 80% (early warning)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: max by (id) (100 * pve_disk_usage_bytes{id=~"storage/.*/nvme-data"} / pve_disk_size_bytes{id=~"storage/.*/nvme-data"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: '{{ $labels.id }}: ZFS pool is above 80% allocated'
          description: 'Early-warning tier below pve_zfs_pool_capacity_high (85%). The pool holds every guest disk,
            the weekly lab snapshots and this node''s vzdump archives; pve02 sat at 85% with nobody told. See what
            holds space: `zfs list -o name,used,refer -S used`, `zfs list -t snap -o name,used -S used` (the churny
            Tanium zvols hold up to ~60 GiB per weekly) and the vzdump dataset. lab-vm-snapshots.sh prunes weeklies
            itself above 78%. Measured as used/(used+avail) of the pool dataset, which runs a few points above zpool''s
            capacity.'
        labels:
          severity: warning
        isPaused: false
      - uid: pve_vzdump_storage_high
        title: PVE vzdump storage above 85% of its quota
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: max by (id) (100 * pve_disk_usage_bytes{id=~"storage/.*/vzdump-nvme"} / pve_disk_size_bytes{id=~"storage/.*/vzdump-nvme"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 3h
        annotations:
          summary: '{{ $labels.id }} is above 85% of its quota'
          description: 'The vzdump dataset has a ZFS quota (roles/proxmox_storage, pve_backup_quota_gib) sized as
            archives kept + the largest single archive, because vzdump writes the new archive before pruning the
            old one. Sustained above 85% means the next backup run can fail. Usual causes: archives of guests that
            moved nodes (pve-vzdump-supersede.timer deletes those daily; check it ran) or a new large guest in the
            job''s vmid list.'
        labels:
          severity: warning
        isPaused: false
      - uid: pve_vzdump_supersede_stale
        title: vzdump superseded-archive cleanup has not succeeded for 3 days
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: max by (instance) (time() - pve_vzdump_supersede_last_success_timestamp_seconds)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 259200
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: '{{ $labels.instance }}: pve-vzdump-supersede has not succeeded for over 3 days'
          description: pve-vzdump-supersede.timer deletes a node's vzdump archives once a newer archive of the same
            guest exists on another node. Without it, every HA failover or migration leaves a full archive behind
            on the old node. `journalctl -u pve-vzdump-supersede` on the node; it aborts without deleting anything
            if any node's storage listing cannot be read.
        labels:
          severity: warning
        isPaused: false
      - uid: pve_pool_root_dataset_growth
        title: PVE pool root dataset holds more than 20 GiB
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: max by (instance, pool) (pve_zfs_root_dataset_bytes)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 21474836480
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: '{{ $labels.instance }}: {{ $labels.pool }} root dataset holds files outside any guest or child
            dataset'
          description: 'Every legitimate consumer of the ZFS pool is a child dataset (guest disks, vzdump-backups,
            the off-site staging dataset). Bytes in the ROOT dataset itself are files somebody wrote straight into
            /nvme-pool: per-guest and per-dataset space checks cannot see them, and on 2026-11-15 a 399 GiB backup
            staging directory sat there for a week. Find them with `du -xh --max-depth=1 /nvme-pool | sort -h |
            tail`. Expected baseline on pve01: ~7 GiB (root-backups, haos-test).'
        labels:
          severity: warning
        isPaused: false
      - uid: pve_guest_backup_age_high
        title: A guest's newest vzdump archive is older than 36 h
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: max by (vmid, name) (pve_vzdump_guest_newest_age_seconds)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 129600
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2h
        annotations:
          summary: '{{ $labels.name }} ({{ $labels.vmid }}): no new vzdump archive for over 36 h'
          description: 'Measured across the whole cluster by pve-vzdump-supersede.timer (05:20 daily), for every
            guest a backup job covers: 1e10 means the guest has no archive at all. Two missed nightly runs trip
            this. Typical causes: the vzdump-backups quota is full (see pve_vzdump_storage_high), the guest is locked,
            or it moved to a node whose job did not pick it up. `pvesh get /nodes/<node>/tasks --typefilter vzdump`
            shows the failing run.'
        labels:
          severity: warning
        isPaused: false
      - uid: pve_lab_snapshot_pressure_prune
        title: Lab snapshot capacity guard destroyed weekly snapshots
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: max by (instance) (pve_lab_snapshot_pressure_prunes)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: '{{ $labels.instance }}: the capacity guard destroyed weekly lab snapshots on its last run'
          description: 'lab-vm-snapshots.sh destroyed weekly ZFS snapshots because the pool was above 78 % (it never
            goes below 2 weeklies per volume). Those snapshots are the only on-site restore points of the Tanium
            VMs, so treat this as a symptom: find what is actually filling the pool (`zfs list -o name,used -S used`,
            and pve_pool_root_dataset_growth) instead of letting the guard keep eating restore points.'
        labels:
          severity: warning
        isPaused: false
      - uid: patroni_no_sync_standby
        title: Patroni cluster has no healthy sync standby
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: sum by (scope) (max by (scope, instance) (patroni_sync_standby))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: Patroni cluster {{ $labels.scope }} has no synchronous standby
          description: 'The Postgres pair behind Grafana (and authentik) is down to a single copy: a leader loss
            now means data loss or an outage. On 2026-11-15 pg-02 sat in this state for 12 hours after the 06:37
            pve01 fence (its Postgres was up in recovery, waiting for WAL it could never fetch, refusing connections,
            with no primary_conninfo) while ha-manager showed everything started and the Patroni REST port was listening.
            Look: `patronictl -c /etc/patroni/*.yml list` in the pg CTs, `journalctl -u patroni`, the Postgres log.
            If the replica is stuck, `patronictl reinit <scope> <member> --force` re-clones it from the leader (the
            databases are ~400 MB in total; that is what fixed it).'
        labels:
          severity: critical
        isPaused: false
      - uid: patroni_postgres_not_running
        title: A Patroni member's Postgres is not running
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: min by (scope, instance) (patroni_postgres_running)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: '{{ $labels.instance }} ({{ $labels.scope }}): Postgres is not running under Patroni'
          description: Patroni is up and answering its REST API but reports its Postgres as not running.
        labels:
          severity: warning
        isPaused: false
      - uid: patroni_scrape_down
        title: Patroni metrics are not being scraped
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: max by (instance) (up{job="patroni"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: '{{ $labels.instance }}: Patroni''s /metrics is unreachable from vmagent'
          description: The patroni job (added to both vmagents on 2026-11-15) cannot scrape :8008/metrics, so patroni_no_sync_standby
            is blind. Check the CT, Patroni's REST listener and the CT firewall (vmagent comes from vm-01 and graf-02).
        labels:
          severity: warning
        isPaused: false
