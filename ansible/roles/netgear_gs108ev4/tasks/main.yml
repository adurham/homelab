---
# NETGEAR GS108Ev4 "Plus/Easy Smart" switch -- upstream of pve01/02/03
# (ports 3/4/5) and the two Mac Studios (ports 7/8). No SSH/SNMP/API;
# config is via CGI form POSTs served by a React SPA (see
# files/gs108ev4_client.py for the reverse-engineered login flow).
#
# STATUS (2026-08-04): intentionally a NO-OP. Config is managed MANUALLY
# via the switch's web UI (http://192.168.86.62, password in 1Password
# under "NETGEAR GS108Ev4" -- rotated off the factory default 2026-08-04,
# deliberately not stored in this repo/vault).
#
# Why manual instead of automated:
#   1. The switch only allows 4 concurrent HTTP sessions with a 5-min
#      timeout and no persistent API -- every config change requires a
#      fresh browser-driven login+CSRF-hash dance, which the reverse-
#      engineered CGI client (gs108ev4_client.py) can technically do, but
#      the actual VLAN-priority submission endpoint (`submitPriority()`)
#      was never found in the switch's shipped JS bundles despite full
#      deobfuscation -- guessing POST field names against a live switch
#      upstream of a 3-node Proxmox cluster was judged not worth the risk.
#   2. The password is intentionally NOT in this repo's vault. The user
#      rotated it off the factory default as a security improvement;
#      routing Ansible around that (e.g. re-storing it just to automate
#      config) would undermine the reason it was rotated.
#   3. Everything currently configured (VLAN 20, port-based QoS, storm
#      control, IGMP snooping) was verified working via direct testing
#      (link-toggle port mapping, tcpdump, VictoriaMetrics) at the time
#      it was set -- re-running an automated apply on every playbook run
#      would add risk (a bad field-name guess reconfiguring the switch)
#      for no benefit, since the config isn't expected to drift.
#
# Current live config (source of truth: docs/ipam.md "Physical switch
# chain" + "PVE Sync network" sections -- update THERE first, then here):
#   - VLAN 20 "pve-sync": Advanced 802.1Q mode, ports 3/4/5 tagged
#     (PVID stays 1 for LAN), all other ports excluded.
#   - QoS: Port-based mode, ports 3/4/5 = Critical priority, all
#     others = Low (default).
#   - Broadcast Filtering: ON, Storm Control Rate = 32 Mbps on all 8
#     ports (broadcast + multicast + unknown-unicast).
#   - IGMP Snooping: ON for VLAN 1 (the LAN VLAN, where actual
#     streaming/casting multicast lives -- VLAN 20 carries only unicast
#     corosync/replication traffic, nothing to snoop there). Block
#     Unknown Multicast Address and Validate IGMPv3 IP Header both left
#     OFF deliberately, so multicast can't silently break even without
#     a confirmed IGMP querier on the LAN.
#
# If this ever needs to change: log into the switch UI directly. If
# programmatic management becomes worth revisiting (e.g. the switch gets
# replaced with something that has a real API), gs108ev4_client.py and
# the discovery task below are still here as a starting point -- but
# finish reverse-engineering submitPriority() and get explicit sign-off
# before wiring up anything that POSTs config changes automatically.

- name: NETGEAR GS108Ev4 switch config is managed manually (see task notes)
  ansible.builtin.debug:
    msg:
      - "Switch config (VLAN 20, port-based QoS, storm control, IGMP snooping)"
      - "is intentionally NOT managed by Ansible. See docs/ipam.md and this"
      - "role's tasks/main.yml header comment for the current state + why."
      - "Login: http://192.168.86.62, password in 1Password ('NETGEAR GS108Ev4')."

# --- Historical discovery tooling, kept for reference only. NOT part of
# the normal task flow (tagged 'never' so it only runs if explicitly
# requested), and untested against the switch's CURRENT (rotated)
# password. Do not uncomment/wire up config-changing tasks without first
# re-running discovery and finding the real submitPriority()-equivalent
# endpoint for whatever you're trying to automate.

- name: (discover, historical -- see header) Log in and dump reachable admin pages
  ansible.builtin.command:
    cmd: >
      python3 {{ role_path }}/files/gs108ev4_client.py
      --host {{ netgear_gs108ev4_current_ip | default('192.168.86.62') }}
      --password {{ netgear_gs108ev4_password }}
      --discover
  delegate_to: localhost
  run_once: true
  register: discover_result
  tags: [netgear_switch_discover, never]

- name: (discover) Show discovery output
  ansible.builtin.debug:
    var: discover_result.stdout_lines
  tags: [netgear_switch_discover, never]
