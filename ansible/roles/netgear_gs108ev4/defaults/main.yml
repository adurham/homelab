---
# NETGEAR GS108Ev4 switch config is managed MANUALLY via the switch's web
# UI (http://192.168.86.163; DHCP-pinned by a dnsmasq reservation added
# 2026-10-30 -- it DHCPs and moves, so find it by MAC 28:94:01:77:1d:80 if that
# ever changes) -- NOT by this Ansible role. See
# roles/netgear_gs108ev4/tasks/main.yml and docs/ipam.md "PVE Sync
# network" for the current live config and why automation was
# deliberately not pursued (password intentionally kept out of this
# repo/vault after being rotated off the factory default 2026-08-04).
#
# These vars exist only so the historical discovery tooling in
# roles/netgear_gs108ev4/tasks/main.yml (tagged netgear_switch_discover,
# never runs by default) has something to point at if it's ever revived.
# netgear_gs108ev4_password is deliberately NOT sourced from the vault --
# pass it via -e on the CLI if you ever actually run the discover tag.
# pinned by the dnsmasq reservation added 2026-10-30 (it DHCPs and moves)
netgear_gs108ev4_current_ip: "192.168.86.163"
