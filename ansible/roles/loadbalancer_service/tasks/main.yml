---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - nginx
      - git
      - socat
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

# LAN ingress: lb-01's eth1 (vmbr0) is a DHCP client with a Google Home
# reservation for {{ lb_lan_ingress_ip }} keyed on this NIC's MAC.
#
# DHCP (not static) because .86 lives inside the Nest's DHCP pool (.20-.250):
# a static address is invisible to the router and can be handed to another
# device at any time (the frigate-01 .85 collision, 2026-10-18). The
# reservation also makes the NIC appear in the Home app, which the
# port-management UI requires (device picker, no manual IP entry).
#
# Implemented as a systemd-networkd DROP-IN, not a replacement for
# eth1.network: Proxmox regenerates eth1.network ("autoconfigured by PVE")
# whenever the CT's net config or the container itself starts, which would
# silently discard a full-file override. Drop-in files survive that.
#
# CRITICAL: UseRoutes=false — default egress must stay via the private SDN
# gateway on eth0, or lb-01's return traffic to backends takes the LAN path and
# causes asymmetric-routing 502s (the bug we hit when first adding this NIC).
# UseDNS=false for the same reason: DNS must follow eth0's SDN config.
- name: Ensure systemd-networkd drop-in dir for the LAN ingress interface
  ansible.builtin.file:
    path: /etc/systemd/network/eth1.network.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure LAN ingress interface (DHCP, no routes, no DNS)
  ansible.builtin.copy:
    dest: /etc/systemd/network/eth1.network.d/10-lan-ingress.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by ansible (loadbalancer_service). Do not edit by hand.
      # LAN ingress: DHCP with a Google Home reservation; never take the
      # default route or DNS from the LAN side.
      [Network]
      DHCP = yes
      IPv6AcceptRA = false

      [DHCPv4]
      UseRoutes = false
      UseDNS = false
      SendHostname = yes
      ClientIdentifier = mac

      # Return path for port-forwarded traffic. Inbound arrives on eth1 from
      # the Nest, but the main table's default route points at the SDN
      # gateway, so replies left via eth0 and the Nest's DNAT conntrack never
      # saw them -> every external connection timed out (diagnosed 2026-10-18
      # by tcpdump on pve01: SYNs arrived, no SYN-ACK ever left).
      # Any packet sourced from the LAN leg uses table 100, which points back
      # at the Nest. Traffic sourced from 172.16.0.30 (backend connections)
      # never matches this rule, so asymmetric-routing 502s stay fixed.
      # NOTE: a `systemctl restart systemd-networkd` is required after editing
      # this file — `networkctl reconfigure eth1` alone does not pick up the
      # routing-policy sections.
      [Route]
      Destination = 0.0.0.0/0
      Gateway = 192.168.86.1
      Table = 100

      [Route]
      Destination = 192.168.86.0/24
      Scope = link
      Table = 100

      # LAN-sourced traffic to the private SDN must still use the main table
      # (eth0); without this, table 100's default would send it to the Nest.
      [RoutingPolicyRule]
      From = 192.168.86.0/24
      To = 172.16.0.0/24
      Table = main
      Priority = 900

      [RoutingPolicyRule]
      From = 192.168.86.0/24
      Table = 100
      Priority = 1000
  notify: Restart systemd-networkd

- name: Create SSL Directory
  ansible.builtin.file:
    path: /etc/nginx/ssl
    state: directory
    mode: '0755'

- name: Install acme.sh
  ansible.builtin.shell: |
    set -o pipefail
    curl https://get.acme.sh | sh -s email=admin@lab.amd-e.com
  args:
    executable: /bin/bash
    creates: /root/.acme.sh/acme.sh

- name: Register ACME Account (Let's Encrypt)
  ansible.builtin.shell: |
    set -o pipefail
    /root/.acme.sh/acme.sh --register-account -m admin@lab.amd-e.com --server letsencrypt
  args:
    executable: /bin/bash
  register: loadbalancer_service_acme_reg
  changed_when: "'Account created' in loadbalancer_service_acme_reg.stdout"
  failed_when: >
    loadbalancer_service_acme_reg.rc != 0 and
    "already registered" not in loadbalancer_service_acme_reg.stdout and
    "Account already exists" not in loadbalancer_service_acme_reg.stderr

# acme.sh saves the DNS-plugin env var into account.conf on every run.
# Past runs corrupted SAVED_DEDYN_TOKEN to a literal placeholder string
# ("SAVED_...Qr7'"), which then masked $DEDYN_TOKEN at issue time and made
# deSEC return "invalid domain". Strip any saved token before issuing — the
# real one is exported below from vault every time anyway.
- name: Remove any stale SAVED_DEDYN_TOKEN from acme.sh account.conf
  ansible.builtin.lineinfile:
    path: /root/.acme.sh/account.conf
    regexp: '^SAVED_DEDYN_TOKEN='
    state: absent
  failed_when: false  # account.conf may not exist on first run

# --dnssleep 60 gives deSEC time to commit both TXT records on
# _acme-challenge.chi.lab.amd-e.com before LE polls. Without it the second
# challenge often races and LE returns "Incorrect TXT record".
- name: Issue Certificate (DNS-01 Wildcard)
  ansible.builtin.shell: |
    set -o pipefail
    /root/.acme.sh/acme.sh --issue \
    --server letsencrypt \
    --dns dns_desec \
    --dnssleep 60 \
    -d "*.chi.lab.amd-e.com" \
    -d chi.lab.amd-e.com
  environment:
    DEDYN_TOKEN: "{{ acme_dedyn_token_proxmox }}"
    noip_username: "{{ noip_username }}"
    noip_password: "{{ noip_password }}"
  no_log: true
  args:
    executable: /bin/bash
  register: loadbalancer_service_acme_issue
  changed_when: "'Cert success' in loadbalancer_service_acme_issue.stdout"
  failed_when: >
    loadbalancer_service_acme_issue.rc != 0 and
    "Domains not changed" not in loadbalancer_service_acme_issue.stdout

- name: Install Certificate to Nginx (Wildcard) # noqa: no-handler
  ansible.builtin.shell: |
    set -o pipefail
    /root/.acme.sh/acme.sh --install-cert -d "*.chi.lab.amd-e.com" \
    --key-file       /etc/nginx/ssl/wildcard.key \
    --fullchain-file /etc/nginx/ssl/wildcard.fullchain.cer \
    --reloadcmd     "systemctl reload nginx"
  args:
    executable: /bin/bash
  when: loadbalancer_service_acme_issue.changed

- name: Deploy WhoAmI Script
  ansible.builtin.template:
    src: whoami.py.j2
    dest: /usr/local/bin/whoami.py
    mode: '0755'
    owner: root
    group: root
  notify: Restart WhoAmI

- name: Deploy WhoAmI Service
  ansible.builtin.template:
    src: whoami.service.j2
    dest: /etc/systemd/system/whoami.service
    mode: '0644'
    owner: root
    group: root
  notify: Restart WhoAmI

- name: Start WhoAmI Service
  ansible.builtin.systemd:
    name: whoami
    state: started
    enabled: true
    daemon_reload: true

- name: Add Authentik to Hosts File
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ ip_authentik }} auth.chi.lab.amd-e.com"
    state: present

- name: Deploy Nginx Configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/proxmox
    mode: '0644'
    owner: root
    group: root
  notify:
    - Validate Nginx Config
    - Restart Nginx

# 2026-09-30 live incident: nginx workers run as www-data, but the SHARED
# temp/spool tree (/var/lib/nginx/{proxy,body,...}) was left owned by
# `nobody` (the compiled-in default user of a throwaway test instance that
# ran without a `user` directive). Proxied responses larger than nginx's
# in-memory buffers must spill to those dirs; with them unwritable every
# large response (the 85MB gallery manifest, the Tanium API) failed mid-body
# with `open() ... failed (13: Permission denied) while reading upstream` —
# which the browser saw as "Failed to load gallery". Enforce ownership on
# every deploy so no stray root/nobody-run instance can break prod again.
- name: Ensure nginx temp/spool tree is owned by the worker user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: root
    mode: '0700'
  loop:
    - /var/lib/nginx/proxy
    - /var/lib/nginx/body
    - /var/lib/nginx/fastcgi
    - /var/lib/nginx/scgi
    - /var/lib/nginx/uwsgi

- name: Enable Nginx Site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/proxmox
    dest: /etc/nginx/sites-enabled/proxmox
    state: link
  notify: Restart Nginx

- name: Remove Default Site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart Nginx

- name: Create Proxmox Web Directory
  ansible.builtin.file:
    path: /var/www/html/proxmox
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Deploy OIDC Redirect Page
  ansible.builtin.template:
    src: redirect_oidc.html.j2
    dest: /var/www/html/proxmox/redirect_oidc.html
    mode: '0644'
    owner: root
    group: root

  notify: Restart Nginx

- name: Configure DDNS (No-IP)
  ansible.builtin.include_tasks: ddns.yml
