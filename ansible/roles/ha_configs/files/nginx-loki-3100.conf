upstream loki_backend {
    server 172.16.0.75:3100 max_fails=2 fail_timeout=10s;
    server 172.16.0.76:3100 max_fails=2 fail_timeout=10s;
    server 172.16.0.77:3100 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 3100;
    server_name _;
    client_max_body_size 0;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://loki_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /loki/api/v1/tail {
        proxy_pass http://loki_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
