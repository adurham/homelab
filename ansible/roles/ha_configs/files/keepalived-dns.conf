vrrp_script chk_named {
    script "/usr/bin/dig +time=1 +tries=1 +short @127.0.0.1 localhost A"
    interval 2
    fall 2
    rise 2
    weight -20
}

vrrp_instance DNS {
    state MASTER            # BACKUP + priority 100 on dns-02
    interface eth0
    virtual_router_id 52
    priority 150
    advert_int 1
    unicast_src_ip 172.16.0.9        # 172.16.0.14 on dns-02
    unicast_peer { 172.16.0.14 }     # 172.16.0.9 on dns-02
    authentication {
        auth_type PASS
        auth_pass <vrrp-secret>
    }
    virtual_ipaddress {
        172.16.0.10/24
    }
    track_script { chk_named }
}
