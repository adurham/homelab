vrrp_script chk_nginx {
    script "/usr/bin/curl -s -o /dev/null -m 2 http://127.0.0.1:80/"
    interval 2
    fall 2
    rise 2
    weight -20
}

vrrp_instance PG {
    state MASTER            # BACKUP + priority 100 on lb-02
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    unicast_src_ip 172.16.0.29        # 172.16.0.31 on lb-02
    unicast_peer { 172.16.0.31 }      # 172.16.0.29 on lb-02
    authentication {
        auth_type PASS
        auth_pass <vrrp-secret>       # ~/.hermes/secrets/vrrp.pw
    }
    virtual_ipaddress {
        172.16.0.30/24
    }
    track_script { chk_nginx }
}
