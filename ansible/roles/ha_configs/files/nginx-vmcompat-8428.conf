upstream vminsert_compat {
    server 172.16.0.57:8480 max_fails=3 fail_timeout=10s;
    server 172.16.0.58:8480 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8428;
    server_name _;

    # Remote-write batches routinely exceed nginx's 1m default; a 413 here
    # makes pushers retry forever and looks like nothing is wrong.
    client_max_body_size 64m;

    # Influx line protocol needs its own mapping — the /api/ rule below
    # would otherwise send it to the Prometheus handler.
    location = /write {
        proxy_pass http://vminsert_compat/insert/0/influx/write;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
    }

    location = /api/v2/write {
        proxy_pass http://vminsert_compat/insert/0/influx/api/v2/write;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://vminsert_compat/insert/0/prometheus/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
