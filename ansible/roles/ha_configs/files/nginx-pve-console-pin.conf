# PVE console (noVNC / xterm) pinning — must live inside the
# `server { server_name proxmox.chi.lab.amd-e.com; ... }` block in
# /etc/nginx/sites-available/proxmox, ABOVE `location /`.
#
# Why: the vncproxy ticket and the VNC/xterm websocket are NODE-LOCAL. Behind
# the VIP the round-robin `proxmox_cluster` upstream hands the request to a
# different node than the one holding the ticket, which answers 400 and the UI
# sits on "Connecting..." forever.
#
# And PVE validates the upgrade itself: Host must be the node's own FQDN and a
# browser Origin has to match that Host. A browser behind the VIP sends
# Origin: https://proxmox.chi.lab.amd-e.com, so BOTH headers are rewritten here
# (measured: Host=pve02… + Origin=https://proxmox.chi.lab… -> 400;
#            Host=pve02… + Origin=https://pve02… -> 101 + RFB banner).

    # pve01: console/VNC/term endpoints only exist on the node running the guest.
    location ~ ^/api2/(json|extjs)/nodes/pve01/(qemu|lxc)/[0-9]+/(vncwebsocket|vncproxy|termproxy|spiceproxy)$ {
        proxy_pass https://192.168.86.11:8006;
        proxy_set_header Host pve01.chi.lab.amd-e.com;
        proxy_set_header Origin https://pve01.chi.lab.amd-e.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_verify off;
    }

    # pve02: console/VNC/term endpoints only exist on the node running the guest.
    location ~ ^/api2/(json|extjs)/nodes/pve02/(qemu|lxc)/[0-9]+/(vncwebsocket|vncproxy|termproxy|spiceproxy)$ {
        proxy_pass https://192.168.86.12:8006;
        proxy_set_header Host pve02.chi.lab.amd-e.com;
        proxy_set_header Origin https://pve02.chi.lab.amd-e.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_verify off;
    }

    # pve03: console/VNC/term endpoints only exist on the node running the guest.
    location ~ ^/api2/(json|extjs)/nodes/pve03/(qemu|lxc)/[0-9]+/(vncwebsocket|vncproxy|termproxy|spiceproxy)$ {
        proxy_pass https://192.168.86.13:8006;
        proxy_set_header Host pve03.chi.lab.amd-e.com;
        proxy_set_header Origin https://pve03.chi.lab.amd-e.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_verify off;
    }
