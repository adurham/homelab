---
# Repos cloned onto the gateway under /home/hermes/repos/<name>. The bot
# operates inside these clones — runs git/build/test, edits files, opens
# PRs back to GitHub via the SSH key + gh CLI auth set up by repos.yml.
#
# Each entry: name (also clone-dir name), url (SSH form so git push uses
# /home/hermes/.ssh/id_ed25519), description for the bot's overview at
# /home/hermes/repos/README.md.
hermes_gateway_repos:
  - name: hermes-agent
    url: git@github.com:adurham/hermes-agent.git
    description: "Adam's hermes-agent fork (the engine running on this LXC). Mirrors NousResearch/hermes-agent with personal patches."
  - name: homelab
    url: git@github.com:adurham/homelab.git
    description: "Proxmox cluster + Ansible automation (the repo that deploys this CT)."
  - name: exo
    url: git@github.com:adurham/exo.git
    description: "Adam's exo fork — distributed local LLM inference."
  - name: hermes-swarm
    url: git@github.com:adurham/hermes-swarm.git
    description: "Multi-agent swarm orchestration on top of hermes-agent."
  - name: opencode
    url: git@github.com:adurham/opencode.git
    description: "Adam's opencode fork."
  - name: ecobee-air-quality
    url: git@github.com:adurham/ecobee-air-quality.git
    description: "Pulls air-quality readings off Ecobee thermostat."
  - name: habitica-homelab
    url: git@github.com:adurham/habitica-homelab.git
    branch: self-host-local  # default branch on GitHub for this repo
    description: "Self-hosted Habitica deployment."

# Git identity for hermes user. Commits authored on the gateway carry
# this name/email; rotate together if you change author identity.
hermes_gateway_git_user_name: "Adam Durham (hermes-gw)"
hermes_gateway_git_user_email: "amdnative@gmail.com"

# SSH targets reachable from the bot. Each entry generates a Host stanza
# in /home/hermes/.ssh/config and a known_hosts entry pre-seeded via
# ssh-keyscan. The bot's id_ed25519 must be authorized on the remote
# side under ``user`` — that's a one-time manual step (or a separate
# ansible push if the target is in inventory):
#
#   ssh <target> "grep -qF '$(ssh hermes-gw-01 cat ~/.ssh/id_ed25519.pub)' \
#     ~/.ssh/authorized_keys || \
#     echo \"$(ssh hermes-gw-01 cat ~/.ssh/id_ed25519.pub)\" >> \
#     ~/.ssh/authorized_keys"
hermes_gateway_ssh_targets:
  - host: macstudio-m4-1
    hostname: 100.91.246.26  # Tailscale IP -- the LAN IP (was 192.168.86.201)
                             # drifted off DHCP lease 2026-09-16/18; Tailscale
                             # IP is stable (assigned at tailnet join, doesn't
                             # follow the LAN DHCP lease) so it's the correct
                             # long-term address here, not a workaround.
    user: adam.durham
    description: "M4 Ultra Mac Studio — exo cluster node 1 (coordinator role; see exo/docs/minimax-rdma-moe-validation-2026-04-24.md)"
  - host: macstudio-m4-2
    hostname: 100.66.38.13  # Tailscale IP -- see macstudio-m4-1 comment above
    user: adam.durham
    description: "M4 Ultra Mac Studio — exo cluster node 2"
  - host: work-macbook-m4
    hostname: 100.97.72.92
    user: adam.durham
    description: "Corp MacBook (Tailscale IP — reachable regardless of which LAN it's on). CLI-only work via the dashboard chat; pubkey registered directly in ~/.ssh/authorized_keys on 2026-09-01 (not ansible-managed on that side, since it's a corp-managed machine outside this inventory)."

# Main model provider for the gateway's primary reasoning thread. One of:
#   exo           - local Mac Studio cluster (DeepSeek-V4-Flash), free/private,
#                    but only reachable while the exo cluster is up and the
#                    LXC has network path to hermes_gateway_exo_base_url.
#   anthropic     - Claude (claude-sonnet-5) via the CLAUDE_CODE_OAUTH_TOKEN
#                    already deployed to this box (vault_hermes_gw_claude_code_oauth_token).
#   ollama-cloud  - Ollama Cloud (deepseek-v4-flash), via OLLAMA_API_KEY.
#
# Default flipped exo -> anthropic on 2026-09-07 to mirror the MacBook's
# current ~/.hermes/config.yaml main provider (model.provider: anthropic,
# model.default: claude-sonnet-5) as part of the broader hermes_gateway
# config-parity sync (see templates/config.yaml.j2's header comment). The
# three-way switch itself is unchanged — exo and ollama-cloud remain fully
# supported, just no longer the default.
#
# All three provider blocks + credentials are always rendered into
# config.yaml/.env regardless of this value, so switching is just:
#   1. Change this var (or pass -e hermes_gateway_main_provider=exo)
#   2. ansible-playbook deploy_hermes_gateway.yml --limit hermes_gateway
# The role re-renders config.yaml + restarts hermes-gateway.service +
# hermes-serve.service automatically (template change triggers the
# notify handlers) — no manual SSH/systemctl needed.
hermes_gateway_main_provider: anthropic

# exo cluster's OpenAI-compatible API endpoint (used by both the `exo`
# provider block and the vision auxiliary, regardless of which provider
# is main -- see config.yaml.j2's header comment). Tailscale IP of
# macstudio-m4-1 (the coordinator node) -- NOT the LAN IP, which has
# drifted off its DHCP lease twice (2026-08-08 -> .201, again
# 2026-09-16/18 -> .48); the Tailscale IP is assigned at tailnet join
# and doesn't follow LAN DHCP, so it's stable across LAN reboots/lease
# renewals in a way the LAN IP isn't.
hermes_gateway_exo_base_url: "http://100.91.246.26:52415/v1"
