# ============================================================================
# SHARED MODEL-ROUTING SOURCE OF TRUTH
# ============================================================================
# Extracted 2026-09-12 from the live hermes-gw-01 config.yaml (post
# hermes-routing-cost-review, commit eeb8ab3). This file is the ONE place
# that defines "which model handles which delegate_task persona / auxiliary
# task", consumed by:
#   - ansible/roles/hermes_gateway/templates/config.yaml.j2 (this role)
#   - scripts/hermes_config_sync.py (syncs the MacBook's local
#     ~/.hermes/config.yaml to match, since the local session has no
#     ansible/Jinja machinery of its own)
#
# WHY THIS FILE EXISTS: three independent copies of this routing table
# (MacBook local config, this gateway's config.yaml.j2, and this gateway's
# dashboard_profile_config.yaml.j2) were hand-copy-pasted between each other
# across several sync passes (2026-09-04/07/08/12) and had already drifted
# out of sync THREE ways by 2026-09-12 -- including one real bug
# (delegation.by_provider.anthropic silently pinning claude-sonnet-5 as
# PRIMARY, defeating the ollama-first cost policy) that had been fixed on
# one copy but not the other two.
#
# FIXED 2026-09-12: both templates (config.yaml.j2 AND
# dashboard_profile_config.yaml.j2) now render their
# delegation.model_by_role / delegation.by_provider /
# delegation.reasoning_effort_by_role / delegation.max_iterations_by_role /
# delegation.auto_route.providers / auxiliary.anthropic /
# auxiliary.ollama-cloud / providers.ollama-cloud.models blocks DIRECTLY
# from the hermes_routing_* vars below via
# `{{ hermes_routing_X | to_nice_yaml(indent=2, sort_keys=False) |
# indent(N, True) }}` -- editing this file is now the ONLY hand-edit
# required on the ansible side (was three: this file + both templates).
# tasks/main.yml's "Load Model-Routing Source of Truth" task
# (`include_vars: file: model_routing.yml`, first task in the role) loads
# these vars into scope before either config is rendered.
#
# HOW TO RE-TIER A ROLE OR TASK:
#   1. Edit the relevant dict below.
#   2. `ansible-playbook deploy_hermes_gateway.yml --limit hermes_gateway`
#      to push the change to hermes-gw-01 (both templates re-render from
#      the new values automatically).
#   3. Run `python3 scripts/hermes_config_sync.py --apply` from the repo
#      root to mirror the same values into the MacBook's local
#      ~/.hermes/config.yaml (the local session has no ansible/Jinja
#      machinery of its own, so this is the one remaining manual step).
#
# Verification method used when wiring this up (repeat after any future
# structural change to either template): render both templates locally
# with `ansible-playbook`, deep-diff the parsed YAML against a live
# pre-change snapshot pulled off hermes-gw-01, require zero semantic
# diffs before deploying. Confirmed zero-diff both ways (config.yaml.j2
# and dashboard_profile_config.yaml.j2) before this was ever pushed live.
#
# WHAT IS DELIBERATELY *NOT* HERE (stays host-specific, do not "fix" by
# moving it into this file): model.default/model.provider (which provider
# is MAIN on each host), agent.max_turns/timeouts/system_prompt_mode
# (gateway-specific OAuth-billing-classifier and bot-loop tuning),
# fallback_providers, web.by_provider, providers.exo.*, delegation.max_concurrent_children
# (dashboard_profile_config.yaml.j2 deliberately keeps 3 vs the other two
# configs' 10 -- documented in that file since profile creation: "a
# phone-chat/peer-messaging surface doesn't need the same subagent headroom
# as the coding-agency Discord bot").
# ============================================================================

