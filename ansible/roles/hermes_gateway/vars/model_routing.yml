# Per-role reasoning effort (delegation.reasoning_effort is 'high' for untyped
# dispatches; only the roles listed here override it). Mirrors the MacBook, Adam 2026-10-08.
hermes_routing_reasoning_effort_by_role:
  orchestrator: max
  reviewer: high
  jr-coder: medium
  mid-coder: medium
  sr-coder: max
  arch-system-design: max
  consultant: max
# Per-role iteration caps. Coding/real-work roles use the spawn-role default
# (leaf 300 / orchestrator 500 -- round-2 coders needed 176-201 steps);
# only utility (30) and ops/tooling (60) roles are capped lower.
hermes_routing_max_iterations_by_role:
  orchestrator: 500
  leaf: 300
# Providers for which delegation auto-routing may run. The fork's
# tools/delegation_router.py gate defaults to ('anthropic',) only, which
# silently disabled auto-routing once the gateway's main provider became
# claude-subscription-directsdk-experimental (2026-09-29). The gate keys on
# the PARENT's provider (parent-keyed as of the fork's routing fix B), so
# every provider a routed parent can run under is listed here.
# ollama-cloud is deliberately absent: every ollama-cloud-primary pin routes
# to ollama-cloud/deepseek-v4.1-flash, the same credentials an unrouted
# child inherits, so listing it would change nothing.
hermes_routing_auto_route_providers:
  - anthropic
  - claude-subscription-directsdk-experimental
  - ollama-cloud
# Tier -> role for the delegation auto-router (classifier picks the tier). Roles
# with personas and run history, so a misrouted task still lands on a real role.
hermes_routing_auto_route_tier_roles:
  light: jr-coder
  standard: mid-coder
  deep: sr-coder
hermes_routing_delegation_by_provider:
  anthropic:
    model: deepseek-v4.1-flash
    provider: ollama-cloud
  ollama-cloud:
    model: deepseek-v4.1-flash
    provider: ollama-cloud
  exo:
    model: mlx-community/Qwen3.6-35B-A3B-8bit
    provider: exo
  claude-subscription-directsdk-experimental:
    model: deepseek-v4.1-flash
    provider: ollama-cloud
