---
# Deploys the "push Home Assistant backups to encrypted Google Drive" job.
#
# Requires the same vault vars as roles/vm_backup (the rclone crypt remote):
#   vault_vm_backup_gdrive_client_id, _gdrive_client_secret, _gdrive_token,
#   vault_vm_backup_crypt_password_obscured, vault_vm_backup_crypt_password2_obscured
#
# One-time prerequisite: the ed25519 key at {{ ha_backup_key }} must be in
# HAOS's /root/.ssh/authorized_keys. Generate it with
#   ssh-keygen -t ed25519 -N "" -C ha-backup@<this host> -f /root/.ssh/ha_backup
# then append the .pub to HAOS (Advanced SSH add-on, port 2222, user root).

- name: Install rclone (encrypted GDrive transport)
  ansible.builtin.apt:
    name: rclone
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure root-only rclone config dir
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Drop encrypted rclone remote config
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ ha_backup_rclone_conf }}"
    owner: root
    group: root
    mode: "0600"

- name: Ensure staging dir exists
  ansible.builtin.file:
    path: "{{ ha_backup_stage_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install push script
  ansible.builtin.template:
    src: ha-backup-push.sh.j2
    dest: /usr/local/sbin/ha-backup-push.sh
    owner: root
    group: root
    mode: "0755"

- name: Install systemd unit
  ansible.builtin.template:
    src: ha-backup-push.service
    dest: /etc/systemd/system/ha-backup-push.service
    owner: root
    group: root
    mode: "0644"

- name: Install systemd timer
  ansible.builtin.template:
    src: ha-backup-push.timer.j2
    dest: /etc/systemd/system/ha-backup-push.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and enable timer

- name: Verify the HAOS key is authorised before enabling the timer
  ansible.builtin.command:
    cmd: >-
      ssh -i {{ ha_backup_key }} -p {{ ha_backup_haos_port }}
      -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new
      -o ConnectTimeout=10 {{ ha_backup_haos_user }}@{{ ha_backup_haos_host }}
      ls -1 {{ ha_backup_remote_dir }}/*.tar
  register: ha_backup_probe
  changed_when: false
  failed_when: ha_backup_probe.rc not in [0, 2]
  check_mode: false
