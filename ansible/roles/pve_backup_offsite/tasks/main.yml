---
# Requires the same vault vars as roles/vm_backup (the rclone crypt remote).
# Proxmox cluster root keys already give pve01 SSH to the other nodes, so the
# only trust this needs is the existing cluster relationship.
- name: Install rclone (encrypted GDrive transport)
  ansible.builtin.apt:
    name: rclone
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure root-only rclone config dir
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Drop encrypted rclone remote config
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ pve_backup_offsite_rclone_conf }}"
    owner: root
    group: root
    mode: "0600"

# The staging dir is its own ZFS dataset with a quota. It used to be a plain directory in the
# pool's ROOT dataset, which no per-dataset space check sees: a whole backup generation
# (399 GiB, 43 % of the pool) sat there for a week (2026-11-15). As a dataset it shows up in
# `zfs list`, and the quota (largest single archive + margin) is a hard ceiling for the
# half-fetched file a mid-run fence can leave behind.
- name: Check whether the staging dataset exists
  ansible.builtin.command: "zfs list -H -o name {{ pve_backup_offsite_stage_dataset }}"
  register: pve_backup_offsite_stage_ds
  changed_when: false
  failed_when: false

- name: Create the staging dataset
  ansible.builtin.command: "zfs create -o quota={{ pve_backup_offsite_stage_quota_gib }}G {{ pve_backup_offsite_stage_dataset }}"
  when: pve_backup_offsite_stage_ds.rc != 0

- name: Read the staging dataset quota
  ansible.builtin.command: "zfs get -Hp -o value quota {{ pve_backup_offsite_stage_dataset }}"
  register: pve_backup_offsite_stage_quota_now
  changed_when: false

- name: Keep the staging dataset quota at the declared size
  ansible.builtin.command: "zfs set quota={{ pve_backup_offsite_stage_quota_gib }}G {{ pve_backup_offsite_stage_dataset }}"
  when: (pve_backup_offsite_stage_quota_now.stdout | trim | int) != (pve_backup_offsite_stage_quota_gib | int * 1073741824)

- name: Ensure staging dir permissions
  ansible.builtin.file:
    path: "{{ pve_backup_offsite_stage_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install push script
  ansible.builtin.template:
    src: pve-backup-push.sh.j2
    dest: /usr/local/sbin/pve-backup-push.sh
    owner: root
    group: root
    mode: "0755"

- name: Install systemd unit
  ansible.builtin.template:
    src: pve-backup-push.service
    dest: /etc/systemd/system/pve-backup-push.service
    owner: root
    group: root
    mode: "0644"

- name: Install systemd timer
  ansible.builtin.template:
    src: pve-backup-push.timer.j2
    dest: /etc/systemd/system/pve-backup-push.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and enable PVE push timer

# --- active Tanium VMs: ZFS send streams straight to Drive (no local staging) ---
- name: Install Tanium ZFS-stream push script
  ansible.builtin.template:
    src: pve-tanium-offsite.sh.j2
    dest: /usr/local/sbin/pve-tanium-offsite.sh
    owner: root
    group: root
    mode: "0755"

- name: Install Tanium push systemd unit
  ansible.builtin.template:
    src: pve-tanium-offsite.service
    dest: /etc/systemd/system/pve-tanium-offsite.service
    owner: root
    group: root
    mode: "0644"

- name: Install Tanium push systemd timer
  ansible.builtin.template:
    src: pve-tanium-offsite.timer.j2
    dest: /etc/systemd/system/pve-tanium-offsite.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and enable Tanium push timer
