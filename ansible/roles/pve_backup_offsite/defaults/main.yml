---
# Weekly off-site copy of the newest vzdump archive of every guest, pushed to
# the lab's encrypted Google Drive (same rclone crypt remote as vm_backup).
#
# Why weekly, not nightly: on-site retention (keep-daily=3, keep-weekly=2 per
# guest) already covers point-in-time restores. This exists for losing the
# site/device itself — and a full generation is ~50 GB, which is a lot of
# upstream every night for marginal extra protection.
#
# Runs on pve01 because Proxmox's cluster root keys give it SSH to pve02/pve03
# without any new trust relationship, and the dump dirs are node-local.
pve_backup_offsite_stage_dir: "/nvme-pool/pve-backup-stage"
# ZFS dataset mounted at the staging dir, with a quota: the largest single archive (ts-02,
# ~133 GiB) plus margin. The push stages one archive at a time, so this is a ceiling, not a
# working size.
pve_backup_offsite_stage_dataset: "nvme-pool/pve-backup-stage"
pve_backup_offsite_stage_quota_gib: 160
pve_backup_offsite_dump_dir: "/nvme-pool/vzdump-backups/dump"
pve_backup_offsite_nodes:
  - 192.168.86.11
  - 192.168.86.12
  - 192.168.86.13
# Drive side: crypt remote rooted at the vm-backup tree -> drive:vm-backup/pve
pve_backup_offsite_gdrive_subdir: "pve"
pve_backup_offsite_gdrive_folder: "vm-backup"
# Keep the newest N archives per guest off-site (count-based: a missed week can
# never prune the last surviving copy). Roughly 4x the 43 GB generation.
pve_backup_offsite_keep_copies: 4

pve_backup_offsite_keep_days: 28
pve_backup_offsite_schedule: "Sat *-*-* 05:00:00 America/Chicago"
pve_backup_offsite_rclone_conf: "/root/.config/rclone/rclone.conf"

# Guests whose weekly vzdump archive is NOT pushed to Drive. 201/203/205 are the standby
# Tanium VMs (ts-02/tms-02/tzs-02): ~210 GiB of the weekly push for copies the owner does not
# need off-site (2026-11-15). They still get their normal nightly on-site vzdump.
pve_backup_offsite_exclude_vmids: [201, 203, 205]

# The ACTIVE Tanium VMs (ts-01=200, tms-01=202) are in no vzdump job, and a vzdump of them would
# need 120-190 GiB of local space per node that does not exist. They go to Drive as ZFS send
# streams instead (roles/pve_backup_offsite/templates/pve-tanium-offsite.sh.j2): nothing is staged
# locally. Assumes the -01 pair is the active one; change this list if that flips.
pve_tanium_offsite_vmids: [200, 202]
pve_tanium_offsite_gdrive_subdir: "pve-zfs"
# ZFS pool behind the `nvme-data` storage; only the drill uses it (it creates a scratch zvol here).
pve_tanium_offsite_pool: "nvme-pool"
pve_tanium_offsite_schedule: "Sun *-*-* 05:00:00 America/Chicago"
# Generations kept on Drive per VM (each ~125 GiB for ts-01, ~185 GiB for tms-01).
pve_tanium_offsite_keep: 2
# Measured 2026-11-15: one rclone stream to Drive does 21-27 MiB/s on this 1 Gbit line, so this cap
# never binds in practice; it exists so a faster day cannot starve corosync on the single 1 GbE NIC.
pve_tanium_offsite_bwlimit: "30M"
