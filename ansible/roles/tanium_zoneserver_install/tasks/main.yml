---
# Silent-install the Tanium Zone Server. Verified against zoneserver.nsi
# source on platdev-jump (same tag as tanium_server_install) 2026-08-20.
#
# Unlike the Server/Module Server, the Zone Server needs no database and
# no domain service account by default (ServiceUserName is optional —
# only validated if you choose to run the service as something other
# than Local System). What it DOES need is a "tanium-init.dat"-style key
# file (/KeyPath=). Confirmed 2026-08-20 this does NOT require any
# Console interaction: a fresh Tanium Server install auto-generates its
# own tanium-init.dat (~1KB) directly in its install directory
# (Key & Trust Management in the Console UI manages trust between
# multiple *Tanium Servers*, unrelated to this file). This role fetches
# it directly from the already-installed Tanium Server box via WinRM
# rather than requiring a separately-provided local path.
#
# Also confirmed: Zone Server is a 32-bit installer — it installs to
# "C:\Program Files (x86)\Tanium\Tanium ZoneServer", not
# "C:\Program Files\..." like Server/Module Server (see
# tanium_zoneserver_install_dir in defaults/main.yml).
#
# HUB MODE, confirmed via source AND a real live install 2026-08-21:
# there is NO separate "Zone Server Hub" installer or Server-side
# component. A Hub is a normal Zone Server install with /HubFlag=1
# (Components/ZoneServer/ProcessZoneServerCommandLine.cpp reads
# AppConfig "ZoneHubFlag" written by this exact flag; it switches the
# PKI identity from TaniumZoneServerPKI to TaniumHubPKI, nothing else
# about the binary, service name ("Tanium ZoneServer"), or install
# directory changes). The user's stated architecture choice for this
# lab is a co-located Hub installed directly ON the Tanium Server box
# itself (not standalone) — set tanium_zoneserver_hub_flag: 1 and target
# this role at the Server's own host to do that; the wizard's Hub-mode
# settings page just asks for the Tanium Server address/port to connect
# out to, same /ServerAddress param as a leaf Zone Server.
#
# LIVE-VALIDATED 2026-08-21: for the co-located case specifically,
# SetupZoneServer.exe's own install log shows it locally invoking
# `TaniumReceiver.exe pki show-registration-fingerprint` then
# `TaniumReceiver.exe server-registrations approve <request-id>` on the
# SAME box right after starting the service — the Server auto-approves
# a co-located Hub's registration itself, with NO AllowedHubs config
# needed at all in that specific case (confirmed by a real end-to-end
# install: "Tanium ZoneServer started" -> fingerprint discovered ->
# "server-registrations approve command returned. Return code 0", no
# manual intervention). tanium_server_install's tanium_allowed_hubs
# setting is still wired up and harmless to set as defense-in-depth
# (and IS load-bearing for a standalone, non-co-located Hub, which
# cannot self-approve this way) — just don't assume it's required for
# the co-located architecture this repo actually uses.
#
# Full parameter reference (zoneserver.nsi, grep 'GetOptions.*Params'):
#   /ServerAddress /ServerPort /ZoneServerAddress /ZoneServerPort
#   /LogVerbosityLevel /KeyPath /HubFlag /ServiceUserName
#   /ServiceUserDomain /ServiceUserPassword /AllowedHubs

# Snapshot tanium_zoneserver_ip to a plain fact before any task-level
# `vars:` block redefines `ansible_host` — see tanium_windows_vm_clone's
# role header for why this avoids a real Jinja recursion error.
- name: "Resolve tanium_zoneserver_ip to a plain fact"
  ansible.builtin.set_fact:
    tanium_zoneserver_ip_resolved: "{{ tanium_zoneserver_ip }}"

- name: "Check if Tanium Zone Server is already installed"
  delegate_to: localhost
  ansible.windows.win_stat:
    path: "{{ tanium_zoneserver_install_dir }}\\TaniumZoneServer.exe"
  register: zs_exe_check
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_zoneserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

# Fetch tanium-init.dat directly from the Tanium Server box (see role
# header) rather than requiring a manually-exported local file.
- name: "Fetch tanium-init.dat from the Tanium Server"
  when: not zs_exe_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_shell: "[Convert]::ToBase64String([IO.File]::ReadAllBytes('{{ tanium_install_dir }}\\tanium-init.dat'))"
  register: init_dat_b64
  vars:
    ansible_host: "{{ tanium_server_ip }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Copy installer to {{ tanium_zoneserver_ip }}"
  when: not zs_exe_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_copy:
    src: "{{ tanium_setup_zoneserver_exe_local_path }}"
    dest: "{{ tanium_installers_dir }}\\SetupZoneServer.exe"
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_zoneserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Write tanium-init.dat on {{ tanium_zoneserver_ip }}"
  when: not zs_exe_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_shell: "[IO.File]::WriteAllBytes('{{ tanium_installers_dir }}\\tanium-init.dat', [Convert]::FromBase64String('{{ init_dat_b64.stdout | trim }}'))"
  no_log: true
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_zoneserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Run SetupZoneServer.exe /S (silent install)"
  when: not zs_exe_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_command:
    cmd: >-
      {{ tanium_installers_dir }}\SetupZoneServer.exe /S
      /ServerAddress={{ tanium_server_ip }}
      /KeyPath={{ tanium_installers_dir }}\tanium-init.dat
      /HubFlag={{ tanium_zoneserver_hub_flag }}
      {{ ('/AllowedHubs=' + tanium_server_ip) if tanium_zoneserver_hub_flag | int == 0 else '' }}
  register: install_result
  changed_when: true
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_zoneserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Wait for TaniumZoneServer.exe to exist (install completion signal)"
  delegate_to: localhost
  ansible.windows.win_stat:
    path: "{{ tanium_zoneserver_install_dir }}\\TaniumZoneServer.exe"
  register: install_done_check
  until: install_done_check.stat.exists
  retries: 15
  delay: 10
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_zoneserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Verify Tanium ZoneServer service is running"
  delegate_to: localhost
  ansible.windows.win_service:
    name: "Tanium ZoneServer"
  register: service_check
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_zoneserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Start Tanium ZoneServer service if not running"
  when: service_check.state != 'started'
  delegate_to: localhost
  ansible.windows.win_service:
    name: "Tanium ZoneServer"
    state: started
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_zoneserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"
