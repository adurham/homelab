---
# Service account + install layout for the upstream source media collector.
media_gallery_user: mediagallery
media_gallery_dir: /opt/media-gallery        # code + venv
media_gallery_state: /var/lib/media-gallery  # session, captures (ReadWrite)
media_gallery_log_dir: /var/log/media-gallery

# Storage / sync.
# gcrypt: = the rclone crypt remote (client-side encryption) wrapping
# gdrive:media-gallery. Configured one-time via the authorize flow; see README.
media_gallery_rclone_remote: "gcrypt:"
media_gallery_cache_days: 7          # keep this many days of captures locally
media_gallery_sync_interval: "15min" # how often to encrypt+upload+prune

# Pin source; bump deliberately.
media_gallery_telethon_version: "1.43.2"

# Web gallery: rclone serve http port (bound on ip_media_gallery, fronted by
# lb-01 nginx + Authentik forward-auth at https://gallery.chi.lab.amd-e.com).
media_gallery_gallery_port: 8089

# How often to auto-refresh the gallery (rebuild manifest + warm new thumbs)
# so it stays current as the live collector captures new media.
media_gallery_refresh_interval: "1h"

# Background auto-cron backfill for items that have never been viewed (and so
# have never had a thumbnail generated at all -- see thumb_backfill.py's own
# docstring). Small budget + a real inter-request delay per run keeps this
# safe to leave running indefinitely: each run does a bounded amount of real
# work then exits, throttled well under Drive's API pacer, and naturally
# self-stops (near-instant runs) once nothing is left to backfill.
#
# 2026-09-30: videos are now included (they cost only a few MB via the HTTP
# range path) and the queue processes videos FIRST. The budget was raised from
# 200 to 400 and the rest period shortened, because the historical numbers
# assumed images-only batches of ~70-80 min; with videos mixed in a 200-item
# batch covers far less of the backlog. Measured per-item cost on a mixed
# batch: ~7-20s. 400/run clears the real backlog in roughly a day, after
# which runs go near-empty and cost nothing (self-stopping by design).
media_gallery_thumb_backfill_interval: "5min"
media_gallery_thumb_backfill_budget: 400
media_gallery_thumb_backfill_delay: 1.0

# On-the-fly thumbnail service port (bound on ip_media_gallery, routed by lb-01
# nginx /thumb/ behind Authentik). Generates + caches ~400px posters on demand.
media_gallery_thumb_port: 8090

# Where thumb_service.py reaches the LOCAL rclone serve over HTTP to build
# video posters via ffmpeg range reads (a few MB, a few seconds even for
# multi-GB videos — see that service's comment). Must be the address the CT
# can reach itself on; loopback is allowed by the iptables rule set.
media_gallery_thumb_video_http_base: "http://172.16.0.46:8089"

# Trash service port (delete media + exclusion ledger; bound on ip_media_gallery,
# routed by lb-01 nginx /trash/ behind Authentik).
media_gallery_trash_port: 8091

# Upload service port (add pics + create folders; routed by lb-01 /upload /mkdir
# /status behind Authentik). Built to handle thousands (batched, coalesced).
media_gallery_upload_port: 8092
media_gallery_upload_max_mb: 16384

# Local metadata serve port + tmpfs dir (2026-09-30). rclone serves the LOCAL
# tmpfs mirror of the gallery metadata the SPA fetches (manifest.json,
# folders.json, dedup.json, index.html) at this port; lb-01 routes those exact
# paths here so a page load does not stream ~85MB from Google Drive (~10s ->
# ~0.2s, measured). Media originals + thumbs keep flowing through the
# Drive-backed gallery/thumb services — only metadata is local.
# NOTE: media_gallery_serve_port is defined in group_vars/all/vars.yml (the
# lb-01 nginx template needs it too, and group_vars beat role defaults —
# defining it in both places invites drift).
media_gallery_serve_dir: /var/lib/media-gallery/serve

# tmpfs size for that serve dir: manifest.json (~85MB today) + folders.json +
# dedup.json (~26MB) + the SPA, with headroom for a transiently larger
# manifest between publishes (temp file + rename). Keep well under CT RAM
# (media_gallery_ct_memory_mb, 8 GiB) alongside the 6 GiB thumbcache.
media_gallery_serve_tmpfs_size: "512M"

# Thumbnail cache tmpfs size (RAM-backed; decrypted thumbs + the transient
# full-original download used to make a VIDEO poster live here, never on disk).
# Must exceed the LARGEST original so big-video posters can be generated — at
# 512M (the old value) any video >~485 MiB failed with "no space left on device".
# Sized to comfortably hold the largest video (~3.4 GiB) plus working room. The
# CT RAM (media_gallery_ct_memory_mb, 8 GiB) must stay above this peak.
media_gallery_thumbcache_tmpfs_size: "6G"

# Free-space safety margin (MiB) the thumb service keeps in the thumbcache tmpfs
# when admitting an original download for a video poster. The service reserves
# (file_size + this margin) before downloading, so concurrent video requests
# can't collectively overflow the RAM tmpfs (the real constraint is BYTES, not a
# request count — two 3 GB videos would blow a count-based cap). Read by
# thumb_service.py as THUMB_SPACE_MARGIN_MB.
media_gallery_thumb_space_margin_mb: 256

# Include video posters in the background thumbnail backfill (default true).
# Video posters are generated via HTTP range requests against the local rclone
# serve (a few MB and a few seconds per video, even multi-GB ones) — so the
# historical "videos are too expensive to backfill" reasoning no longer holds.
# Set false to fall back to images-only backfill.
media_gallery_thumb_backfill_include_video: true
