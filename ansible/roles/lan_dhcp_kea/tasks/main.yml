---
# Kea DHCPv4 hot-standby pair — the shared-lease DHCP for the LAN.
# Owns :67 on both containers and the HA channel on :8000. The lan_dns role
# owns AdGuard and must never touch DHCP (its legacy dnsmasq block is off).

- name: Ensure Kea is installed
  ansible.builtin.apt:
    name: kea-dhcp4-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove dnsmasq so it cannot race Kea for :67
  ansible.builtin.apt:
    name: dnsmasq
    state: absent
    purge: true

- name: Make sure no dnsmasq unit is left running
  ansible.builtin.systemd:
    name: dnsmasq
    state: stopped
    enabled: false
  failed_when: false

- name: Deploy the Kea configuration
  ansible.builtin.template:
    src: kea-dhcp4.conf.j2
    dest: "{{ kea_conf }}"
    owner: root
    group: root
    mode: '0644'
  register: kea_conf_file

- name: Validate the Kea configuration
  ansible.builtin.command: kea-dhcp4 -t {{ kea_conf }}
  changed_when: false

- name: Enable and start Kea
  ansible.builtin.systemd:
    name: kea-dhcp4-server
    enabled: true
    state: "{{ 'restarted' if kea_conf_file.changed else 'started' }}"
    daemon_reload: true

- name: Wait for the DHCP socket
  ansible.builtin.shell: ss -lunp | grep -q ':67 '
  register: kea_dhcp_socket
  until: kea_dhcp_socket.rc == 0
  retries: 10
  delay: 2
  changed_when: false

- name: Wait for the HA channel
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 8000
    state: started
    timeout: 30
  delegate_to: localhost

- name: Show the HA state
  ansible.builtin.shell: journalctl -u kea-dhcp4-server -n 80 --no-pager -o cat | grep HA_STATE_TRANSITION | tail -2
  register: kea_ha_state
  changed_when: false
  failed_when: false

- name: HA state
  ansible.builtin.debug:
    msg: "{{ kea_ha_state.stdout_lines | default([]) }}"

# --- Failover watchdog (standby only) ---------------------------------------
# Kea 2.4.1's HA hook will not promote this pair: with the primary gone the
# backup stays in "backup" state, `dhcp-enable` returns success but the socket
# stays filtered, and `ha-maintenance-start` is refused (backup ->
# partner-in-maintenance). Proven 2026-11-10. So the standby carries a watchdog
# that swaps in a standalone config (same subnet/pool/reservations, HA hook
# removed) when the primary is unreachable, and swaps the HA config back when it
# returns. Measured: promote in ~24s, hand back in ~14s, real client served.
- name: Keep the HA config for the watchdog to swap back
  ansible.builtin.copy:
    src: "{{ kea_conf }}"
    dest: "{{ kea_ha_conf }}"
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  when: kea_role == 'standby'

- name: Render the standalone config used during promotion
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    cfg = json.load(open("{{ kea_conf }}"))
    cfg["Dhcp4"]["hooks-libraries"] = [
        h for h in cfg["Dhcp4"].get("hooks-libraries", [])
        if "libdhcp_ha.so" not in h.get("library", "")
    ]
    json.dump(cfg, open("{{ kea_standalone_conf }}", "w"), indent=2)
    PY
  changed_when: false
  when: kea_role == 'standby'

- name: Install the failover watchdog
  ansible.builtin.copy:
    src: dhcp-failover-watch.py
    dest: /usr/local/sbin/dhcp-failover-watch.py
    owner: root
    group: root
    mode: '0755'
  when: kea_role == 'standby'

- name: Install the watchdog unit and timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - dhcp-failover-watch.service
    - dhcp-failover-watch.timer
  when: kea_role == 'standby'

- name: Enable the failover watchdog timer
  ansible.builtin.systemd:
    name: dhcp-failover-watch.timer
    enabled: true
    state: started
    daemon_reload: true
  when: kea_role == 'standby'
