---
- name: Install ZFS utilities
  ansible.builtin.apt:
    name: zfsutils-linux
    state: present

- name: Check if ZFS pool exists
  ansible.builtin.command: "zpool list {{ zfs_pool_name }}"
  register: zpool_check
  ignore_errors: true
  changed_when: false

- name: Create ZFS pool
  ansible.builtin.command: "zpool create -f {{ zfs_pool_name }} {{ zfs_disk_device }}"
  when: zpool_check.rc != 0

- name: Check if storage is already added to Proxmox
  ansible.builtin.command: "pvesm status -storage {{ zfs_storage_id }}"
  register: pvesm_check
  ignore_errors: true
  changed_when: false
  when: inventory_hostname == groups['proxmox_nodes'][0]

- name: Add ZFS pool to Proxmox storage
  ansible.builtin.command: >
    pvesm add zfspool {{ zfs_storage_id }}
    -pool {{ zfs_pool_name }}
    -content images,rootdir
    -sparse 1
  when:
    - inventory_hostname == groups['proxmox_nodes'][0]
    - pvesm_check.rc != 0

# Fleet audit 2026-09-10: last scrub on every node was 2026-08-09 (a
# one-off manual run, not scheduled) -- zfsutils-linux ships
# zfs-scrub-monthly@.timer but it's disabled by default and nobody had
# ever enabled it. Without this, silent bit-rot/corruption on the pool
# backing every CT's storage could go undetected indefinitely. Staggered
# across nodes (day-of-month offset via the override below) so a
# 3-node simultaneous scrub doesn't hit shared/replicated I/O at once --
# same reasoning as the vzdump backup staggering in
# /cluster/backup (pve01 02:00, pve02 02:30, pve03 03:00).
- name: Ensure zfs-scrub-monthly override dir exists
  ansible.builtin.file:
    path: "/etc/systemd/system/zfs-scrub-monthly@{{ zfs_pool_name }}.timer.d"
    state: directory
    mode: "0755"

- name: Stagger scrub schedule across nodes (avoid simultaneous cluster-wide I/O)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/zfs-scrub-monthly@{{ zfs_pool_name }}.timer.d/override.conf"
    mode: "0644"
    content: |
      # Managed by ansible -- roles/proxmox_storage/tasks/main.yml.
      # Staggered by node so a 3-node cluster doesn't scrub simultaneously.
      [Timer]
      OnCalendar=
      OnCalendar=*-*-{{ '%02d' | format(zfs_scrub_day_of_month) }} 01:00:00
      RandomizedDelaySec=30m
  notify: Reload systemd for zfs scrub timer

- name: Enable + start monthly zfs scrub timer
  ansible.builtin.systemd:
    name: "zfs-scrub-monthly@{{ zfs_pool_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true

# Incident 2026-09-12: pve01's root LVM disk (94G, shared with the OS,
# apt cache, journal, etc.) hit 94% because vzdump backups were landing
# on the default 'local' storage (path /var/lib/vz, backed by the small
# root disk) via proxmox_backup_jobs' pve_backup_storage: local default.
# The obvious fix -- point backups at the ZFS pool instead, which has
# hundreds of GB free on every node -- can't be done by just changing
# pve_backup_storage to the existing 'nvme-data' zfspool storage:
# zfspool-type storage in Proxmox only supports content type
# images,rootdir (VM/CT disks), NOT backup (`pvesm set nvme-data
# --content ...,backup` fails with "storage does not support content
# type 'backup'" -- confirmed live). A zfspool storage stores each
# volume as its own dataset/zvol, which doesn't match vzdump's
# flat-file archive model. The fix is a 'dir' storage type pointed at a
# path INSIDE the ZFS pool (a plain directory on a ZFS-backed
# filesystem, not a zfspool-managed dataset-per-volume) -- 'dir'
# storage does support backup content, and files landing in it benefit
# from ZFS compression/checksums like everything else in the pool.
- name: Create a ZFS dataset to hold vzdump backup files (per-node local dataset, same pattern as 'local')
  ansible.builtin.command: "zfs create {{ zfs_pool_name }}/vzdump-backups"
  register: zfs_vzdump_dataset_check
  failed_when:
    - zfs_vzdump_dataset_check.rc != 0
    - "'dataset already exists' not in zfs_vzdump_dataset_check.stderr"
  changed_when: zfs_vzdump_dataset_check.rc == 0

- name: Check whether the vzdump-nvme dir storage is already registered
  ansible.builtin.command: "pvesm status -storage {{ pve_backup_zfs_storage_id }}"
  register: pvesm_vzdump_check
  ignore_errors: true
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['proxmox_nodes'][0] }}"

# Cluster-wide dir storage, non-shared -- each node has its own local
# dataset at the same path, same convention as the 'local' storage.
- name: Register the ZFS-backed dir storage for vzdump backups
  ansible.builtin.command: >
    pvesm add dir {{ pve_backup_zfs_storage_id }}
    --path /{{ zfs_pool_name }}/vzdump-backups
    --content backup
    --shared 0
  when:
    - pvesm_vzdump_check.rc != 0
  run_once: true
  delegate_to: "{{ groups['proxmox_nodes'][0] }}"
