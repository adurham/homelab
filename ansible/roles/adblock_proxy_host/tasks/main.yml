---
# Provisions the LXC for the personal-device MITM ad-stripping proxy
# (mitmproxy, explicit HTTPS proxy — NOT transparent/network-wide).
# Mirrors the hermes_gateway_host role pattern: pveam template fetch ->
# cluster-wide existence check -> pct create -> inject SSH key -> join
# Tailscale directly (same as hermes-gw-01) -> add to in-memory inventory.

- name: Update Template Database
  ansible.builtin.command: pveam update
  changed_when: false

- name: Download Ubuntu 22.04 Template
  ansible.builtin.command: pveam download local ubuntu-22.04-standard_22.04-1_amd64.tar.zst
  args:
    creates: /var/lib/vz/template/cache/ubuntu-22.04-standard_22.04-1_amd64.tar.zst

# Resolve the node CT 118 lives on now (HA-aware). Sets ct_exists + ct_node;
# node-local `pct` ops below delegate to ct_node so they follow HA migrations.
- name: Resolve owning node for Adblock Proxy CT
  ansible.builtin.include_role:
    name: resolve_ct_node
  vars:
    ct_vmid: 118

- name: Create Adblock Proxy Container
  ansible.builtin.command: >
    pct create 118 /var/lib/vz/template/cache/ubuntu-22.04-standard_22.04-1_amd64.tar.zst
    --hostname adblock-proxy-01
    --cores 2 --memory 2048 --swap 1024
    --rootfs nvme-data:8
    --net0 name=eth0,bridge={{ net_private_bridge }},ip={{ ip_adblock_proxy }}/24,mtu={{ net_private_mtu }}
    --net1 name=eth1,bridge=vmbr0,ip=dhcp
    --unprivileged 1
    --features nesting=1
    --password "{{ vault_adblock_proxy_root_pass }}"
    --start 1
    --onboot 1
  no_log: true
  when: not ct_exists

# LAN-facing eth1 (added 2026-08-21) so Tailscale can hole-punch a DIRECT
# peer connection instead of falling back to a DERP relay. Root cause:
# with only the private-SDN leg, the CT sat behind a second NAT hop at
# tailscale-gw (a static iptables MASQUERADE with no NAT-PMP/UPnP/PCP
# server), so tailscaled could never open a port mapping and every
# client (even ones on the SAME home network / same public IP) fell
# back to DERP(ord), capping real-world throughput at ~17.5 Mbps
# against a ~280-350 Mbps LAN/WAN baseline (confirmed via direct
# throughput tests 2026-08-21). tailscale-gw itself and lb-01/frigate-01
# all solve this the same way — a LAN NIC alongside the private-SDN
# leg — so this mirrors an already-proven pattern rather than
# attempting NAT-PMP relay-chaining through tailscale-gw (evaluated and
# rejected: standard NAT-PMP/UPnP servers don't chain a mapping request
# to a router further upstream, so it would need non-standard
# double-NAT traversal untested anywhere else in this homelab).
#
# SECURITY: this newly exposes the CT to the LAN (previously reachable
# ONLY via the private SDN / Tailscale). The "Restrict Adblock Proxy
# LAN NIC to Tailscale Hole-Punch Only" firewall task below is NOT
# optional — it must land before/alongside this NIC, locking eth1 down
# to just UDP/41641 (tailscaled's hole-punch port) so the mitmproxy
# listeners (8080/8443) stay unreachable from the LAN, exactly as they
# were before this change.
- name: Ensure Adblock Proxy Container Has LAN-Facing eth1 (Tailscale direct-connect)
  ansible.builtin.command: >
    pct set 118 --net1 name=eth1,bridge=vmbr0,ip=dhcp
  delegate_to: "{{ ct_node }}"
  changed_when: true

# net0's `gw=` was REMOVED (2026-08-21, live-debugged): with BOTH eth0
# (gw=172.16.0.1, static) and eth1 (DHCP-assigned gateway) present,
# eth0's static route always won as the default (implicit metric 0 vs
# eth1's DHCP metric 1024) — Tailscale's portmapper only probes the
# CURRENT default-route gateway, so it kept checking tailscale-gw
# (172.16.0.1, no UPnP/NAT-PMP server) instead of the real home router
# (192.168.86.1, confirmed reachable + responsive), and PortMapping
# stayed empty even after the eth1 NIC + firewall fix above landed.
# Removing net0's gw= leaves the private-SDN subnet route intact (a
# directly-connected route, NOT dependent on the gateway declaration —
# dns-01/lb-01/other private-SDN hosts stay reachable) while letting
# eth1's DHCP-provided route become the sole default, so the CT's own
# internet egress (and Tailscale's portmapper) now goes straight out
# the real router instead of double-NAT hairpinning through
# tailscale-gw. Idempotent re-apply covers CTs created before this
# fix landed (this CT specifically, migrated off dead pve03 same day).
- name: Ensure Adblock Proxy net0 Has No Static Default Route (eth1 DHCP route wins)
  ansible.builtin.command: >
    pct set 118 --net0 name=eth0,bridge={{ net_private_bridge }},ip={{ ip_adblock_proxy }}/24,mtu={{ net_private_mtu }}
  delegate_to: "{{ ct_node }}"
  changed_when: true

# Bumped from the original 1 core/512MB to 2 cores/2GB (2026-07-27) once
# real usage showed multiple devices (phone + Mac) routing simultaneously
# through the exit node. Actual load stayed low even at 1c/512M (~1% CPU,
# ~180MB RSS for both mitmproxy instances combined — non-Discord SNI
# traffic is a cheap opaque TCP relay, no TLS work at all) but headroom
# is cheap and this removes any doubt as usage grows. Applied live via
# `pct set` (both cores and memory hot-resize for LXC, no reboot needed)
# — this task keeps it enforced on every idempotent re-run, matching the
# loadbalancer_host/monitoring_host pattern for config drift.
- name: Ensure Adblock Proxy Container is Sized Correctly (2 cores / 2GB)
  ansible.builtin.command: pct set 118 --cores 2 --memory 2048 --swap 1024
  delegate_to: "{{ ct_node }}"
  changed_when: true

- name: Ensure Adblock Proxy Container is Running
  ansible.builtin.command: pct start 118
  delegate_to: "{{ ct_node }}"
  register: adblock_proxy_start
  failed_when: adblock_proxy_start.rc != 0 and ("already running" not in adblock_proxy_start.stderr and "already running" not in adblock_proxy_start.stdout)
  changed_when: adblock_proxy_start.rc == 0

# Re-scan network interfaces so systemd-networkd picks up eth1 (and
# re-applies eth0's config after net0/net1 changes above regenerate the
# veth with a new MAC/ifindex). Hot-added/changed LXC network devices
# via `pct set` do NOT automatically get matched against existing
# .network files — networkd only does that matching on enumeration/
# reload, not on a bare link-up event. Without this, `networkctl status`
# shows the new interface as "degraded (unmanaged)" and it never gets an
# IP or (critically) a default route, which also means Tailscale's
# portmapper can't reach the real router for direct-connect negotiation.
# Confirmed live 2026-08-21: every `pct set --net0`/`--net1` change on
# this CT regenerated the veth and required a manual `networkctl reload`
# to recover — this task makes that automatic instead of a manual
# recovery step, and IDEMPOTENT re-runs also need it (not just first
# creation), since ANY net0/net1 pct set regenerates the interface.
- name: Reload systemd-networkd (pick up regenerated net0/net1 interfaces)
  ansible.builtin.command: pct exec 118 -- networkctl reload
  delegate_to: "{{ ct_node }}"
  changed_when: false

- name: Wait for Adblock Proxy Container IP
  ansible.builtin.shell: |
    set -o pipefail
    pct exec 118 -- ip a show eth0 | grep "inet " | grep -v "127.0.0.1"
  delegate_to: "{{ ct_node }}"
  register: ip_check
  until: ip_check.rc == 0
  retries: 20
  delay: 3
  changed_when: false

# eth1's default route (via DHCP) is what makes Tailscale's portmapper
# reach the real home router instead of tailscale-gw's NAT hairpin — see
# the "Ensure Adblock Proxy net0 Has No Static Default Route" task above
# for the full root-cause writeup. Wait for it explicitly (separate from
# eth0's IP check above) since eth1 comes up via DHCP, not a static
# assignment, and can lag a few seconds behind eth0.
#
# ROBUSTNESS (2026-08-21, live-debugged): a single reload + a 60s retry
# budget (20x3s) was NOT always enough — DHCP completion after a fresh
# `networkctl reload` was observed taking anywhere from ~15s to over 60s
# across repeated live runs, and on one run the interface regenerated a
# SECOND time mid-wait (triggered by an unrelated `pct set` elsewhere in
# this same play), which orphaned the first reload's in-flight DHCP
# negotiation entirely. A bare ansible `until` retry loop can't recover
# from that — it just keeps checking a route that will never appear
# without a fresh reload. This task is a self-contained shell loop
# instead: it re-issues `networkctl reload` every ~20s if the route
# still hasn't appeared, so a second interface regeneration during the
# wait gets its own fresh DHCP attempt rather than silently timing out.
# 180s total budget (vs the previous 60s) — generous, but this task only
# ever runs during a network-affecting deploy, where a slow-but-working
# DHCP handshake is preferable to a false failure that leaves the CT
# reachable via SSH but ansible reporting broken.
- name: Wait for Adblock Proxy Container Default Route (via eth1 DHCP, self-healing reload)
  ansible.builtin.shell: |
    set -o pipefail
    for i in $(seq 1 36); do
      if pct exec 118 -- ip route show | grep -q "^default"; then
        echo "default route present after $((i * 5))s"
        exit 0
      fi
      # Re-nudge networkd every ~20s (every 4th 5s tick) in case the
      # interface regenerated again since the last reload and needs a
      # fresh DHCP attempt.
      if [ $((i % 4)) -eq 0 ]; then
        pct exec 118 -- networkctl reload || true
      fi
      sleep 5
    done
    echo "default route still absent after 180s"
    exit 1
  delegate_to: "{{ ct_node }}"
  register: default_route_check
  changed_when: false

- name: Update Apt Cache in Adblock Proxy Container
  ansible.builtin.command: pct exec 118 -- apt-get update
  delegate_to: "{{ ct_node }}"
  when: not ct_exists
  changed_when: true

- name: Install Python3 in Adblock Proxy Container
  ansible.builtin.command: pct exec 118 -- apt-get install -y python3
  delegate_to: "{{ ct_node }}"
  when: not ct_exists
  changed_when: true

- name: Inject SSH Key into Adblock Proxy Container (via pipe)
  ansible.builtin.shell: |
    set -o pipefail
    pct exec 118 -- mkdir -p /root/.ssh
    cat /root/.ssh/authorized_keys | pct exec 118 -- sh -c "cat > /root/.ssh/authorized_keys"
    pct exec 118 -- chmod 700 /root/.ssh
    pct exec 118 -- chmod 600 /root/.ssh/authorized_keys
  delegate_to: "{{ ct_node }}"
  when: not ct_exists
  changed_when: true

# openssh-server ships in the Ubuntu LXC template but isn't enabled by
# default. Without this the CT is only reachable via `pct exec` from the
# proxmox host — direct SSH from ansible against the CT's IP fails.
- name: Ensure SSH is enabled and running
  ansible.builtin.command: pct exec 118 -- systemctl enable --now ssh
  delegate_to: "{{ ct_node }}"
  changed_when: false

# TUN device passthrough so Tailscale can run inside the unprivileged CT.
# Mirrors hermes-gw-01's config (hermes_gateway_host role) and
# tailscale-gw's. Without these two lines, /dev/net/tun isn't visible
# inside the container and `tailscale up` fails with "device or resource
# busy" / "no such device".
#
# Both edits are idempotent via lineinfile; the LXC must be restarted for
# them to take effect (handled by the restart task below, which only
# fires when the conf actually changed).

- name: Allow tun device cgroup in Adblock Proxy LXC config
  ansible.builtin.lineinfile:
    path: /etc/pve/lxc/118.conf
    line: 'lxc.cgroup2.devices.allow: c 10:200 rwm'
    state: present
    create: false
  register: adblock_proxy_tun_cgroup

- name: Mount tun device in Adblock Proxy LXC config
  ansible.builtin.lineinfile:
    path: /etc/pve/lxc/118.conf
    line: 'lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file'
    state: present
    create: false
  register: adblock_proxy_tun_mount

- name: Restart Adblock Proxy Container for TUN access
  ansible.builtin.command: pct reboot 118
  delegate_to: "{{ ct_node }}"
  when: adblock_proxy_tun_cgroup.changed or adblock_proxy_tun_mount.changed
  changed_when: true

- name: Wait for Adblock Proxy Container SSH after TUN restart
  ansible.builtin.wait_for:
    host: "{{ hostvars['adblock-proxy-01'].ansible_host | default(ip_adblock_proxy) }}"
    port: 22
    timeout: 60
  when: adblock_proxy_tun_cgroup.changed or adblock_proxy_tun_mount.changed
  delegate_to: localhost

- name: Add Adblock Proxy Host to In-Memory Inventory
  # Reach via Tailscale directly (same pattern as hermes-gw-01) — personal
  # devices connect to this proxy from anywhere on the tailnet, not just
  # the home LAN, so it joins Tailscale itself rather than being reached
  # via the tailscale-gw subnet router.
  ansible.builtin.add_host:
    name: adblock-proxy-01
    ansible_host: adblock-proxy-01.tail19c543.ts.net
    ansible_user: root
    groups: adblock_proxy
