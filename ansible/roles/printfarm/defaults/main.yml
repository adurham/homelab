---
# Deploy layout for the Bambu/MakerWorld -> Creality K2 print service.

# Controller-side dev tree. Same single-source pattern as ps5forge_src: the
# app is developed in its own repo and the role copies the runtime files out
# of it, so there is no second copy to drift.
printfarm_src: /Users/adam.durham/repos/bambu2creality

printfarm_user: printfarm
printfarm_dir: /opt/bambu2creality        # app code (python, stdlib only)
printfarm_state: /var/lib/printfarm       # HOME + job scratch for the service
printfarm_port: 8765
printfarm_printer_host: "192.168.86.43"   # K2-6556 Moonraker (no auth on the LAN)
# Tailnet node name. Deliberately NOT "print-01": this is the address a person
# types, so it should read as a service, not an inventory item.
# -> https://print.tail19c543.ts.net
printfarm_tailscale_hostname: print

# Creality Print itself: the slicing engine. The AppImage is extracted (not
# FUSE-mounted) so it can live on a plain CT filesystem.
printfarm_creality_dir: /opt/creality-print
printfarm_appimage_url: >-
  https://github.com/CrealityOfficial/CrealityPrint/releases/download/v7.3.1/CrealityPrint-V7.3.1.6378-x86_64-Release.AppImage
printfarm_appimage_sha256: ""             # empty = verify size only (see tasks)

# Runtime libs for the AppImage CLI. The binary links WebKit/GTK3/GStreamer
# directly, so these are not optional — on Ubuntu 24.04 the CLI aborts with
# "error while loading shared libraries" until all of them are present.
# Verified by ldd against CrealityPrint-V7.3.1.6378 x86_64.
printfarm_deps:
  - python3
  - curl
  - ca-certificates
  - xvfb
  - libatomic1
  - libgl1
  - libglu1-mesa
  - libegl1
