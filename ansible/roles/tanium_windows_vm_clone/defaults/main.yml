---
# REAL BUG, confirmed 2026-08-22: this was previously a task-level
# `vars:` entry on the "Wait for OOBE" task only, which meant it was
# invisible to the separate oobe_click_attempt.yml include_tasks file
# added later ('tanium_win_oobe_check_b64' is undefined). Role
# defaults are visible everywhere in the role, so it lives here now.
# Base64(UTF-16LE) of a read-only PowerShell OOBE-readiness check --
# see tanium_windows_vm_clone/tasks/main.yml's "Wait for OOBE/specialize"
# task comment for exactly what it reads and why. Decode with:
# echo <b64> | base64 -d | iconv -f utf-16le
tanium_win_oobe_check_b64: ""

tanium_win_template_vmid: 9000  # template-win-server-2022
tanium_win_target_node: "{{ target_node }}"
tanium_win_storage: "{{ vm_storage | default('nvme-data') }}"
tanium_win_cores: 4
tanium_win_memory: 8192
tanium_win_dns_servers:
  - "{{ ip_dns_primary }}"

# Required per-invocation (no sane default): vmid, vm_name, ip, hostname.
# tanium_win_vmid: 254
# tanium_win_vm_name: win-sql-case1-01
# tanium_win_ip: 172.16.0.90
# tanium_win_hostname: WIN-SQL-CASE1
