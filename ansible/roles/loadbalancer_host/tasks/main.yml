---
# Cluster-wide locate. `pct` is node-local, but Proxmox HA can migrate the
# CT to any node at any time, so a static target_node pin goes stale the
# moment HA moves it (symptom: `pct set` fails with "Configuration file
# 'nodes/<pinned>/lxc/<id>.conf' does not exist"). We ask pmxcfs for the
# cluster resource list and record the node the CT *actually* lives on,
# then delegate every node-local pct operation to that node (lb_node).
# target_node is used only as (a) the cluster-query entry point and (b) the
# placement node when the CT doesn't exist yet and must be created.
- name: Locate Load Balancer LXC in cluster
  delegate_to: "{{ target_node }}"
  ansible.builtin.shell: |
    set -o pipefail
    pvesh get /cluster/resources --type vm --output-format json |
      python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin) if x["vmid"]=={{ lxc_id }}]; print(r[0]["node"] if r else "")'
  register: lxc_locate
  failed_when: false
  changed_when: false

# lb_exists drives the create/start gates; lb_node is where the CT lives now
# (falls back to target_node for the not-yet-created case, which is also the
# placement target — so post-create operations correctly target that node).
- name: Resolve CT existence and current node
  ansible.builtin.set_fact:
    lb_exists: "{{ (lxc_locate.stdout | default('') | trim) | length > 0 }}"
    lb_node: "{{ (lxc_locate.stdout | default('') | trim) or target_node }}"

- name: Download Template
  delegate_to: "{{ target_node }}"
  ansible.builtin.command: "pveam download {{ lxc_template_storage }} {{ lxc_template_file }}"
  register: template_dl
  args:
    creates: "/var/lib/vz/template/cache/{{ lxc_template_file }}"

- name: Create Load Balancer LXC
  delegate_to: "{{ target_node }}"
  ansible.builtin.shell: >
    pct create {{ lxc_id }} {{ lxc_template_storage }}:vztmpl/{{ lxc_template_file }}
    --hostname {{ lxc_hostname }}
    --cores {{ lxc_cores }}
    --memory {{ lxc_memory }}
    --swap {{ lxc_swap }}
    --net0 name=eth0,bridge=private,ip={{ lxc_net_ip }},gw={{ net_private_gw }},firewall=1
    --password {{ lb_01_root_pass }}
    --features nesting=1
    --ostype debian
    --unprivileged 1
    --ssh-public-keys /root/.ssh/authorized_keys
  no_log: true
  when: not lb_exists
  register: lxc_create

# Idempotent memory bump for the already-existing CT (the `pct create`
# above only ever runs once). 2026-09-11: apt-daily-upgrade.service got
# OOM-killed hitting the exact 512MB cgroup ceiling (see lxc_memory
# comment in defaults/main.yml for the full incident/reasoning).
- name: Check Load Balancer LXC's current memory config
  delegate_to: "{{ lb_node }}"
  ansible.builtin.command: "pct config {{ lxc_id }}"
  register: lb_config_current
  changed_when: false
  when: lb_exists

- name: Bump Load Balancer LXC memory ceiling (see lxc_memory comment in defaults)
  delegate_to: "{{ lb_node }}"
  ansible.builtin.command: "pct set {{ lxc_id }} --memory {{ lxc_memory }}"
  when:
    - lb_exists
    - "('memory: ' ~ lxc_memory) not in lb_config_current.stdout"

- name: Start Load Balancer LXC
  # Only start right after creation (matches the lxc_create gate). After
  # that, HA (or the operator) owns the running-state. The "already
  # running" tolerance is defensive for the edge where create reports
  # changed but something else started the CT first.
  delegate_to: "{{ target_node }}"
  ansible.builtin.command: "pct start {{ lxc_id }}"
  register: lxc_start
  failed_when: lxc_start.rc != 0 and "already running" not in lxc_start.stderr
  changed_when: lxc_start.rc == 0
  when: not lb_exists

# lb-01 is DUAL-HOMED: net0 = private SDN (backends), net1 = LAN ingress.
# It IS the internet ingress — Google Home forwards :80/:443 to it, and it
# runs the No-IP DDNS updater. The backends (gallery/vm/graf) are private-
# only, but the load balancer itself must straddle LAN+SDN or external access
# (auth.chi, tanium.chi, etc.) breaks.
#
# net1 is ip=dhcp with a Google Home DHCP reservation (lb_lan_ingress_ip,
# keyed on the NIC's MAC, pinned below via hwaddr=). Decided 2026-10-18: the
# old static .86 sat inside the Nest's DHCP pool (.20-.250) where the router
# could lease it to another device, and a static host never appears in the
# Home app's device picker, so a port-forward to it could not be created.
#
# Two things must stay true or ingress breaks:
#   1. The MAC must not change. Recreating the NIC (`pct set` without hwaddr=)
#      generates a new MAC and orphans the reservation (seen 2026-08-16, when
#      eth1 landed on a stray lease at .94).
#   2. HA's http.trusted_proxies must contain lb_lan_ingress_ip, or every
#      proxied request to homeassistant.chi 400s.
# In-CT routing (loadbalancer_service): no default route or DNS from the LAN
# side, plus a policy-routing table so replies to port-forwarded traffic leave
# via the Nest instead of the SDN gateway.
- name: Check if Net1 (LAN ingress) exists
  delegate_to: "{{ lb_node }}"
  ansible.builtin.shell: |
    set -o pipefail
    pct config {{ lxc_id }} | grep -q '^net1'
  register: net1_check
  failed_when: false
  changed_when: false

# LAN ingress: lb-01's eth1 (vmbr0) is a DHCP client with a Google Home
# reservation for {{ lb_lan_ingress_ip }} keyed on this NIC's MAC.
#
# Why DHCP and not a static IP: the Nest's DHCP pool is .20-.250, and .86 sits
# inside it. A static address is invisible to the router, so it can be leased
# to another device at any time (this is exactly what broke frigate-01 at .85
# on 2026-10-18). A reservation makes the address the router's responsibility
# and makes the NIC visible in the Home app, which is required because its
# port-management UI is device-picker only — no way to type an IP.
#
# No gateway on this NIC: default egress must stay via the private SDN.
- name: Ensure LAN ingress interface (net1 on vmbr0, DHCP + router reservation)
  delegate_to: "{{ lb_node }}"
  ansible.builtin.command: >
    pct set {{ lxc_id }} --net1
    name=eth1,bridge=vmbr0,ip=dhcp,firewall=1
  when: lb_exists and net1_check.rc != 0
  changed_when: true

# Idempotent re-assert: if net1 drifted back to a static address (manual
# pct set, NIC recreate, etc.), put it back on DHCP so the router reservation
# is what assigns the address.
- name: Detect net1 drifted to a static address
  delegate_to: "{{ lb_node }}"
  ansible.builtin.shell: |
    set -o pipefail
    pct config {{ lxc_id }} | grep '^net1' | grep -qv 'ip=dhcp'
  register: net1_static_check
  failed_when: false
  changed_when: false
  when: lb_exists and net1_check.rc == 0

- name: Correct net1 back to DHCP if drifted to static
  delegate_to: "{{ lb_node }}"
  ansible.builtin.shell: |
    set -o pipefail
    MAC=$(pct config {{ lxc_id }} | grep '^net1' | grep -oE 'hwaddr=[0-9A-Fa-f:]+' | cut -d= -f2)
    pct set {{ lxc_id }} --net1 name=eth1,bridge=vmbr0,hwaddr=${MAC},ip=dhcp,firewall=1
  when: lb_exists and net1_check.rc == 0 and net1_static_check.rc == 0
  changed_when: true

- name: Ensure private gateway on net0
  delegate_to: "{{ lb_node }}"
  ansible.builtin.shell: |
    set -o pipefail
    pct config {{ lxc_id }} | grep -q '^net0:.*gw={{ net_private_gw }}'
  register: lb_gw_check
  failed_when: false
  changed_when: false

- name: Set private gateway on net0 if missing
  delegate_to: "{{ lb_node }}"
  ansible.builtin.command: >
    pct set {{ lxc_id }} --net0 name=eth0,bridge=private,ip={{ lxc_net_ip }},gw={{ net_private_gw }},firewall=1
  when: lb_exists and lb_gw_check.rc != 0
  changed_when: true

- name: Ensure SSH Service is Running
  delegate_to: "{{ lb_node }}"
  ansible.builtin.shell: "pct exec {{ lxc_id }} -- systemctl enable --now ssh"
  changed_when: false
  ignore_errors: true

- name: Wait for Load Balancer to be ready
  ansible.builtin.wait_for_connection:
    delay: 10
    timeout: 300
