---
# One authentik node of a highly-available pair. See defaults/main.yml for the topology.

- name: Check for the docker compose plugin
  ansible.builtin.command: docker compose version
  register: authentik_service_compose_check
  changed_when: false
  failed_when: false

- name: Install docker + compose plugin (only when compose is missing)
  ansible.builtin.apt:
    name: "{{ authentik_docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: authentik_service_compose_check.rc != 0

# ---- database access: this node's own haproxy in front of the Patroni pair -----------------------
- name: Install haproxy
  ansible.builtin.apt:
    name: haproxy
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Render haproxy config (validated before it is installed)
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: "0644"
    owner: root
    group: root
    validate: haproxy -c -f %s
  notify: Reload haproxy

- name: Enable and start haproxy
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true

# apt starts haproxy with the stock config before ours is rendered; apply ours NOW, not at play end,
# or the database listener does not exist when authentik first starts below.
- name: Apply the haproxy config before authentik starts
  ansible.builtin.meta: flush_handlers

# A handler is lost when an earlier run failed after rendering the file, so a re-run sees "no change"
# and never reloads. Trust the listener, not the notification.
- name: Check haproxy is actually listening for the database
  ansible.builtin.shell: "ss -ltnH 'sport = :{{ authentik_pg_port }}' | grep -q ."
  args:
    executable: /bin/bash
  register: authentik_service_pg_listen
  changed_when: false
  failed_when: false

- name: Restart haproxy when the database listener is missing
  ansible.builtin.service:
    name: haproxy
    state: restarted
  when: authentik_service_pg_listen.rc != 0

# ---- application files ---------------------------------------------------------------------------
- name: Create the authentik directory tree
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0755"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
  loop:
    - { path: "{{ authentik_dir }}" }
    # The containers run as uid 1000 and write uploads here.
    - { path: "{{ authentik_dir }}/media", owner: "1000" }
    - { path: "{{ authentik_dir }}/media/public", owner: "1000" }
    - { path: "{{ authentik_dir }}/media/public/brand", owner: "1000" }
    - { path: "{{ authentik_dir }}/custom-templates", owner: "1000" }

# Media is configuration-as-code: icons and branding live in the repo and are identical on every
# node. (Uploading an icon through the UI lands on ONE node only - add the file to the repo instead.)
- name: Deploy application icons
  ansible.builtin.copy:
    src: media/public/application-icons/
    dest: "{{ authentik_dir }}/media/public/application-icons/"
    mode: "0644"
    directory_mode: "0755"
    owner: "1000"
    group: "1000"

- name: Deploy brand assets (the same files authentik_provider points the brand at)
  ansible.builtin.copy:
    src: "{{ role_path }}/../authentik_provider/files/{{ item.src }}"
    dest: "{{ authentik_dir }}/media/public/brand/{{ item.dest }}"
    mode: "0644"
    owner: "1000"
    group: "1000"
  loop:
    - { src: amd_enterprises_logo.svg, dest: logo.svg }
    - { src: amd_enterprises_favicon.svg, dest: favicon.svg }
    - { src: amd_enterprises_flow_bg.svg, dest: flow_bg.svg }

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ authentik_dir }}/docker-compose.yml"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  register: authentik_service_compose_file

- name: Deploy .env
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ authentik_dir }}/.env"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  register: authentik_service_env_file

- name: Remove single-node leftovers (override file, stale backups)
  ansible.builtin.shell: |
    set -e
    cd {{ authentik_dir }}
    rm -f docker-compose.ha.yml docker-compose.yml.bak* docker-compose.yml.pre-* docker-compose.override.yml
  args:
    executable: /bin/bash
    removes: "{{ authentik_dir }}/docker-compose.ha.yml"
  when: authentik_service_retire_legacy | bool

- name: Start authentik (and remove containers the new definition no longer has)
  community.docker.docker_compose_v2:
    project_src: "{{ authentik_dir }}"
    state: present
    remove_orphans: true
    recreate: "{{ 'always' if (authentik_service_compose_file.changed or authentik_service_env_file.changed) else 'auto' }}"
  register: authentik_service_compose_result

- name: Wait until this node answers ready
  ansible.builtin.uri:
    url: http://127.0.0.1:9000/-/health/ready/
    status_code: 200
  register: authentik_service_ready
  retries: 60
  delay: 3
  until: authentik_service_ready.status == 200

# ---- retire the old single-node front end ---------------------------------------------------------
# TLS is terminated on the load balancers (their own ACME). A per-node nginx + acme.sh only held a
# second copy of the DNS-API token and served nothing.
- name: Stop and disable the per-node nginx
  ansible.builtin.service:
    name: nginx
    state: stopped
    enabled: false
  failed_when: false
  when: authentik_service_retire_legacy | bool

- name: Remove the per-node acme.sh install (it carried a DNS-API token)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.acme.sh
    - /opt/acme.sh
    - /etc/nginx/sites-enabled/authentik
    - /etc/nginx/sites-available/authentik
    - /etc/nginx/ssl
  when: authentik_service_retire_legacy | bool

- name: Drop the acme.sh cron entry
  ansible.builtin.cron:
    name: "acme.sh"
    state: absent
  when: authentik_service_retire_legacy | bool

# Uploaded media is the only state authentik keeps outside PostgreSQL, and /opt/authentik/media is per node: mirror it to the peer.
- name: Mirror uploaded media to the other authentik node
  ansible.builtin.import_tasks: media_sync.yml
  tags: [media_sync]
