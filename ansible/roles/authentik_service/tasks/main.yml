---
- name: Remove legacy Docker source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Install dependencies (Nginx, Certs)
  ansible.builtin.apt:
    name:
      - curl
      - git
      - ca-certificates
      - gnupg
      - nginx
      - socat
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker GPG apt Key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker Repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install acme.sh (Clone Repo)
  ansible.builtin.git:
    repo: https://github.com/acmesh-official/acme.sh.git
    dest: /opt/acme.sh
    version: master
    depth: 1

- name: Install acme.sh (Run Installer)
  ansible.builtin.command:
    cmd: ./acme.sh --install -m admin@lab.amd-e.com
    chdir: /opt/acme.sh
  args:
    creates: /root/.acme.sh/acme.sh

- name: Create SSL Directory
  ansible.builtin.file:
    path: /etc/nginx/ssl
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Issue Certificate (DNS-01)
  ansible.builtin.shell: |
    export DEDYN_TOKEN="{{ acme_dedyn_token }}"
    /root/.acme.sh/acme.sh --issue \
      --dns dns_desec \
      -d auth.chi.lab.amd-e.com
  args:
    creates: /root/.acme.sh/auth.chi.lab.amd-e.com_ecc/auth.chi.lab.amd-e.com.key
  environment:
    DEDYN_TOKEN: "{{ acme_dedyn_token }}"
  no_log: true

- name: Install Certificate to Nginx
  ansible.builtin.shell: |
    /root/.acme.sh/acme.sh --install-cert -d auth.chi.lab.amd-e.com \
      --key-file       /etc/nginx/ssl/auth.key  \
      --fullchain-file /etc/nginx/ssl/fullchain.cer \
      --reloadcmd     "systemctl force-reload nginx"
  args:
    creates: /etc/nginx/ssl/auth.key

- name: Deploy Nginx Configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/authentik
    mode: '0644'
    owner: root
    group: root
  notify: Restart Nginx

- name: Enable Nginx Site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/authentik
    dest: /etc/nginx/sites-enabled/authentik
    state: link
  notify: Restart Nginx

- name: Remove Default Nginx Site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart Nginx

- name: Create Authentik Directory
  ansible.builtin.file:
    path: /opt/authentik
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Deploy Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/authentik/docker-compose.yml
    mode: '0640'
    owner: root
    group: root
  no_log: true

- name: Deploy .env file
  ansible.builtin.template:
    src: .env.j2
    dest: /opt/authentik/.env
    mode: '0600'
    owner: root
    group: root
  no_log: true

- name: Start Authentik Configuration
  community.docker.docker_compose_v2:
    project_src: /opt/authentik
    state: present
  register: authentik_service_compose_result

# -------------------------------------------------------------------------
# Branding image files (2026-09-12 fix)
#
# Previously the AMD-Enterprises logo/favicon/flow-background were pushed
# via manage_authentik.yml (authentik_provider role) as raw data: URIs
# PATCHed straight onto the brand's branding_logo/branding_favicon/
# branding_default_flow_background fields — Authentik's own docs confirmed
# at the time (2026-08-04) that no separate file-upload API endpoint
# existed, so this was the only API-only way to set an image value.
#
# That broke silently after this session's 2025.8.1->2026.8.0 upgrade:
# upstream changed how those fields resolve to URLs, and now ALWAYS
# prepends /files/media/public/ to whatever string is stored, even when
# that string is a full data: URI, producing a garbage URL like
# /files/media/public/data:image/svg+xml;base64,....  (matches upstream
# goauthentik/authentik#19541 and #19573 — known regression, not our
# config's fault). Real user impact: broken "authentik Logo" box on the
# login page.
#
# Root-cause fix: stop using data: URIs entirely. Copy the actual SVG
# files into Authentik's own /media/public/brand/ directory (the file
# picker's real, supported storage location per docs.goauthentik.io/
# customize/files/), then have authentik_provider/tasks/branding.yml
# PATCH the brand with plain relative paths (brand/logo.svg etc) instead
# of data URIs. Relative paths under /media/public/ correctly resolve via
# /files/media/public/<path>?token=... regardless of this upstream bug,
# because the bug is specifically in the data:-URI branch of that
# resolution logic, not the plain-relative-path branch. Verified live
# 2026-09-12: this exact pattern returns a real 200 image/svg+xml.
# -------------------------------------------------------------------------

- name: Ensure branding media directory exists inside the container
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T server
      mkdir -p /media/public/brand
    chdir: /opt/authentik
  changed_when: false

- name: Copy AMD-Enterprises branding SVGs into the container
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/authentik_provider/files/{{ item.src }}"
    dest: "/tmp/authentik_branding_{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: "amd_enterprises_logo.svg", dest: "logo.svg" }
    - { src: "amd_enterprises_favicon.svg", dest: "favicon.svg" }
    - { src: "amd_enterprises_flow_bg.svg", dest: "flow_bg.svg" }
  register: authentik_branding_staged

- name: Push staged branding SVGs into the running container's media volume
  ansible.builtin.shell: |
    set -e
    CID=$(docker compose ps -q server)
    docker cp /tmp/authentik_branding_{{ item.item.dest }} "$CID":/media/public/brand/{{ item.item.dest }}
  args:
    chdir: /opt/authentik
  loop: "{{ authentik_branding_staged.results }}"
  changed_when: true
  when: item.changed
  # Files rarely change once set; only re-push when the source SVG's
  # checksum actually differs from what's already on disk in /tmp, which
  # the copy task above already determined via authentik_branding_staged.
