---
# Keep uploaded media identical on both authentik nodes (it is the only per-node state; see templates/authentik-media-sync.sh.j2).
- name: rsync (the sync uses it)
  ansible.builtin.apt:
    name: rsync
    state: present
    cache_valid_time: 3600

- name: media-sync private key (from the vault)
  ansible.builtin.copy:
    content: "{{ vault_authentik_media_sync_key | b64decode }}"
    dest: /root/.ssh/authentik_media_sync
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: media tree owned by the container user (uid 1000) - an upload is written by that uid
  # CT 100's tree was owned by uid 1001, so a UI upload through it failed with "Permission denied" (found 2026-11-18); only ak-02 accepted uploads.
  ansible.builtin.file:
    path: "{{ authentik_dir }}/media"
    state: directory
    owner: "1000"
    group: "1000"
    recurse: true

- name: the earlier unrestricted root entry for this key is gone
  ansible.builtin.authorized_key:
    user: root
    key: "{{ lookup('ansible.builtin.file', playbook_dir + '/roles/authentik_service/files/authentik_media_sync.pub') }}"
    state: absent

- name: forced-command wrapper (the only thing the key can run)
  ansible.builtin.template:
    src: authentik-media-rrsync.sh.j2
    dest: /usr/local/sbin/authentik-media-rrsync
    mode: "0755"

- name: media-sync public key authorized for the login user, restricted to the wrapper
  ansible.builtin.authorized_key:
    user: "{{ authentik_media_sync_user }}"
    key: "{{ lookup('ansible.builtin.file', playbook_dir + '/roles/authentik_service/files/authentik_media_sync.pub') }}"
    key_options: 'restrict,command="/usr/local/sbin/authentik-media-rrsync"'
    exclusive: false
    state: present

- name: media-sync script
  ansible.builtin.template:
    src: authentik-media-sync.sh.j2
    dest: /usr/local/sbin/authentik-media-sync.sh
    mode: "0700"

- name: media-sync service + timer (every 2 minutes)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/authentik-media-sync.{{ item.ext }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - ext: service
      content: |
        [Unit]
        Description=Mirror authentik uploaded media to the other authentik node
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/authentik-media-sync.sh
    - ext: timer
      content: |
        [Unit]
        Description=Run the authentik media mirror every 2 minutes
        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=2min
        [Install]
        WantedBy=timers.target
  register: ak_media_units

- name: enable the media-sync timer
  ansible.builtin.systemd:
    name: authentik-media-sync.timer
    enabled: true
    state: started
    daemon_reload: "{{ ak_media_units.changed }}"
