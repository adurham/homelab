---
# authentik, highly available: every node in the `authentik_server` group runs the SAME stack
# (server + worker + its own haproxy in front of the Patroni pair) and the load balancers
# (lb-01/lb-02 `auth_backend` / `outpost_backend`) spread requests across all of them.
# There is no per-node database, no redis (authentik 2026.8 keeps sessions/cache/tasks in
# Postgres), and no per-node nginx/ACME: TLS terminates on the load balancers.

# Container image pin. Separate var so Renovate's custom-regex manager can track it.
# See `.github/renovate.json`.
authentik_image: "ghcr.io/goauthentik/server"
# Single source of truth for the deployed version (2026-09-12: a stale default here once
# silently downgraded a live node). authentik does NOT support two versions against one
# database: when bumping, change this and deploy ONE node at a time
# (`--limit authentik`, wait healthy, then `--limit authentik_02`) so the schema migration
# runs once and the other node keeps serving the old version until it is next.
authentik_tag: "2026.8.4"

authentik_dir: /opt/authentik

# Database: the Patroni pair, reached through a haproxy that EVERY authentik node runs for itself
# (`GET /primary` on the Patroni REST port picks the leader), so no node's database access depends
# on another node being up.
authentik_pg_backends:
  - { name: pg-01, address: 172.16.0.44 }
  - { name: pg-02, address: 172.16.0.48 }
authentik_pg_rest_port: 8008
authentik_pg_user: authentik
authentik_pg_db: authentik_utf8
authentik_pg_bind: "0.0.0.0"
authentik_pg_port: 5432
# The server/worker containers reach this node's own haproxy through the node's address.
authentik_pg_host: "{{ ansible_host }}"

authentik_web_workers: 2
authentik_web_threads: 4
authentik_mail_host: "{{ ip_mail_server }}"

# Apt names used only when a node has no `docker compose` yet (Ubuntu 24.04).
authentik_docker_packages:
  - docker.io
  - docker-compose-v2

# Retire the single-node leftovers (local nginx + acme.sh + override files) on nodes that had them.
authentik_service_retire_legacy: true

# The other authentik node, used only by the media mirror (tasks/media_sync.yml): uploaded media is per node and must be identical on both.
# Derived from the two inventory entries so nothing is hard-coded: the peer is the other host in this play.
# The other authentik node, used only by the media mirror (tasks/media_sync.yml). Media is per node and must be identical on both, so each node
# syncs to its peer: derive it from the inventory instead of hard-coding addresses.
authentik_peer_host: "{{ groups['authentik'] | list | difference([inventory_hostname]) | first | default(inventory_hostname) }}"
authentik_peer_ip: "{{ (hostvars[authentik_peer_host].ansible_host | default(authentik_peer_host)) }}"

