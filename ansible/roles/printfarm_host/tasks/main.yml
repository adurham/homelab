---
# Provisions the LXC that runs the Bambu -> Creality K2 print service
# ("print-01"): a small web app that converts a MakerWorld/Bambu Studio 3MF
# into a K2 project, slices it with Creality Print's own CLI, and can push the
# gcode to Tati's K2 (Moonraker on 192.168.86.43:7125).
#
# Mirrors the adblock_proxy_host / media_gallery_host pattern:
#   pveam template fetch -> cluster-wide existence check -> pct create ->
#   inject SSH key -> TUN passthrough (Tailscale inside the CT) -> add to the
#   in-memory inventory.
#
# NETWORKING (single NIC, private SDN only):
#   eth0 = private SDN (172.16.0.0/24) with gw 172.16.0.1 (tailscale-gw), which
#          NATs 172.16.0.0/24 out to the home LAN and the internet. Both things
#          this CT needs ride that: Moonraker on the K2 (192.168.86.43:7125) and
#          the tailnet itself. Verified from a private-only CT (media-ingest-02,
#          eth0 only): ping 192.168.86.43 OK, Moonraker /server/info HTTP 200.
#   NO LAN NIC. The earlier LAN leg was copied from adblock_proxy_host, where it
#          exists for proxy throughput; here it was pure liability — a second
#          interface on vmbr0 is exactly the dual-homing that makes the return
#          path asymmetric for CONTROL traffic (measured on adblock-proxy-01:
#          from this Mac, no ping and no port 22 at 172.16.0.49, while the
#          private-only media-ingest-02 answers both). Less surface, and the web
#          UI can never be reachable from the LAN by construction.

- name: Update Template Database
  ansible.builtin.command: pveam update
  changed_when: false

# Ubuntu 24.04, not 22.04: the Creality Print 7.3 AppImage links against
# noble-era sonames (libtiff.so.6, libx264-164, libasound2t64, libdeflate0).
# On 22.04 the CLI dies at startup looking for libtiff.so.6.
- name: Download Ubuntu 24.04 Template
  ansible.builtin.command: pveam download local ubuntu-24.04-standard_24.04-2_amd64.tar.zst
  args:
    creates: /var/lib/vz/template/cache/ubuntu-24.04-standard_24.04-2_amd64.tar.zst

# Resolve the node CT 119 lives on now (HA-aware). Sets ct_exists + ct_node;
# node-local `pct` ops below delegate to ct_node so they follow HA migrations.
- name: Resolve owning node for Print Service CT
  ansible.builtin.include_role:
    name: resolve_ct_node
  vars:
    ct_vmid: 119

- name: Create Print Service Container
  ansible.builtin.command: >
    pct create 119 /var/lib/vz/template/cache/ubuntu-24.04-standard_24.04-2_amd64.tar.zst
    --hostname print-01
    --cores 2 --memory 3072 --swap 2048
    --rootfs nvme-data:16
    --net0 name=eth0,bridge={{ net_private_bridge }},ip={{ ip_printfarm }}/24,gw={{ net_private_gw }},mtu={{ net_private_mtu }}
    --unprivileged 1
    --features nesting=1
    --password "{{ vault_printfarm_root_pass | default('changeme-printfarm') }}"
    --start 1
    --onboot 1
  no_log: true
  when: not ct_exists
  delegate_to: "{{ ct_node }}"

# Self-healing DHCP wait: on a fresh CT the eth1 lease can take 15-60s, and a
# second interface regeneration mid-wait orphans an in-flight negotiation, so
# re-nudge networkd every ~20s instead of a bare until-loop (see
# adblock_proxy_host for the live-debugged rationale).
- name: Wait for Print Service Container Default Route (via eth1 DHCP, self-healing reload)
  ansible.builtin.shell: |
    set -o pipefail
    for i in $(seq 1 36); do
      if pct exec 119 -- ip route show | grep -q "^default"; then
        echo "default route present after $((i * 5))s"
        exit 0
      fi
      if [ $((i % 4)) -eq 0 ]; then
        pct exec 119 -- networkctl reload || true
      fi
      sleep 5
    done
    echo "default route still absent after 180s"
    exit 1
  delegate_to: "{{ ct_node }}"
  changed_when: false

- name: Update Apt Cache in Print Service Container
  ansible.builtin.command: pct exec 119 -- apt-get update
  delegate_to: "{{ ct_node }}"
  when: not ct_exists
  changed_when: true

- name: Install Python3 in Print Service Container
  ansible.builtin.command: pct exec 119 -- apt-get install -y python3
  delegate_to: "{{ ct_node }}"
  when: not ct_exists
  changed_when: true

- name: Inject SSH Key into Print Service Container (via pipe)
  ansible.builtin.shell: |
    set -o pipefail
    pct exec 119 -- mkdir -p /root/.ssh
    cat /root/.ssh/authorized_keys | pct exec 119 -- sh -c "cat > /root/.ssh/authorized_keys"
    pct exec 119 -- chmod 700 /root/.ssh
    pct exec 119 -- chmod 600 /root/.ssh/authorized_keys
  delegate_to: "{{ ct_node }}"
  when: not ct_exists
  changed_when: true

- name: Ensure SSH is enabled and running
  ansible.builtin.command: pct exec 119 -- systemctl enable --now ssh
  delegate_to: "{{ ct_node }}"
  changed_when: false

# TUN passthrough so Tailscale can run inside the unprivileged CT (same two
# lines as adblock-proxy-01 / tailscale-gw). Without them
# /dev/net/tun is invisible in the container and `tailscale up` fails with
# "device or resource busy" / "no such device".
- name: Allow tun device cgroup in Print Service LXC config
  ansible.builtin.lineinfile:
    path: /etc/pve/lxc/119.conf
    line: 'lxc.cgroup2.devices.allow: c 10:200 rwm'
    state: present
    create: false
  register: printfarm_tun_cgroup

- name: Mount tun device in Print Service LXC config
  ansible.builtin.lineinfile:
    path: /etc/pve/lxc/119.conf
    line: 'lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file'
    state: present
    create: false
  register: printfarm_tun_mount

- name: Restart Print Service Container for TUN access
  ansible.builtin.command: pct reboot 119
  delegate_to: "{{ ct_node }}"
  when: printfarm_tun_cgroup.changed or printfarm_tun_mount.changed
  changed_when: true

- name: Wait for Print Service Container Network (default route + printer reach)
  # Checked from inside the CT over pct exec, so it does not depend on the
  # controller's own path to 172.16.0.0/24. It asserts the two things the CT
  # actually needs its egress for: a default route via tailscale-gw (172.16.0.1)
  # and a real Moonraker answer from the K2 on the home LAN (192.168.86.43:7125,
  # reached through tailscale-gw's NAT — no LAN NIC on this CT). A broken
  # private-SDN egress therefore fails the deploy, not someone's first print.
  ansible.builtin.shell: |
    set -o pipefail
    for i in $(seq 1 36); do
      if pct exec 119 -- sh -c 'ip route show | grep -q "^default" && curl -s -m 6 -o /dev/null http://192.168.86.43:7125/server/info'; then
        echo "default route + printer reach after $((i * 5))s"
        exit 0
      fi
      sleep 5
    done
    echo "no default route / no printer reach after 180s"
    exit 1
  args:
    executable: /bin/bash
  delegate_to: "{{ ct_node }}"
  changed_when: false

- name: Read the Container's Tailnet Address (empty until it has joined)
  # Ansible manages this CT over its TAILNET address once it has one: the CT
  # peers directly, and the subnet-routed private path then goes asymmetric for
  # control traffic — measured on this very CT: after the join, 172.16.0.51
  # stops answering this Mac (no ping, no port 22) while 100.120.18.93 answers
  # both, over a direct (non-DERP) peer link. The private address is only used
  # for the initial deploy, before there is a tailnet identity.
  ansible.builtin.shell: |
    set -o pipefail
    pct exec 119 -- tailscale ip -4 2>/dev/null | head -1
  args:
    executable: /bin/bash
  delegate_to: "{{ ct_node }}"
  register: printfarm_ts_probe
  changed_when: false
  failed_when: false

- name: Add Print Service Host to In-Memory Inventory
  ansible.builtin.add_host:
    name: print-01
    ansible_host: "{{ (printfarm_ts_probe.stdout | trim) or ip_printfarm }}"
    ansible_user: root
    groups: printfarm

- name: Wait for Print Service Container SSH
  ansible.builtin.wait_for:
    host: "{{ (printfarm_ts_probe.stdout | trim) or ip_printfarm }}"
    port: 22
    timeout: 90
  delegate_to: localhost
