---
victoriametrics_version: "1.142.0"

# homeassistant_token comes from inventory/group_vars/all.yml (vault-encrypted)

# Public-facing HTTPS endpoints we probe for cert expiry + reachability.
# Override at inventory level if a host should add/remove targets.
blackbox_https_targets:
  - https://grafana.chi.lab.amd-e.com
  - https://auth.chi.lab.amd-e.com
  - https://proxmox.chi.lab.amd-e.com
  # Home Assistant's own cert (core_letsencrypt add-on, DNS-01 via desec).
  # Added 2026-08-09 to fold the "Infrastructure: Let's Encrypt Cert
  # Renewal" HA automation's monitoring half into the existing
  # cert_renewer_wedged/cert_expiring_soon rules instead of a bespoke
  # check -- the HA automation itself (monthly hassio.addon_start trigger)
  # still runs unchanged; this just gives it the same Grafana-side
  # expiry backstop every other cert on this list already has.
  - https://homeassistant.chi.lab.amd-e.com

# Admin UIs that iframe their own console pane same-origin. Probed with the
# https_iframe_self_ok module — fails if X-Frame-Options: DENY or
# CSP frame-ancestors 'none' is returned, both of which silently break the
# in-app console pane in the browser.
blackbox_iframe_self_targets:
  - https://proxmox.chi.lab.amd-e.com
  - https://tanium.chi.lab.amd-e.com

# exo inference cluster nodes (2x Mac Studio M4) scraped on :52415 for the
# Prometheus /metrics endpoint. Both nodes are listed so master re-election
# never gaps per-generation metrics.
#
# Using Tailscale IPs, not the LAN IPs (was 192.168.86.201/.202) -- the LAN
# IPs are DHCP-leased and have drifted twice (2026-08-08, then again
# 2026-09-16/18 after a cluster-wide reboot), each time silently breaking
# this scrape with no in-cluster symptom (the exo process itself stayed
# healthy the whole time). Tailscale IPs are assigned at tailnet join and
# don't follow LAN DHCP, so they're stable across LAN reboots/renewals.
#
# CAVEAT (unresolved as of 2026-09-18): vm-01 (this scraper's host) has NO
# Tailscale client installed and no other route into the 100.x tailnet
# range (tailscale-gw only offers exit-node, doesn't advertise a subnet
# route back into the LAN) -- these targets will NOT actually be reachable
# from vm-01 until either (a) tailscale is installed+joined on vm-01, or
# (b) tailscale-gw is reconfigured to advertise a subnet route for the
# tailnet CGNAT range into the LAN side. Left as Tailscale IPs anyway
# (matching hermes_gateway's same fix, which DOES have a working tailnet
# path) so this is correct the moment either prerequisite lands, rather
# than needing a second edit. Override at inventory level if needed.
exo_scrape_targets:
  - name: macstudio-m4-1
    address: 100.91.246.26:52415
  - name: macstudio-m4-2
    address: 100.66.38.13:52415

# In-guest windows_exporter targets (roles/windows_exporter, port 9182).
# Empty by default -- win-sql-01/win-ts-01/win-tms-01/win-tzs-01 are
# currently powered off with no static IP assigned (see docs/ipam.md
# "Windows VMs" section). Populate once each VM is booted, has a real
# IP, and roles/windows_exporter has actually been run against it:
#   windows_exporter_scrape_targets:
#     - name: win-sql-01
#       address: <vm-ip>
#     - name: win-ts-01
#       address: <vm-ip>
#     - name: win-tms-01
#       address: <vm-ip>
#     - name: win-tzs-01
#       address: <vm-ip>
windows_exporter_scrape_targets: []
