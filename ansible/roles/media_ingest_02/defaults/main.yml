---
# Service account + install layout for the secondary source gallery collector.
# Mirrors roles/media_ingest (the primary source collector) but runs against a
# different upstream source platform and on its own CT (media-ingest-02, vmid 117,
# ip_media_ingest_02 172.16.0.48). The gallery push path is identical: OAuth2
# client_credentials against Authentik, then POST /ingest/upload/<folder> with a
# stem + date override, exactly like the primary collector.
media_ingest_02_user: mediaingest
media_ingest_02_dir: /opt/media-ingest-02          # code + venv
media_ingest_02_state: /var/lib/media-ingest-02    # auth.json, staging, metadata db (RW)
media_ingest_02_log_dir: /var/log/media-ingest-02

# Pin the scraper; bump deliberately. PyPI package name is the functional floor
# (same convention as the telethon pin in the primary collector).
media_ingest_02_scraper_version: "3.14.7"

# Gallery platform the collector pushes captured media to (via authenticated API).
# Same target as the primary collector — both feed the same gallery.
media_ingest_02_gallery_base: "https://gallery.chi.lab.amd-e.com"

# Authentik OAuth2 client-credentials token endpoint + collector client id.
# REUSES the primary collector's OAuth2 client (media-ingest-collector) rather
# than provisioning a separate one. Rationale: the gallery upload service
# validates JWTs against a single issuer/audience/JWKS URL (media-ingest-collector),
# so a distinct client would require gallery-side changes to accept multiple
# audiences. Both collectors are equally trusted (same operator, same gallery
# target), so credential sharing is the pragmatic call — one OAuth2 client,
# one service account, one secret to rotate. The client secret comes from the
# vault (vault_media_ingest_collector_client_secret, same key as the primary).
media_ingest_02_authentik_token_url: "https://auth.chi.lab.amd-e.com/application/o/token/"
media_ingest_02_collector_client_id: "media-ingest-collector"

# Scheduled scrape timer (the secondary source is pull-based, not push-based like
# the primary, so a periodic full sweep is the natural model — mirror the primary's
# reconcile timer pattern). OnBootSec + OnUnitActiveSec.
media_ingest_02_scrape_interval: "2h"
# How many most-recent posts per model to scan each sweep. Bounded so each run is
# cheap and the timer can fire often. The gallery's stem-dedup means overlap is free.
media_ingest_02_scrape_lookback: 50
# tmpfs staging size (RAM-backed). The scraper downloads a whole pass before the
# wrapper pushes, so staging must hold a full pass worth of media. 4G covers most
# passes of the manual list + filter discovery; the CT has 8G RAM to back it.
media_ingest_02_staging_size: "14G"
# Per-model timeout (minutes) for the manual pass. The wrapper loops through the
# model list one at a time, each with its own timeout, so a single stuck model
# doesn't kill the rest of the list. The dupe-check DB retries timed-out models
# next tick. 15min is enough for most models on repeat runs.
media_ingest_02_scraper_per_model_timeout_min: 15
# Number of models to scrape in parallel during the manual pass. The scraper is
# I/O bound (network downloads), not CPU bound, so parallelism cuts total sweep
# time from sum-of-all-models to max-of-any-model. Toned down from 10 to 3 on
# 2026-07-14 after Cloudflare 1015 rate-limited the home egress IP — the CT
# egresses through the home network's public IP, so a platform-side ban hits
# every device on the LAN, not just the scraper. Keep conservative.
media_ingest_02_scraper_parallelism: 3
# Per-scraper-process download concurrency. The scraper reads 'download_sems'
# from config.json (concurrent downloads per thread) and OFSC_THREADS_DEFAULT
# from env (number of worker threads). 2 threads x 2 sems = 4 concurrent
# downloads per scraper process; with parallelism=3 that's up to 12 concurrent
# downloads across all models — toned down from 10x4x8=320 on 2026-07-14 after
# Cloudflare 1015. The config.json template MUST use the
# {{ media_ingest_02_scraper_download_sems }} variable, not a hardcoded value,
# or this default is silently ignored.
media_ingest_02_scraper_threads: 2
media_ingest_02_scraper_download_sems: 2
# Name of the upstream source's custom user-list whose members get a full
# backfill scrape each tick. Used for pinning free-tier models (not paid subs —
# those are auto-discovered in pass 2). Add a model to this list in the source
# UI to start scraping them; remove when you want to stop. Empty = skip the
# pinned-list pass. The list name is case-insensitive and matched against the
# user's custom lists on the source platform.
media_ingest_02_pinned_list: ""
# Which upstream models to scrape. SENSITIVE — the model names reveal which
# accounts the operator is subscribed to, so they live in the vault
# (vault_media_ingest_02_scrape_usernames), NOT here. The env template pulls
# them from the vault at render time.

# Like pass — timeline posts from active subscriptions. Runs after all downloads
# and pushes. Disabled by default; set to "true" to enable.
media_ingest_02_likes_enabled: "false"
media_ingest_02_likes_daily_cap: 500
media_ingest_02_likes_per_model_cap: 50
media_ingest_02_likes_per_model_timeout: 900  # 15 min in seconds

# Defense-in-depth cap (bytes) on a single media item's size, wired into
# config.json's content_filter_options.file_size_max. The scraper checks this
# BEFORE writing any bytes (both the plain and DASH/DRM download paths) and,
# if exceeded, permanently marks the item Forced_skipped in its own dupe-check
# DB (not retried every sweep) instead of downloading it at all.
# Root-cause incident, 2026-09-21: a free-tier model's ~9.3GB video hit the
# per-model 15min download timeout on every sweep (always restarting from 0 —
# a separate, currently-accepted limitation, see auto_resume in config.json.j2),
# leaving an orphaned partial in the tmpfs staging dir, and separately (the
# actual OOM trigger) store_client.py's push_media() was double-buffering
# whole files in process heap — together these blew the CT's 24GB memory
# cgroup on this one file, repeatedly, for hours (see git history same date
# for the push_media() streaming fix, which is the primary fix). This cap is
# the belt-and-suspenders backstop so a future oversized asset (or a
# regression in the streaming fix) fails clean instead of OOM-looping the
# whole service.
#
# SAFETY-CRITICAL BOUND — READ BEFORE BUMPING. This number is only "safe"
# together with the streaming push in store_client.py. Sizing arithmetic for
# this CT (24 GiB cgroup, 14 GiB tmpfs staging), worst case = biggest allowed
# file resident in tmpfs + its heap cost at push time:
#   OLD (buffering) code, 9.3GB file: 9.3 tmpfs + ~18.6 heap  = ~27.9 GiB -> OOM
#   NEW (streaming)  code, 9.3GB file: 9.3 tmpfs + ~0.025 heap = ~9.3 GiB -> fine
#   NEW code + streaming REGRESSION, 8GiB file: 8 tmpfs + ~16 heap = ~24 GiB -> AT THE EDGE
# i.e. if the streaming fix is ever reverted/broken, this cap is just barely
# survivable; raising it materially (or shrinking the cgroup) re-creates the
# original OOM with no other change. Change one, re-check the other.
# Sized from actual history: scanned every model's own SQLite metadata (`size`
# column, 227k+ media rows across 420 models) — p99.9 of real content is
# ~273MB, and the largest CONFIRMED-legitimate successful downloads ever seen
# top out at 5.88GB. 8GiB gives real content comfortable margin while sitting
# well under the 14G tmpfs staging ceiling.
media_ingest_02_file_size_max_bytes: 8589934592  # 8 GiB
