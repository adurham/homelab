---
# Installs the secondary source gallery collector inside the media-ingest-02 LXC.
# Runs against the CT directly (after media_ingest_02_host provisions it).
# Pattern: apt deps -> service user -> tmpfs staging -> venv + scraper ->
# deploy code/units -> render config + env -> conditional start (only once the
# upstream source auth.json is present — one-time assisted login).

- name: Install Base OS Packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-dev
      - build-essential
      - ca-certificates
      - curl
      - ffmpeg
    state: present
    update_cache: true
    cache_valid_time: 3600

# ─── Service account + directories ─────────────────────────────────────────
- name: Create Collector System User
  ansible.builtin.user:
    name: "{{ media_ingest_02_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "/home/{{ media_ingest_02_user }}"
    create_home: true
    state: present
  register: m02_user

- name: Ensure Install + State + Log Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ media_ingest_02_user }}"
    group: "{{ media_ingest_02_user }}"
    mode: '0750'
  loop:
    - "{{ media_ingest_02_dir }}"
    - "{{ media_ingest_02_state }}"
    - "{{ media_ingest_02_state }}/metadata"
    - "{{ media_ingest_02_state }}/main_profile"
    - "{{ media_ingest_02_log_dir }}"

# ─── Hardening: tmpfs for decrypted-media staging ──────────────────────────
# The staging dir holds DECRYPTED media in flight to the gallery. Back it with
# tmpfs so nothing viewable ever persists to disk — a stolen disk / Proxmox
# backup / snapshot contains no plaintext. Unit filename is a systemd-escaped
# path.
- name: Compute systemd-escaped mount unit name
  ansible.builtin.command: "systemd-escape -p --suffix=mount {{ media_ingest_02_state }}/staging"
  register: media_ingest_02_mount_unit
  changed_when: false

- name: Render staging tmpfs mount unit
  ansible.builtin.template:
    src: staging.mount.j2
    dest: "/etc/systemd/system/{{ media_ingest_02_mount_unit.stdout }}"
    owner: root
    group: root
    mode: '0644'
  vars:
    media_ingest_02_user_uid: "{{ m02_user.uid }}"
    media_ingest_02_user_gid: "{{ m02_user.group }}"
  notify: Reload Systemd

- name: Enable & Start staging tmpfs mount (decrypted media RAM-only)
  ansible.builtin.systemd:
    name: "{{ media_ingest_02_mount_unit.stdout }}"
    enabled: true
    state: started
    daemon_reload: true

# ─── Python venv + scraper ────────────────────────────────────────────────
- name: Create Collector Virtualenv
  ansible.builtin.command: python3 -m venv {{ media_ingest_02_dir }}/venv
  args:
    creates: "{{ media_ingest_02_dir }}/venv/bin/python"
  become: true
  become_user: "{{ media_ingest_02_user }}"

- name: Upgrade pip/setuptools/wheel
  ansible.builtin.pip:
    name:
      - pip
      - setuptools
      - wheel
    state: latest  # noqa: package-latest
    virtualenv: "{{ media_ingest_02_dir }}/venv"
  become: true
  become_user: "{{ media_ingest_02_user }}"

- name: Install scraper (pinned) + requests
  ansible.builtin.pip:
    name:
      - "{{ vault_media_ingest_02_scraper_pkg }}=={{ media_ingest_02_scraper_version }}"
      - requests
    virtualenv: "{{ media_ingest_02_dir }}/venv"
  become: true
  become_user: "{{ media_ingest_02_user }}"
  no_log: true

# ─── Deploy code ───────────────────────────────────────────────────────────
- name: Deploy Gallery Client
  ansible.builtin.copy:
    src: store_client.py
    dest: "{{ media_ingest_02_dir }}/store_client.py"
    owner: "{{ media_ingest_02_user }}"
    group: "{{ media_ingest_02_user }}"
    mode: '0750'
  notify: Restart Media Ingest 02 Timer

- name: Deploy Scraper Wrapper
  ansible.builtin.copy:
    src: scraper_wrapper.py
    dest: "{{ media_ingest_02_dir }}/scraper_wrapper.py"
    owner: "{{ media_ingest_02_user }}"
    group: "{{ media_ingest_02_user }}"
    mode: '0750'
  notify: Restart Media Ingest 02 Timer

# ─── Patch: use media-only chat endpoint instead of messages endpoint ──────
# The messages endpoint marks messages read server-side on any GET. The
# media-only endpoint returns the same posts with media arrays but does NOT
# trigger read marking (verified: unread count unchanged across 13 models
# with unread messages). This patch replaces get_messages to use the
# media endpoint with offset-based pagination. The URL is constructed from
# the existing messagesEP constant (path-suffix swap) so no platform URL
# is hardcoded in this repo. Package identity comes from the vault (no_log).
- name: Find installed messages module
  ansible.builtin.find:
    paths: "{{ media_ingest_02_dir }}/venv/lib"
    patterns: "{{ vault_media_ingest_02_scraper_pkg }}/data/api/messages.py"
    file_type: file
  register: m02_messages_py
  changed_when: false
  no_log: true

- name: Patch messages module to use /media endpoint (no read marking)
  ansible.builtin.replace:
    path: "{{ m02_messages_py.files[0].path }}"
    regexp: >-
      (?s)async def get_messages\(model_id, username, c=None, post_id=None\):.*?update_check\(data, model_id, after, API\)\n[ \t]*return data
    replace: |-
      async def get_messages(model_id, username, c=None, post_id=None):
          # PATCHED: use the media-only chat endpoint instead of the messages
          # endpoint. The messages endpoint marks messages read server-side on
          # any GET. The media endpoint returns the same posts with media arrays
          # but does NOT trigger read marking. Construct the media URL from the
          # existing messagesEP constant by swapping the path suffix.
          _base_ep = of_env.getattr("messagesEP").replace("/messages?", "/media?")
          offset = 0
          responseArray = []
          seen = set()
          while True:
              url = _base_ep.format(model_id) + "&offset={}".format(offset)
              async with c.requests_async(url=url) as r:
                  if not (200 <= r.status < 300):
                      break
                  data = await r.json_()
                  if not isinstance(data, dict):
                      break
                  batch = data.get("list", [])
                  if not batch:
                      break
                  for post in batch:
                      if post.get("id") not in seen:
                          seen.add(post.get("id"))
                          responseArray.append(post)
                  if not data.get("hasMore"):
                      break
                  offset += len(batch)
          update_check(responseArray, model_id, 0, API)
          return responseArray
  when: m02_messages_py.files[0].path is defined and m02_messages_py.files | length > 0
  notify: Restart Media Ingest 02 Timer
  no_log: true

# ─── Config + env (secrets from vault) ─────────────────────────────────────
- name: Render Scraper Config
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ media_ingest_02_state }}/config.json"
    owner: "{{ media_ingest_02_user }}"
    group: "{{ media_ingest_02_user }}"
    mode: '0640'
  notify: Restart Media Ingest 02 Timer

- name: Render Scraper Env File
  ansible.builtin.template:
    src: scraper.env.j2
    dest: "{{ media_ingest_02_dir }}/scraper.env"
    owner: "{{ media_ingest_02_user }}"
    group: "{{ media_ingest_02_user }}"
    mode: '0600'
  no_log: true
  notify: Restart Media Ingest 02 Timer

# ─── Detect whether the upstream auth.json is already present ──────────────
# The scraper unit will fail if auth.json isn't present yet (one-time assisted
# login). Gate enable/start on this so a fresh deploy doesn't crash-loop.
- name: Check for auth.json
  ansible.builtin.stat:
    path: "{{ media_ingest_02_state }}/main_profile/auth.json"
  register: auth_stat

- name: Set Auth Authorized Fact
  ansible.builtin.set_fact:
    m02_auth_authorized: "{{ auth_stat.stat.exists and auth_stat.stat.size | default(0) > 0 }}"

# auth.json IS a credential (read access == account takeover). Lock it 0600.
- name: Secure auth.json (0600)
  ansible.builtin.file:
    path: "{{ media_ingest_02_state }}/main_profile/auth.json"
    owner: "{{ media_ingest_02_user }}"
    group: "{{ media_ingest_02_user }}"
    mode: '0600'
  when: auth_stat.stat.exists

# ─── systemd unit + timer ──────────────────────────────────────────────────
- name: Render Collector Service Unit
  ansible.builtin.template:
    src: media-ingest-02.service.j2
    dest: /etc/systemd/system/media-ingest-02.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload Systemd
    - Restart Media Ingest 02 Timer

- name: Render Collector Timer Unit
  ansible.builtin.template:
    src: media-ingest-02.timer.j2
    dest: /etc/systemd/system/media-ingest-02.timer
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload Systemd
    - Restart Media Ingest 02 Timer

- name: Enable & Start Collector Timer (only if auth authorized)
  ansible.builtin.systemd:
    name: media-ingest-02.timer
    enabled: true
    state: started
    daemon_reload: true
  when: m02_auth_authorized

- name: Enable Collector Timer Unit (auth not yet authorized)
  ansible.builtin.systemd:
    name: media-ingest-02.timer
    enabled: true
    daemon_reload: true
  when: not m02_auth_authorized

- name: One-Time Login Reminder
  ansible.builtin.debug:
    msg: >-
      auth.json not yet present. Run the assisted login helper on this box to
      populate {{ media_ingest_02_state }}/main_profile/auth.json (owned by
      {{ media_ingest_02_user }}, 0600), then: systemctl start media-ingest-02.service
  when: not m02_auth_authorized

# ─── Security hardening ────────────────────────────────────────────────────
# NOTE: this box makes only OUTBOUND connections (to upstream source + lb-01 for
# the gallery API). It exposes NO inbound services.
- name: Harden SSH (key-only, no passwords)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-harden.conf
    content: |
      # Managed by Ansible (roles/media_ingest_02). Key-only auth.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
    owner: root
    group: root
    mode: '0644'
  notify: Reload SSH
