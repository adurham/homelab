global
    daemon
    maxconn 200

defaults
    mode tcp
    timeout connect 5s
    timeout client 30m
    timeout server 30m

# Grafana's stable database endpoint. Patroni answers 200 on :8008/primary
# only for the leader, so the backend follows promotions.
frontend pg
    bind 172.16.0.30:5432
    default_backend pg_nodes

backend pg_nodes
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2
    server pg-01 172.16.0.44:5432 check port 8008
    server pg-02 172.16.0.48:5432 check port 8008 backup
