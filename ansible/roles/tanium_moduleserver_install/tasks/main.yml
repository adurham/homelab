---
# Silent-install the Tanium Module Server. Verified against
# moduleserver.nsi source on platdev-jump (same tag as tanium_server_install)
# 2026-08-20.
#
# Unlike Tanium Server, the Module Server always uses its own bundled
# Postgres (InitSQLVariables hardcodes $UsePostgres="1" unconditionally,
# with no /UseSQLServer equivalent) — it never touches the customer's SQL
# Server at all, and its SQL-driver-download path (a separate Tanium
# Postgres installer .exe, not a third-party MSI via nsExec::ExecToStack)
# is structurally different from Tanium Server's confirmed-hanging
# msiexec call. No equivalent of the tanium_server_install incident
# applies here — verified via source, not assumed.
#
# CRITICAL, confirmed via source 2026-08-21: /RegisterAdminPassFile is
# NOT a plaintext password file. moduleserver.nsi's own install-time
# registration (line ~1480: "$INSTDIR\TaniumModuleServer.exe register
# ... --pass-file $RegisterAdminPassFile") passes it straight through to
# TaniumModuleServer.exe register, whose --pass-file handling
# (Components/PluginServer/ProcessModuleServerCommandLine.cpp) calls
# DataProtectionSerialization::LoadSerializedBlobAsString on the file
# contents — a Tanium-specific serialized+base64 blob, NOT raw
# plaintext, NOT bare base64, NOT PowerShell's ConvertTo-SecureString
# DPAPI format (all three were tried and failed with "class
# InvalidBase64" / "Failed to parse protected data from string" before
# this was traced to source). The correct generator is
# `KeyUtility.exe protect --input <plaintext-file> --output <blob-file>`
# (Components/KeyUtility/KeyUtility.cpp, uses the exact same
# DataProtectionSerialization::MakeSerializedBlob under the hood) — this
# role now generates the pass-file that way instead of writing plaintext.
#
# IMPORTANT: the protection key is per-user, per-machine
# (Components/DataProtection/CurrentUserKeyEncryptionKey.cpp reads/writes
# "%USERPROFILE%\.tanium-user-key-encryption.key"). The protect step and
# the install/register step MUST run as the same Windows user on the
# same box — both do here (Administrator, over WinRM, same task run) —
# a file protected on a different machine or under a different account
# will not decrypt.
#
# Registration against the Tanium Server: RegisterModuleServer defaults
# to "1" (register) on a fresh install automatically — no need to pass
# /RegisterModuleServer=1 explicitly.
#
# Full parameter reference (moduleserver.nsi, grep 'GetOptions.*Params'):
#   /ServerAddress /ServerPort /LogVerbosityLevel /TrustedCertPath
#   /TrustedFingerprint /ServerHostName /SelfSign /CertPath /KeyPath
#   /MainServerHostName /RegisterModuleServer /RegisterAdminUser
#   /RegisterAdminPassFile /SkipDBCreate

# Snapshot tanium_moduleserver_ip to a plain fact before any task-level
# `vars:` block redefines `ansible_host` — see tanium_windows_vm_clone's
# role header for why this avoids a real Jinja recursion error.
- name: "Resolve tanium_moduleserver_ip to a plain fact"
  ansible.builtin.set_fact:
    tanium_moduleserver_ip_resolved: "{{ tanium_moduleserver_ip }}"

- name: "Check if Tanium Module Server is already installed"
  delegate_to: localhost
  ansible.windows.win_stat:
    path: "{{ tanium_moduleserver_install_dir }}\\TaniumModuleServer.exe"
  register: ms_exe_check
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Ensure {{ tanium_installers_dir }} exists on {{ tanium_moduleserver_ip }}"
  when: not ms_exe_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_file:
    path: "{{ tanium_installers_dir }}"
    state: directory
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Copy installer to {{ tanium_moduleserver_ip }}"
  when: not ms_exe_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_copy:
    src: "{{ tanium_setup_moduleserver_exe_local_path }}"
    dest: "{{ tanium_installers_dir }}\\SetupModuleServer.exe"
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Write plaintext registration password to a temp file"
  when: not ms_exe_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_copy:
    content: "{{ tanium_console_admin_password }}"
    dest: "{{ tanium_installers_dir }}\\register-pass-plain.txt"
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"
  no_log: true

# REAL BUG, confirmed 2026-08-22 via a live end-to-end run: this check
# only ever looked for KeyUtility.exe LOCALLY on the Module Server box
# itself -- but a Module Server install never has one (it ships with
# the Tanium Server / Zone Server installers, not the Module Server
# one), so this check failed on every genuinely fresh Module Server
# install even when a perfectly good KeyUtility.exe already existed on
# the Tanium Server box right next to it. Fixed using the exact same
# base64-through-the-Ansible-controller technique already proven for
# tanium-init.dat in tanium_zoneserver_install -- a direct box-to-box
# Invoke-Command would very likely hit the same double-hop/Kerberos
# delegation problem already root-caused elsewhere in this session
# (see tanium_server_install's header), so route the read+write through
# two separate WinRM hops instead of one cross-machine one.
#
# SEPARATE REAL BUG, confirmed 2026-08-22: copying ONLY KeyUtility.exe
# (with a byte-identical, verified-uncorrupted transfer) still fails to
# RUN with exit code -1073741515 = 0xC0000135 (STATUS_DLL_NOT_FOUND) --
# it dynamically loads libcrypto-3.dll/libssl-3.dll (and friends) from
# its own directory, which a bare copy of the .exe alone doesn't bring
# along. Fixed by fetching the whole sibling-DLL set from the same
# Tanium Server directory, not just the one binary.
- name: "Check for KeyUtility.exe on the Tanium Server box (to fetch, since Module Server installs don't ship one)"
  when: not ms_exe_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_stat:
    path: "C:\\Program Files\\Tanium\\Tanium Server\\KeyUtility.exe"
  register: ts_keyutility_check
  vars:
    ansible_host: "{{ tanium_server_ip }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Read KeyUtility.exe + its required sibling DLLs from the Tanium Server"
  when: not ms_exe_check.stat.exists and ts_keyutility_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_shell: "[Convert]::ToBase64String([IO.File]::ReadAllBytes('C:\\Program Files\\Tanium\\Tanium Server\\{{ item }}'))"
  register: keyutility_deps_b64
  loop:
    - KeyUtility.exe
    - libcrypto-3.dll
    - libssl-3.dll
  loop_control:
    label: "{{ item }}"
  vars:
    ansible_host: "{{ tanium_server_ip }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

# REAL BUG, confirmed 2026-08-22: KeyUtility.exe is a real compiled
# binary (hundreds of KB), and its base64 form is far longer than
# Windows' ~8191-character command-line limit -- passing it as a
# win_shell command-line argument (which worked fine for the much
# smaller tanium-init.dat, 1116 bytes) fails with CreateProcessW()
# error 206 ("filename or extension is too long"). Write it to a local
# temp file on the Ansible controller and use win_copy's real file
# transfer instead of a command-line argument, exactly like every
# other binary transfer in this repo (SetupServer.exe etc.).
- name: "Save KeyUtility.exe + DLLs to local temp files"
  when: not ms_exe_check.stat.exists and ts_keyutility_check.stat.exists
  delegate_to: localhost
  ansible.builtin.copy:
    content: "{{ item.stdout | trim | b64decode }}"
    dest: "{{ tanium_local_scratch_dir | default('/tmp') }}/{{ item.item }}_{{ tanium_moduleserver_ip | replace('.', '_') }}"
    mode: "0600"
  loop: "{{ keyutility_deps_b64.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: keyutility_local_files
  no_log: true

- name: "Copy KeyUtility.exe + DLLs onto this Module Server"
  when: not ms_exe_check.stat.exists and ts_keyutility_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_copy:
    src: "{{ item.dest }}"
    dest: "{{ tanium_installers_dir }}\\{{ item.item.item }}"
  loop: "{{ keyutility_local_files.results }}"
  loop_control:
    label: "{{ item.item.item }}"
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

# Requires a Tanium Server (or Module Server -- either binary ships
# KeyUtility.exe) install present on THIS box already for KeyUtility.exe
# to exist; the Module Server's own installer directory doesn't have it
# before install, so this borrows Tanium Server's copy over WinRM if
# present, otherwise fails clearly instead of silently writing garbage.
- name: "Locate a KeyUtility.exe to use for protecting the pass-file"
  when: not ms_exe_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_shell: >-
    if (Test-Path 'C:\Program Files\Tanium\Tanium Server\KeyUtility.exe') {
      'C:\Program Files\Tanium\Tanium Server\KeyUtility.exe'
    } elseif (Test-Path "{{ tanium_installers_dir }}\KeyUtility.exe") {
      "{{ tanium_installers_dir }}\KeyUtility.exe"
    } else {
      ''
    }
  register: keyutility_path_check
  changed_when: false
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "SAFETY: fail clearly if no KeyUtility.exe is available to protect the pass-file"
  when: not ms_exe_check.stat.exists
  ansible.builtin.assert:
    that:
      - (keyutility_path_check.stdout | trim) != ''
    fail_msg: >-
      No KeyUtility.exe found on {{ tanium_moduleserver_ip }} (checked
      the local Tanium Server install dir and tanium_installers_dir).
      This is required to generate a valid --pass-file for
      SetupModuleServer.exe's registration step -- see this role's
      task-file header for why a plaintext password file fails with
      "class InvalidBase64". Copy KeyUtility.exe from a Tanium
      Server/Module Server install onto this box, or install this role
      on a box that already has one.

# REAL BUG, confirmed 2026-08-22: KeyUtility.exe protect refuses to
# overwrite an existing output file (FileExistsException) -- a
# leftover register-pass.txt from any earlier partial/failed run makes
# this role non-idempotent. Remove it first, unconditionally.
- name: "Remove any stale register-pass.txt before generating a fresh one"
  when: not ms_exe_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_file:
    path: "{{ tanium_installers_dir }}\\register-pass.txt"
    state: absent
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Generate the properly-protected registration pass-file via KeyUtility.exe protect"
  when: not ms_exe_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_shell: >-
    & "{{ keyutility_path_check.stdout | trim }}" protect
    --input "{{ tanium_installers_dir }}\register-pass-plain.txt"
    --output "{{ tanium_installers_dir }}\register-pass.txt"
  register: protect_result
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Remove the plaintext password file (protected blob is what SetupModuleServer.exe reads)"
  delegate_to: localhost
  ansible.windows.win_file:
    path: "{{ tanium_installers_dir }}\\register-pass-plain.txt"
    state: absent
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

# Since SetupServer.exe runs with /SelfSign=1 (see tanium_server_install),
# TaniumModuleServer.exe register's TLS handshake to it fails with
# "certificate verify failed" unless the exact server cert fingerprint
# is pre-trusted via /TrustedFingerprint=. Confirmed via source
# (moduleserver.nsi line ~1489-1509): the installer itself only
# discovers this fingerprint interactively (a Yes/No MessageBox) on a
# failed first attempt -- there is no silent-mode auto-trust path. Fetch
# the Server's real "Server TLS" leaf cert fingerprint programmatically
# instead (TaniumReceiver.exe pki show --json --full-fingerprints) and
# pass it explicitly, so registration succeeds on the first silent
# attempt with no interactive prompt at all.
# REAL BUG, confirmed 2026-08-22: this script used a YAML folded
# scalar (>-), which joins every line with a single space -- fine for
# simple one-liners, but it silently turns the function definition's
# closing "}" and the next statement "$fp = $null" into one run-on
# line with no separator, which PowerShell then fails to parse
# ("Unexpected token 'foreach'"). Switched to a literal block scalar
# (|) so real newlines survive, exactly as written below.
# REAL BUG, confirmed 2026-08-22 via a live from-scratch run: this
# call to `pki show` intermittently fails with "Failed to connect to
# database after 1 attempts" even though the Server is confirmed
# genuinely healthy seconds before AND immediately after (manually
# re-run the identical command right after this failure and it
# succeeded cleanly) -- this matches the same class of transient
# SQL/network blip documented at length elsewhere in this repo
# (tanium_lab_sql_install, the DC secure-channel incident). Add a
# retry instead of failing the whole play on one bad attempt.
- name: "Fetch the Tanium Server's TLS certificate fingerprint"
  when: not ms_exe_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_shell: |
    $json = & '{{ tanium_install_dir | default('C:\Program Files\Tanium\Tanium Server') }}\TaniumReceiver.exe' pki show --json --full-fingerprints | ConvertFrom-Json
    function Find-ServerTLS($node) {
      if ($node.name -like '* Server TLS *') { return $node.fingerprint }
      foreach ($child in $node.children) {
        $result = Find-ServerTLS $child.key
        if ($result) { return $result }
      }
      return $null
    }
    $fp = $null
    foreach ($root in $json.roots) { $fp = Find-ServerTLS $root.key; if ($fp) { break } }
    Write-Output $fp
  register: server_fingerprint_result
  until: (server_fingerprint_result.stdout | default('') | trim) != ''
  retries: 5
  delay: 15
  changed_when: false
  vars:
    ansible_host: "{{ tanium_server_ip }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "SAFETY: fail clearly if the Server's TLS fingerprint could not be determined"
  when: not ms_exe_check.stat.exists
  ansible.builtin.assert:
    that:
      - (server_fingerprint_result.stdout | trim) != ''
    fail_msg: >-
      Could not determine {{ tanium_server_ip }}'s Server TLS
      certificate fingerprint via 'TaniumReceiver.exe pki show --json
      --full-fingerprints'. Registration would otherwise fail on the
      TLS handshake with "certificate verify failed" and no way to
      trust it non-interactively -- see this role's task-file header.

- name: "Run SetupModuleServer.exe /S (silent install + register)"
  when: not ms_exe_check.stat.exists
  delegate_to: localhost
  ansible.windows.win_command:
    cmd: >-
      {{ tanium_installers_dir }}\SetupModuleServer.exe /S
      /MainServerHostName={{ tanium_server_ip }}
      /RegisterAdminUser={{ tanium_console_admin_user }}
      /RegisterAdminPassFile={{ tanium_installers_dir }}\register-pass.txt
      /TrustedFingerprint={{ server_fingerprint_result.stdout | trim }}
      /SelfSign=1
  register: install_result
  changed_when: true
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Remove registration password file (protected blob)"
  delegate_to: localhost
  ansible.windows.win_file:
    path: "{{ tanium_installers_dir }}\\register-pass.txt"
    state: absent
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Wait for TaniumModuleServer.exe to exist (install completion signal)"
  delegate_to: localhost
  ansible.windows.win_stat:
    path: "{{ tanium_moduleserver_install_dir }}\\TaniumModuleServer.exe"
  register: install_done_check
  until: install_done_check.stat.exists
  retries: 30
  delay: 20
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Verify Tanium Module Server service is running"
  delegate_to: localhost
  ansible.windows.win_service:
    name: "Tanium Module Server"
  register: service_check
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"

- name: "Start Tanium Module Server service if not running"
  when: service_check.state != 'running'
  delegate_to: localhost
  ansible.windows.win_service:
    name: "Tanium Module Server"
    state: started
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].tanium_moduleserver_ip_resolved }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_user: Administrator
    ansible_password: "{{ vault_win_admin_password }}"
