---
# Vault secrets consumed by this role (provisioned one-time, not managed here):
#   vault_vm_backup_gdrive_client_id      — Google OAuth client_id (reused from media_gallery)
#   vault_vm_backup_gdrive_client_secret  — Google OAuth client_secret
#   vault_vm_backup_gdrive_token          — JSON token blob from `rclone authorize`
#   vault_vm_backup_crypt_password        — rclone crypt password (plaintext; obscured form used in conf)
#   vault_vm_backup_crypt_password2       — rclone crypt password2 (salt)
# All also stored in macOS keychain as VMBackupGDrive* / VMBackupCrypt* for out-of-band recovery.

# GDrive folder layout (under the OAuth user's Drive root):
#   vm-backup/daily/<timestamp>      — daily snapshots, see retention below
#   vm-backup/archive-yearly/<year>  — yearly full-dataset archives, kept indefinitely
vm_backup_gdrive_folder: "vm-backup"

# Daily snapshot retention. REWRITTEN 2026-09-28: age-based -> generation +
# hard-cap. See the header of vm-backup-daily.sh.j2 for the full model.
#
# Why the rewrite: "keep everything younger than N days" has NO ceiling.
# Snapshot size tracks the live dataset, which grows ~0.4-0.6 GB/day, so
# 90d x 21.7 GiB = ~1.9 TiB and still climbing -- that was 37% of the 5 TB
# Google One quota and the single largest consumer (media gallery ~1 TB).
# A fixed day-count cannot bound that; a byte cap can.
#
# Model now:
#   - at most ONE snapshot per calendar day (kills the duplicate class the
#     old hourly restart-loop produced, which no age rule collects)
#   - keep every day for vm_backup_daily_keep_days
#   - then newest-per-ISO-week for vm_backup_weekly_keep_weeks
#   - then enforce vm_backup_max_total_gb, dropping oldest first but never
#     below vm_backup_always_keep (floor, so a tiny cap can't wipe history)
#
# Long-horizon tiers are unaffected: archive-yearly/ is kept indefinitely,
# and the 2y queryable window is the live VM storage itself.
vm_backup_daily_keep_days: 14
vm_backup_weekly_keep_weeks: 12     # ~3 months of weekly points beyond the daily window
vm_backup_max_total_gb: 200         # hard ceiling for the ENTIRE daily/ tree
vm_backup_always_keep: 7            # never prune below this many snapshots

vm_backup_state_dir: "/var/lib/vm-backup"
