---
# Ships Home Assistant's host/core/supervisor/add-on journal logs into
# Loki. Runs on adblock-proxy-01 (same host as the AdGuard log shipper)
# since it already has direct LAN reachability to HA — see
# templates/ha_log_shipper.py.j2 for the full auth/pagination/timezone
# design rationale.

- name: Create ha-log-shipper System User
  ansible.builtin.user:
    name: ha-log-shipper
    system: true
    shell: /usr/sbin/nologin
    home: /home/ha-log-shipper
    create_home: true

- name: Ensure /opt/ha-log-shipper Directory Exists
  ansible.builtin.file:
    path: /opt/ha-log-shipper
    state: directory
    owner: ha-log-shipper
    group: ha-log-shipper
    mode: '0755'

- name: Ensure /var/lib/ha-log-shipper State Directory Exists
  ansible.builtin.file:
    path: /var/lib/ha-log-shipper
    state: directory
    owner: ha-log-shipper
    group: ha-log-shipper
    mode: '0750'

- name: Ensure /etc/ha-log-shipper Directory Exists
  ansible.builtin.file:
    path: /etc/ha-log-shipper
    state: directory
    owner: root
    group: ha-log-shipper
    mode: '0750'

- name: Deploy Home Assistant Long-Lived Token for HA Log Shipper
  ansible.builtin.copy:
    content: "{{ vault_hermes_gw_hass_token }}"
    dest: /etc/ha-log-shipper/hass_token
    owner: root
    group: ha-log-shipper
    mode: '0640'
  no_log: true
  # Reuses the same vaulted long-lived HA token as the AdGuard log
  # shipper and hermes_gateway roles — one fewer credential to rotate.

- name: Deploy HA Log Shipper Script
  ansible.builtin.template:
    src: ha_log_shipper.py.j2
    dest: /opt/ha-log-shipper/ha_log_shipper.py
    owner: ha-log-shipper
    group: ha-log-shipper
    mode: '0750'

- name: Install HA Log Shipper Systemd Service + Timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - name: ha-log-shipper.service
      content: |
        [Unit]
        Description=Ship Home Assistant host/core/supervisor/add-on logs to Loki
        After=network-online.target

        [Service]
        Type=oneshot
        User=ha-log-shipper
        Group=ha-log-shipper
        ExecStart=/usr/bin/python3 /opt/ha-log-shipper/ha_log_shipper.py
        TimeoutStartSec=60
    - name: ha-log-shipper.timer
      content: |
        [Unit]
        Description=Run the HA log shipper every minute

        [Timer]
        OnBootSec=30s
        OnUnitActiveSec=60s
        AccuracySec=5s

        [Install]
        WantedBy=timers.target
  register: ha_log_shipper_units
  notify: Restart HA Log Shipper Timer

- name: Enable & Start HA Log Shipper Timer
  ansible.builtin.systemd:
    name: ha-log-shipper.timer
    state: started
    enabled: true
    daemon_reload: true
