---
# Shared defaults for every node's nightly vzdump job. Per-node overrides
# (job id, schedule, vmid list) live in inventory/proxmox.yml -- see the
# comment on pve01's pve_backup_job_id for the history of why this role
# exists (frigate-01 + bwt-dhcp silently missing from backup for months
# because the jobs were hand-configured outside ansible, 2026-09-11).
#
# 2026-09-12: was 'local' (the small root-disk-backed storage), which
# caused pve01's root LVM disk to hit 94% full when vzdump-lxc-170
# (frigate-01, ~13GB/night) + everything else accumulated with
# keep-last=3. Moved to vzdump-nvme, a ZFS-pool-backed dir storage
# created by roles/proxmox_storage (hundreds of GB free on every node
# vs ~6-16GB free on the root disks). See that role's tasks/main.yml
# for why a plain zfspool storage can't hold backup content directly.
pve_backup_storage: vzdump-nvme
pve_backup_compress: zstd
pve_backup_mode: snapshot
# PVE's own job-completion email. 'always' sent a "backup successful" mail per
# node per night through mail-01 -> iCloud, where it landed in the operator's
# personal inbox (39 such mails in the 10 days to 2026-10-28) alongside the
# Grafana alert flood. Backup SUCCESS is not an event worth waking anyone for;
# failure still mails, and Grafana already has guest_backup_stale /
# guest_backup_missing / offsite_backup_* rules covering silent breakage.
pve_backup_mailnotification: failure
# Retention, in PVE's own `prune-backups` syntax (comma-joined keep-*=N).
# Enforced on create AND drift-corrected on every run by tasks/main.yml.
#
# 2026-10-21: keep-last=3 -> keep-daily=2,keep-weekly=1. Same disk
# footprint (3 archives per guest at steady state -- simulated against
# PVE's prune algorithm), but the oldest restore point is now 2-8 days old
# instead of always exactly 2 days, so damage noticed after a weekend is
# still recoverable. keep-daily also collapses ad-hoc same-day manual runs
# (2026-10-20: two manual CT 101 dumps each consumed a keep-last slot).
# Anything bigger does NOT fit pve01: one generation of every guest it
# hosts is ~38 GiB (113 hermes-gw-01 15.7G + 170 frigate-01 14.1G
# dominate), its dump dir holds ~113 GiB, the pool is 81% CAP / 68% FRAG
# with 147G avail -- each extra generation costs another ~38 GiB there.
# Numbers + procedure: docs/2026-10-21-backup-retention-audit.md.
#
# Timing caveat when changing this live: the first nightly run under the
# new policy prunes by the NEW rules. Apply between Mon 03:30 and Tue 02:00
# so the first run is a Tuesday -- applied later in the week, guests dip to
# 2 archives until the next ISO-week rollover (Monday).
# keep-daily=3,keep-weekly=2 (~5 archives/guest) is the largest policy that
# fits pve01: one night is ~38 GB and the pool has 288 GB free, so
# keep-daily=7 would need ~266 GB (98% pool) and keep-last=3+daily=7+weekly=2
# needs ~456 GB. Fable proposed daily=7/weekly=4; the space math forbids it.
pve_backup_prune_backups: "keep-daily=3,keep-weekly=2"
pve_backup_notes_template: "ansible-managed nightly backup"
