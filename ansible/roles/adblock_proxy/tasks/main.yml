---
# Configures adblock-proxy-01 (CT 118) — personal-device MITM ad-stripping
# proxy (Discord + Reddit). Devices opt in individually via explicit HTTPS
# proxy settings pointed at this host's Tailscale IP, OR via the Tailscale
# exit-node path (transparent mode, tailscale0-only). The host LXC itself
# is created by roles/adblock_proxy_host; this role handles the
# application layer.

- name: Install Base OS Packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create mitmproxy System User
  ansible.builtin.user:
    name: mitmproxy
    system: true
    shell: /usr/sbin/nologin
    home: /home/mitmproxy
    create_home: true

- name: Ensure /opt/adblock-proxy Directory Exists
  ansible.builtin.file:
    path: /opt/adblock-proxy
    state: directory
    owner: mitmproxy
    group: mitmproxy
    mode: '0755'

- name: Create mitmproxy Virtualenv (Python 3)
  ansible.builtin.command: python3 -m venv /opt/adblock-proxy/venv
  args:
    creates: /opt/adblock-proxy/venv/bin/python

# ─── Tailscale (explicit-proxy is served ONLY over the tailnet) ───────────
# mitmdump binds to the CT's tailscale0 IP, not eth0/private-SDN — devices
# must be on the tailnet to reach it at all. No `tailscale serve`/TLS
# termination needed here: Tailscale's own WireGuard transport already
# encrypts the link, and mitmproxy does its own TLS termination for the
# proxied HTTPS traffic on top of that. Runs BEFORE the mitmproxy service
# is installed/started since the systemd unit's ExecStart needs the
# resolved Tailscale IP to bind to.

- name: Install Tailscale on Adblock Proxy
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale
    executable: /bin/bash

- name: Check Tailscale auth state on Adblock Proxy
  ansible.builtin.command: tailscale status --self --peers=false
  register: adblock_proxy_tailscale_status
  failed_when: false
  changed_when: false

- name: Fail with manual-step instructions if Tailscale is not authed
  ansible.builtin.fail:
    msg: |
      Tailscale on adblock-proxy-01 is installed but not authed. Run the
      following on pve03 to authorize the CT (browser link will print):

          ssh root@pve03 'pct exec 118 -- tailscale up --hostname=adblock-proxy-01'

      Then re-run this playbook. After auth, the mitmproxy service will
      bind to the resolved tailscale0 interface IP.
  when: adblock_proxy_tailscale_status.rc != 0 or 'Logged out' in adblock_proxy_tailscale_status.stdout

# ─── Exit-node mode (2026-07-27) ───────────────────────────────────────────
# Advertises this CT as a Tailscale exit node so a phone can route ALL its
# traffic (WiFi + cellular) through here with one toggle in the Tailscale
# app, instead of per-network manual HTTP proxy settings (iOS's Global HTTP
# Proxy MDM payload requires a *supervised* device, a non-starter for a
# personal iPhone). Must be separately approved server-side via the
# Tailscale admin console or API (POST /api/v2/device/{id}/routes with
# routes:["0.0.0.0/0","::/0"]) — advertising alone does not enable it.
- name: Persist IPv4/IPv6 forwarding (required for exit-node mode)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale.conf
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
    owner: root
    group: root
    mode: '0644'
  register: adblock_proxy_sysctl
  notify: Reload Sysctl (Adblock Proxy)

- name: Advertise Adblock Proxy as a Tailscale exit node
  # --accept-dns=false is passed HERE as well as in the later task: `--reset`
  # re-enables tailscaled's DNS management, and a re-run of just this task
  # (or any manual `tailscale up --reset`) silently repointed resolv.conf at
  # MagicDNS. Observed live 2026-11-05: CorpDNS was true even though the role
  # sets it false, so exit-node DNS resolution was riding an accidental
  # fallback chain instead of AdGuard.
  ansible.builtin.command: tailscale up --hostname=adblock-proxy-01 --advertise-exit-node --accept-dns=false --reset
  changed_when: true
  # tailscaled persists this in its own state file (not the systemd unit),
  # so it's safe to re-run idempotently; --reset just re-applies flags.

- name: Get Adblock Proxy Tailscale IPv4
  ansible.builtin.command: tailscale ip -4
  register: adblock_proxy_ts_ip
  changed_when: false

- name: Install mitmproxy in Virtualenv
  ansible.builtin.pip:
    name: mitmproxy
    virtualenv: /opt/adblock-proxy/venv
    state: present

- name: Fix Ownership of Virtualenv
  ansible.builtin.file:
    path: /opt/adblock-proxy/venv
    state: directory
    owner: mitmproxy
    group: mitmproxy
    recurse: true

# ─── Discord + Reddit ad/tracking-stripping addon ──────────────────────────
# Filters known Discord Quest/Discovery/Promotion API response paths so the
# client renders no ad content, while every other discord.com/discordapp.net
# request (login, messages, CDN, voice gateway, etc.) passes through
# untouched. Also blocks Reddit's known tracking/ad-serving domains
# (ads.reddit.com etc.) and captures real Reddit feed JSON for future
# inline-promoted-post stripping (see the addon's own module docstring —
# REDDIT STATUS section — for what's live vs. pending live-traffic
# verification). Endpoint list is a living document — see the addon's own
# comment block for how to extend it after a mitmweb capture session.
- name: Remove Legacy discord_adblock.py (renamed to ad_block.py 2026-08-21)
  ansible.builtin.file:
    path: /opt/adblock-proxy/discord_adblock.py
    state: absent

- name: Deploy Discord + Reddit Ad-Stripping mitmproxy Addon
  ansible.builtin.template:
    src: ad_block.py.j2
    dest: /opt/adblock-proxy/ad_block.py
    owner: mitmproxy
    group: mitmproxy
    mode: '0644'
  notify:
    - Restart Adblock Proxy
    - Restart Adblock Proxy Transparent

- name: Remove Midea Token/Key Capture mitmproxy Addon (reverted 2026-08-08)
  ansible.builtin.file:
    path: /opt/adblock-proxy/midea_capture.py
    state: absent
  notify:
    - Restart Adblock Proxy
    - Restart Adblock Proxy Transparent

- name: Install Adblock Proxy Systemd Unit (explicit proxy, port 8080)
  ansible.builtin.template:
    src: adblock-proxy.service.j2
    dest: /etc/systemd/system/adblock-proxy.service
    owner: root
    group: root
    mode: '0644'
  vars:
    adblock_proxy_listen_host: "{{ adblock_proxy_ts_ip.stdout | trim }}"
  notify: Restart Adblock Proxy

- name: Enable & Start Adblock Proxy (explicit proxy)
  ansible.builtin.systemd:
    name: adblock-proxy
    state: started
    enabled: true
    daemon_reload: true

# ─── Split-tunnel PAC file (added 2026-08-21) ──────────────────────────────
# Tailscale exit nodes are all-or-nothing at the OS routing level (RouteAll
# swaps a device's ENTIRE default route) — there's no per-domain exit-node
# routing built into Tailscale. Measured live: full-tunnel exit-node mode
# adds a hop + real latency to 100% of a device's traffic just to filter
# two apps. This PAC file gets true split tunneling: a device configures
# "Automatic Proxy Configuration" pointing at this URL (Tailscale stays
# connected but NOT set as exit node) and only Discord/Reddit hostnames get
# routed through the explicit mitmproxy listener above (:8080) — everything
# else returns DIRECT, using the device's own normal default route with
# zero added latency. See proxy.pac.j2's own header comment for the full
# design rationale and the domain-list sync requirement with ad_block.py.
- name: Deploy Split-Tunnel PAC File
  ansible.builtin.template:
    src: proxy.pac.j2
    dest: /opt/adblock-proxy/proxy.pac
    owner: mitmproxy
    group: mitmproxy
    mode: '0644'
  vars:
    adblock_proxy_listen_host: "{{ adblock_proxy_ts_ip.stdout | trim }}"

- name: Deploy PAC File Server Script
  ansible.builtin.template:
    src: pac_server.py.j2
    dest: /opt/adblock-proxy/pac_server.py
    owner: mitmproxy
    group: mitmproxy
    mode: '0750'
  vars:
    adblock_proxy_listen_host: "{{ adblock_proxy_ts_ip.stdout | trim }}"
  notify: Restart Adblock Proxy PAC Server

- name: Install Adblock Proxy PAC Systemd Unit
  ansible.builtin.template:
    src: adblock-proxy-pac.service.j2
    dest: /etc/systemd/system/adblock-proxy-pac.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Adblock Proxy PAC Server

- name: Enable & Start Adblock Proxy PAC Server
  ansible.builtin.systemd:
    name: adblock-proxy-pac
    state: started
    enabled: true
    daemon_reload: true

# ─── Transparent mode (exit-node path) ─────────────────────────────────────
# Devices that route through this host as a Tailscale exit node (phone,
# WiFi + cellular) never set a proxy explicitly — their HTTPS traffic just
# arrives on tailscale0 and gets NAT-redirected here. mitmproxy peeks the
# TLS SNI per-connection and only decrypts/filters Discord hostnames;
# everything else (banking apps, iMessage, etc.) is relayed as opaque TCP
# so cert pinning elsewhere on the phone never breaks.
- name: Install netfilter-persistent (transparent-redirect rules)
  ansible.builtin.apt:
    name:
      - iptables
      - iptables-persistent
      - netfilter-persistent
    state: present

- name: Install Adblock Proxy Transparent Systemd Unit (port 8443, local-only)
  ansible.builtin.template:
    src: adblock-proxy-transparent.service.j2
    dest: /etc/systemd/system/adblock-proxy-transparent.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Adblock Proxy Transparent

- name: Install Transparent-Redirect iptables Rules (exit-node HTTPS -> mitmproxy)
  ansible.builtin.template:
    src: adblock-transparent.rules.v4.j2
    dest: /etc/iptables/rules.v4
    owner: root
    group: root
    mode: '0644'
  notify: Apply Transparent-Redirect iptables Rules

- name: Enable & Start Adblock Proxy Transparent
  ansible.builtin.systemd:
    name: adblock-proxy-transparent
    state: started
    enabled: true
    daemon_reload: true

# ─── Failure hardening (added 2026-11-04) ──────────────────────────────────
# This host is the INTERNET PATH for every device using it as an exit node, so
# "mitmproxy stopped" is not a degraded ad experience, it's those devices going
# offline. Four fixes, each aimed at a specific failure observed live:
#   1. systemd gave up after 5 failed starts in 10s (StartLimitIntervalSec) —
#      a flaky boot left the listener permanently dead with the unit "failed".
#   2. Restart=on-failure ignored clean-but-early exits.
#   3. No memory bound: a leak would OOM the container instead of recycling the
#      process (MemoryMax in the drop-in).
#   4. No fail-open: with the listener down, the REDIRECT rules black-hole
#      443/80 and exit-node clients lose the internet. The guard pulls the
#      rules while unhealthy and restores them once the listener is back.
- name: Create adblock-proxy-transparent Drop-In Directory
  ansible.builtin.file:
    path: /etc/systemd/system/adblock-proxy-transparent.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Harden Adblock Proxy Transparent Unit (restart forever, memory cap)
  ansible.builtin.template:
    src: adblock-proxy-transparent.override.conf.j2
    dest: /etc/systemd/system/adblock-proxy-transparent.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Adblock Proxy Transparent

- name: Deploy Fail-Open Guard Script
  ansible.builtin.template:
    src: failopen_guard.sh.j2
    dest: /opt/adblock-proxy/failopen_guard.sh
    owner: root
    group: root
    mode: '0755'

- name: Install Fail-Open Guard Unit
  ansible.builtin.template:
    src: adblock-failopen.service.j2
    dest: /etc/systemd/system/adblock-failopen.service
    owner: root
    group: root
    mode: '0644'

- name: Install Fail-Open Guard Timer
  ansible.builtin.template:
    src: adblock-failopen.timer.j2
    dest: /etc/systemd/system/adblock-failopen.timer
    owner: root
    group: root
    mode: '0644'

- name: Enable & Start Fail-Open Guard Timer
  ansible.builtin.systemd:
    name: adblock-failopen.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Cap journald at 150M (mitmproxy logs every flow)
  ansible.builtin.template:
    src: journald-size.conf.j2
    dest: /etc/systemd/journald.conf.d/size.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart journald (Adblock Proxy)

- name: Vacuum Existing Journals Down to the New Cap
  ansible.builtin.command: journalctl --vacuum-size=150M
  changed_when: false

# ─── Monitoring the real single point of failure (added 2026-11-05) ────────
# The proxy CT was hardened while the box that actually owns DNS + DHCP for the
# whole house — a 4 GB HA Green running AdGuard (2.1M rules) — had no telemetry
# at all. These push four gauges a minute into VictoriaMetrics:
#   adblock_agh_up, adblock_dnsmasq_up, adblock_interceptor_listener,
#   adblock_addon_heartbeat_age_seconds
# AdGuard's admin API is loopback-only on the HA host; it is exposed on that
# host's tailnet IP by a socat forwarder inside the Advanced SSH app. If that
# app is stopped, adblock_agh_up goes 0 and the alert tells you why.
- name: Deploy Adblock Health Monitor Script
  ansible.builtin.template:
    src: adblock-monitor.sh.j2
    dest: /opt/adblock-proxy/monitor_push.sh
    owner: root
    group: root
    mode: '0755'

- name: Install Adblock Health Monitor Unit
  ansible.builtin.template:
    src: adblock-monitor.service.j2
    dest: /etc/systemd/system/adblock-monitor.service
    owner: root
    group: root
    mode: '0644'

- name: Install Adblock Health Monitor Timer
  ansible.builtin.template:
    src: adblock-monitor.timer.j2
    dest: /etc/systemd/system/adblock-monitor.timer
    owner: root
    group: root
    mode: '0644'

- name: Enable & Start Adblock Health Monitor Timer
  ansible.builtin.systemd:
    name: adblock-monitor.timer
    state: started
    enabled: true
    daemon_reload: true

# ─── Bypass canary (added 2026-11-05) ──────────────────────────────────────
# Configuration can't tell you a device is resolving somewhere else (hardcoded
# 8.8.8.8, app DoH, DoT to a public resolver). This does: every device with a
# lease that answers ICMP but has zero AdGuard queries in 24h is a bypass.
# Devices carrying a dnsmasq tag are excluded — they're pointed at another
# gateway deliberately (cameras, the Switch).
- name: Install python3-websocket (lease table read)
  ansible.builtin.apt:
    name: python3-websocket
    state: present

- name: Deploy Bypass Canary
  ansible.builtin.template:
    src: adblock-canary.py.j2
    dest: /opt/adblock-proxy/bypass_canary.py
    owner: root
    group: root
    mode: '0755'

- name: Install Bypass Canary Unit
  ansible.builtin.template:
    src: adblock-canary.service.j2
    dest: /etc/systemd/system/adblock-canary.service
    owner: root
    group: root
    mode: '0644'

- name: Install Bypass Canary Timer
  ansible.builtin.template:
    src: adblock-canary.timer.j2
    dest: /etc/systemd/system/adblock-canary.timer
    owner: root
    group: root
    mode: '0644'

- name: Enable & Start Bypass Canary Timer
  ansible.builtin.systemd:
    name: adblock-canary.timer
    state: started
    enabled: true
    daemon_reload: true

# ─── DNS-level ad/tracker blocking (exit-node path only) ───────────────────
# The Discord SNI filter above only covers Discord. Every other app on a
# phone routing through this exit node gets zero ad/tracker blocking
# without this. Rather than standing up a second DNS blocklist stack
# here, this points the CT's OWN resolver at the AdGuard Home instance
# that already runs the home LAN's DNS (192.168.86.2, HA add-on — see
# memory facts 405/417): 7 active blocklists, 800k+ combined rules,
# verified live and blocking (doubleclick.net -> 0.0.0.0, 2026-07-27).
#
# WHY THE CT'S OWN RESOLVER, NOT AN IPTABLES DNAT: exit-node clients'
# DNS queries do NOT transit the exit node's tailscale0 interface as
# real UDP/TCP:53 packets — Tailscale tunnels them via an internal
# mechanism, and the exit node's own tailscaled resolves them using
# whatever /etc/resolv.conf says (confirmed via tcpdump showing zero
# packets on tailscale0:53 despite active client DNS queries, and via
# https://github.com/tailscale/tailscale/issues/17617 — "the tailscaled
# process then resolves these locally by performing a local query to
# the default DNS as configured on that exit node"). An iptables
# PREROUTING rule on tailscale0 — which works perfectly for the HTTPS
# REDIRECT above — is a structural no-op for DNS and was removed after
# confirming it never matched a single packet.
#
# `tailscale set --accept-dns=false` stops tailscaled from overwriting
# /etc/resolv.conf with the tailnet's MagicDNS config (100.100.100.100),
# then resolv.conf is pinned directly at AdGuard.
- name: Disable Tailscale's own DNS management on Adblock Proxy
  ansible.builtin.command: tailscale set --accept-dns=false
  changed_when: true

- name: Point Adblock Proxy's resolver at AdGuard Home
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver {{ ip_homeassistant }}
      nameserver 1.1.1.1
    owner: root
    group: root
    mode: '0644'
  # No search domain: this file is consumed by the exit-node DNS proxy
  # path for arbitrary client queries, not just this CT's own lookups —
  # a search domain would silently mangle unqualified queries from
  # exit-node clients.

- name: Show Adblock Proxy Tailscale IP + connection instructions
  ansible.builtin.debug:
    msg: |
      adblock-proxy-01 is up at {{ adblock_proxy_ts_ip.stdout | trim }}:8080
      (also reachable as adblock-proxy-01.tail19c543.ts.net:8080) and is
      approved as a Tailscale exit node.

      OPTION A — exit node (covers WiFi + cellular, one toggle):
        1. Tailscale app -> Exit Node -> adblock-proxy-01
        2. Discord ads are stripped transparently; Reddit tracking/ad
           domains (ads.reddit.com etc.) are blocked; DNS-level
           ad/tracker blocking is enforced via the existing AdGuard Home
           instance (192.168.86.2, 7 blocklists) for every other app;
           all other apps' HTTPS traffic passes through as an opaque
           relay (no TLS interception outside discord.com/
           discordapp.net/discord.gg/discord.media/reddit.com/
           redditmedia.com).
        NOTE: while active, ALL phone traffic egresses via the homelab's
        public IP, not just Discord's/Reddit's. Reddit's inline
        promoted-post stripping is NOT live yet (needs a verified-live
        capture of the real ad-marker field — see ad_block.py's module
        docstring); tracking-domain blocking is live now.

      OPTION B — per-network explicit proxy (WiFi only, no exit-node
      blast radius):
        1. Wi-Fi settings -> Configure Proxy -> Manual
           Server: {{ adblock_proxy_ts_ip.stdout | trim }}   Port: 8080
        2. Visit http://mitm.it while proxied, install + trust the
           mitmproxy CA cert for the device's OS.
        NOTE: Option B does NOT get the AdGuard DNS redirect (scoped to
        tailscale0 exit-node traffic only) — only the Discord SNI-based
        filtering applies. On WiFi at home, AdGuard already covers DNS
        for the whole LAN anyway.

      Both options require trusting the mitmproxy CA cert once
      (http://mitm.it) before HTTPS traffic decrypts cleanly.

# ─── Lab device full-traffic capture (added 2026-11-04) ───────────────────
# A second mitmproxy instance that DECRYPTS everything from one device, so its
# app traffic can actually be read. It cannot be the 8443 listener: ad_block.py
# sets `data.ignore_connection = True` for every SNI that is not Discord/Reddit,
# so that path relays everything else as opaque TLS by design, and it is what
# the whole household's filtering rides on.
#
# The device arrives here because its DHCP reservation (HA dnsmasq app, tag
# `opphone`) points its default gateway at this host, so its traffic lands on
# eth1. The only thing that then steers it into the capture listener is the
# source-scoped REDIRECT inserted by phone_redirect_guard.sh — which also FAILS
# OPEN: if the listener dies, the rules come out, because a REDIRECT to a dead
# port means the device loses the internet, not merely loses capture.
#
# The device must trust the mitmproxy CA for this to be useful (system store,
# not user store — app traffic ignores user certs). On the OnePlus Open that is
# the Magisk module `mitmca`, which overlays the Conscrypt APEX cacerts dir.
#
# Read the output with ~/bin/opcap on the Mac, or straight off
# /var/log/mitmproxy/phone-capture.log here; bodies too large for the log are in
# the phone-flows.mitm stream file (replay in mitmweb).
#
# Set adblock_phone_capture_enabled: false to tear it down — the units are
# stopped and disabled, and the guard removes its rules within one tick.
- name: Deploy Lab Device Capture Addon
  ansible.builtin.copy:
    src: phone_capture.py
    dest: /opt/adblock-proxy/phone_capture.py
    owner: mitmproxy
    group: mitmproxy
    mode: '0644'
  notify: Restart Adblock Phone Capture
  when: adblock_phone_capture_enabled
  tags: [phone_capture]

- name: Deploy Lab Device Redirect Guard
  ansible.builtin.template:
    src: phone_redirect_guard.sh.j2
    dest: /opt/adblock-proxy/phone_redirect_guard.sh
    owner: root
    group: root
    mode: '0755'
  when: adblock_phone_capture_enabled
  tags: [phone_capture]

- name: Install Lab Device Capture Unit
  ansible.builtin.template:
    src: adblock-phone.service.j2
    dest: /etc/systemd/system/adblock-phone.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Adblock Phone Capture
  when: adblock_phone_capture_enabled
  tags: [phone_capture]

- name: Install Lab Device Capture Guard Unit
  ansible.builtin.template:
    src: phone-capture-guard.service.j2
    dest: /etc/systemd/system/phone-capture-guard.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Lab Phone Capture Guard
  when: adblock_phone_capture_enabled
  tags: [phone_capture]

- name: Install Lab Device Capture Guard Timer
  ansible.builtin.template:
    src: phone-capture-guard.timer.j2
    dest: /etc/systemd/system/phone-capture-guard.timer
    owner: root
    group: root
    mode: '0644'
  notify: Restart Lab Phone Capture Guard
  when: adblock_phone_capture_enabled
  tags: [phone_capture]

- name: Enable & Start Lab Device Capture
  ansible.builtin.systemd:
    name: adblock-phone
    state: started
    enabled: true
    daemon_reload: true
  when: adblock_phone_capture_enabled
  tags: [phone_capture]

- name: Enable & Start Lab Device Capture Guard Timer
  ansible.builtin.systemd:
    name: phone-capture-guard.timer
    state: started
    enabled: true
    daemon_reload: true
  when: adblock_phone_capture_enabled
  tags: [phone_capture]

# Idempotent: the guard only ever ensures/removes its own two rules and the
# single UDP/443 REJECT for the captured address, so running it again is a
# no-op on a healthy host.
- name: Apply Lab Device Redirect Rules Now
  ansible.builtin.command: /opt/adblock-proxy/phone_redirect_guard.sh
  changed_when: false
  when: adblock_phone_capture_enabled
  tags: [phone_capture]

- name: Tear Down Lab Device Capture (when disabled)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - adblock-phone.service
    - phone-capture-guard.timer
  failed_when: false
  when: not adblock_phone_capture_enabled
  tags: [phone_capture]
