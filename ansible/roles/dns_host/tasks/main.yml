---
- name: Update Template Database
  ansible.builtin.command: pveam update
  changed_when: false

- name: Download Ubuntu 22.04 Template
  ansible.builtin.command: pveam download local ubuntu-22.04-standard_22.04-1_amd64.tar.zst
  args:
    creates: /var/lib/vz/template/cache/ubuntu-22.04-standard_22.04-1_amd64.tar.zst

# Resolve the node CT 102 lives on now (HA-aware). Sets ct_exists + ct_node;
# node-local `pct` ops below delegate to ct_node so they follow HA migrations.
- name: Resolve owning node for DNS CT
  ansible.builtin.include_role:
    name: resolve_ct_node
  vars:
    ct_vmid: 102

- name: Create DNS Container
  ansible.builtin.command: >
    pct create 102 /var/lib/vz/template/cache/ubuntu-22.04-standard_22.04-1_amd64.tar.zst
    --hostname dns-01
    --cores 1 --memory 1024 --swap 512
    --net0 name=eth0,bridge=private,ip={{ ip_dns_primary }}/24,gw={{ net_private_gw }}
    --storage nvme-data
    --unprivileged 1
    --features nesting=1
    --password "{{ dns_01_root_pass }}"
    --start 1
    --onboot 1
  no_log: true
  when: not ct_exists

# Idempotent memory bump for already-existing CTs (the `pct create` above
# only ever runs once). 2026-09-11: dns-01, lb-01, tailscale-gw, proxy-01
# all got apt-daily-upgrade.service OOM-killed on the same morning --
# kernel OOM line showed the cgroup hit its exact 512MB ceiling
# ("memory: usage 524288kB, limit 524288kB") during a normal 74-package
# security patch batch, no host-level memory pressure involved (host PSI
# was 0 throughout). `--memory` is a cgroup ceiling, not a reservation --
# raising it costs nothing at idle (a CT using 90MB still uses 90MB with
# a 1024MB ceiling), it only gives headroom for periodic burst dpkg/apt
# operations. Confirmed via a fable consult before applying. Swap left at
# 512 -- CT swap is a cap on shared HOST swap, not free capacity, and this
# node's host swap was already near-full (unrelated accumulated creep,
# confirmed harmless via /proc/pressure/memory showing 0 pressure) so
# leaning on more swap would have been the wrong lever anyway.
- name: Check DNS Container's current memory config
  ansible.builtin.command: "pct config 102"
  register: dns_config_current
  changed_when: false
  when: ct_exists

- name: Bump DNS Container memory ceiling to 1024MB (see OOM comment above)
  ansible.builtin.command: "pct set 102 --memory 1024"
  when:
    - ct_exists
    - "'memory: 1024' not in dns_config_current.stdout"

- name: Ensure DNS Container is Running
  ansible.builtin.command: pct start 102
  delegate_to: "{{ ct_node }}"
  register: dns_start
  failed_when: dns_start.rc != 0 and ("already running" not in dns_start.stderr and "already running" not in dns_start.stdout)
  changed_when: dns_start.rc == 0

- name: Wait for DNS Container IP
  ansible.builtin.shell: |
    set -o pipefail
    pct exec 102 -- ip a show eth0 | grep "inet " | grep -v "127.0.0.1"
  delegate_to: "{{ ct_node }}"
  register: ip_check
  until: ip_check.rc == 0
  retries: 20
  delay: 3
  changed_when: false

- name: Update Apt Cache in DNS Container
  ansible.builtin.command: pct exec 102 -- apt-get update
  delegate_to: "{{ ct_node }}"
  when: not ct_exists
  changed_when: true

- name: Install Python3 in DNS Container
  ansible.builtin.command: pct exec 102 -- apt-get install -y python3
  delegate_to: "{{ ct_node }}"
  when: not ct_exists
  changed_when: true

- name: Add DNS Host to Inventory
  ansible.builtin.add_host:
    name: "dns-01"
    ansible_host: "{{ ip_dns_primary }}"
    ansible_user: "root"
    # We need to set up SSH key if we want direct SSH?
    # Or we can use connection: lxc?
    # Usually we use SSH. But unprivileged LXC might block direct root SSH unless configured.
    # For now, I'll assume we can use `proxmox_lxc` connection plugin or just `ssh` if we inject keys.
    # But wait, `pct create` sets password.
    # I'll rely on `ansible_connection: community.general.proxmox` or similar?
    # No, I usually use `ssh`. I'll inject my key.
    groups: "dns_servers"

- name: Inject SSH Key into DNS Container (via pipe)
  ansible.builtin.shell: |
    set -o pipefail
    pct exec 102 -- mkdir -p /root/.ssh
    cat /root/.ssh/authorized_keys | pct exec 102 -- sh -c "cat > /root/.ssh/authorized_keys"
    pct exec 102 -- chmod 700 /root/.ssh
    pct exec 102 -- chmod 600 /root/.ssh/authorized_keys
  delegate_to: "{{ ct_node }}"
  when: not ct_exists

# openssh-server ships with the Ubuntu LXC template but is not enabled by
# default. Without this the CT is only reachable via `pct exec` from the
# proxmox host — direct SSH from ansible against the CT's IP fails.
- name: Ensure SSH is enabled and running
  ansible.builtin.command: pct exec 102 -- systemctl enable --now ssh
  delegate_to: "{{ ct_node }}"
  changed_when: false
