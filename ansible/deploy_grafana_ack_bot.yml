---
# Deploys the standalone Grafana Discord Ack Bot to graf-01 (CT 107), where
# it has run since the hermes-gw-01 gateway was retired. See
# roles/grafana_ack_bot/files/service.py for the full design rationale
# (why this is a separate process from hermes-agent, not an extension of
# its own Discord adapter).
- name: Deploy Grafana Discord Ack Bot
  hosts: grafana   # both replicas; lb-01 fronts them with a backup upstream
  gather_facts: true
  roles:
    - grafana_ack_bot
