---
# Keep the personal MacBook's Hermes install current with the fork's main
# branch. See roles/hermes_macbook/README.md for what is (and is not) managed.
#
# Run from amd-workstation (details in the role README):
#   ansible-playbook update_hermes_macbook.yml
#   ansible-playbook update_hermes_macbook.yml
- name: Update Hermes on the personal MacBook
  hosts: personal_macbook
  gather_facts: false
  roles:
    - hermes_macbook
