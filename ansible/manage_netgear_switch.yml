---
# NETGEAR GS108Ev4 switch (upstream of pve01/02/03 + the two Mac Studios).
# Config is managed MANUALLY via the switch's web UI, not by this
# playbook -- see roles/netgear_gs108ev4/tasks/main.yml for the current
# live config and why automation was deliberately not pursued, and
# docs/ipam.md "PVE Sync network" for the full history.
#
# Running this playbook is a no-op (prints the current-state summary via
# the role's debug task) unless you explicitly pass
# --tags netgear_switch_discover, which re-runs the historical CGI
# discovery tooling -- untested against the switch's current (rotated)
# password, kept for reference only. Pass the password via -e if you
# ever actually need it:
#   ansible-playbook manage_netgear_switch.yml \
#     --tags netgear_switch_discover \
#     -e netgear_gs108ev4_password='<from 1Password>'
- name: NETGEAR GS108Ev4 switch (no-op status check; manual config)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run GS108Ev4 role
      ansible.builtin.include_role:
        name: netgear_gs108ev4
