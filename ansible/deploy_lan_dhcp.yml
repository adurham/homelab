---
# Kea DHCPv4 hot-standby pair for the LAN (shared lease database via the HA
# hook). Run after deploy_lan_dns.yml has converged AdGuard on the same pair.
#
#   ansible-playbook deploy_lan_dhcp.yml
# (key comes from inventory: ~/.ssh/id_ansible_dns, the dedicated LAN-DNS key)
- name: Configure the shared-lease DHCP pair
  hosts: lan_dns
  gather_facts: true
  roles:
    - lan_dhcp_kea
