# Netfilter modules the SDN gateway's NAT path needs, preloaded at boot.
#
# Why this file exists twice over:
#  * CT 101 (tailscale-gw) applies its NAT rules with iptables, which on
#    Debian 13 is the nft backend: MASQUERADE needs nf_tables + nft_compat +
#    xt_MASQUERADE + nft_chain_nat + nf_nat, and netfilter-persistent fails
#    at boot ("No chain/target/match by that name") if any are missing.
#  * An UNPRIVILEGED container cannot trigger module autoload, so if the
#    guest is unprivileged (converted 2026-10-20) the modules must already be
#    resident on the host — otherwise NAT silently fails after a host reboot.
#
# This must exist on EVERY node that can host the guest, because HA can
# restart it elsewhere (crs: ha-rebalance-on-start=1).
nf_conntrack
nf_defrag_ipv4
nf_defrag_ipv6
nf_nat
nf_reject_ipv4
nf_reject_ipv6
nf_tables
nft_chain_nat
nft_compat
nft_ct
xt_conntrack
xt_connmark
xt_MASQUERADE
xt_REDIRECT
xt_addrtype
xt_comment
xt_mac
xt_mark
xt_multiport
xt_physdev
xt_tcpudp
