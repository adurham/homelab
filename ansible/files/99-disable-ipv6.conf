# IPv6 disabled 2026-10-20 (security sweep 3).
#
# Reason: this container was the ONLY guest on the LAN bridge (eth0 on
# vmbr0) receiving a router advertisement, so it held a global 2600:1702:768c:9cf::/64
# address plus a default route while every other host was IPv4-only. That
# made it the one host that could bypass the nginx edge ACL entirely if the
# AT&T gateway ever stopped filtering inbound v6 -- and it runs go2rtc with
# unauthenticated listeners (1984/8554). Frigate has no IPv6 requirement:
# cameras, go2rtc and the web UI are all IPv4 on the LAN/SDN.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.eth0.disable_ipv6 = 1
net.ipv6.conf.eth1.disable_ipv6 = 1
