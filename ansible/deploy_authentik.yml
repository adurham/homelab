---
- name: Deploy Authentik Container (LXC)
  hosts: proxmox_nodes[0] # Target primary node
  gather_facts: false
  roles:
    - authentik_host

- name: Configure Authentik Service
  hosts: authentik_server
  # every node in the group runs the same stack; bump versions one node at a time (see the role defaults)
  serial: 1
  gather_facts: true
  pre_tasks: []

  roles:
    - authentik_service
