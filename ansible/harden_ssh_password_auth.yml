---
# Removes SSH password authentication from the hosts that still had it
# (sweep 2026-10-19). Every human login on these boxes is key-based: the
# YubiKey sk key, the 1Password RSA fallback, or the ansible key. Root login is
# already `no` (gated hosts) or `prohibit-password`; the only non-root human
# account (`amd`) is locked (`!`), so this removes an unused path rather than a
# working one.
#
# Idempotent. Validates with `sshd -t` before installing, so a bad drop-in can
# never take sshd down. Hosts using ssh.socket need no reload (each connection
# starts a fresh sshd); the reload below covers ssh.service hosts.
- name: Disable SSH password authentication
  hosts:
    - adblock-proxy-01
    - authentik
    - dns-01
    - frigate-01
    - graf-01
    - hermes-gw-01
    - lb-01
    - mail-01
    - ntp-01
    - proxy-01
    - tailscale-gw
    - vm-01
  gather_facts: false
  tasks:
    - name: Install the no-password drop-in (00- sorts ahead of 99-harden.conf)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-no-password.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Ansible — harden_ssh_password_auth.yml
          # Key-only logins: YubiKey sk key, 1Password RSA, ansible key.
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitEmptyPasswords no
        validate: /usr/sbin/sshd -t -f %s

    - name: Reload sshd where it is socket-independent
      ansible.builtin.shell: |
        systemctl is-enabled --quiet ssh.socket 2>/dev/null && exit 0
        systemctl reload ssh 2>/dev/null || systemctl reload sshd 2>/dev/null || true
      changed_when: false

    - name: Assert the effective config is key-only
      ansible.builtin.shell: |
        sshd -T | grep -qx 'passwordauthentication no' && \
        sshd -T | grep -qx 'kbdinteractiveauthentication no'
      changed_when: false
      register: sshd_assert

    - name: Fail loudly if the drop-in did not take effect
      ansible.builtin.assert:
        that: sshd_assert.rc == 0
        fail_msg: "{{ inventory_hostname }} still reports password authentication enabled"
