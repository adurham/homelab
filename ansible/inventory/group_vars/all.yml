# --- LAN DNS pair (CT 130 / CT 131), provisioned by deploy_lan_dns.yml ---------
# The house's resolvers: DHCP option 6 hands both addresses to every client, so
# these two are also HA-managed with pvesr replication. The 2026-11-09 outage
# was DNS+DHCP living on one appliance with no second copy.
lan_gateway: "192.168.86.1"

lan_dns_hosts:
  - vmid: 130
    hostname: lan-dns-01
    ip: 192.168.86.4
    node: pve01
    replica_node: pve02
    dhcp: true
  - vmid: 131
    hostname: lan-dns-02
    ip: 192.168.86.5
    node: pve02
    replica_node: pve01
    dhcp: false

# Nameservers a freshly built container may use before its own AdGuard exists.
# Only used during the bootstrap window; AdGuard takes :53 afterwards.
lan_dns_bootstrap_nameservers:
  - 1.1.1.1
  - 9.9.9.9

# Public half of ~/.ssh/id_ansible, so a newly created container is reachable by
# ansible without a password step.
lan_dns_ansible_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPORqLe0CJ4SZiAWXtJIQBx+AG3GdWN8gYcMx3WOBQrP ansible@amd-workstation (dedicated, 1password)"

# --- AdGuard Home -------------------------------------------------------------
# /opt, never /tmp: Proxmox clears /tmp on container boot and a unit pointing
# there left lan-dns-02 with no resolver at all after its 2026-11-10 restart.
adguard_home_dir: /opt/adguardhome
# AdGuard Home config schema. Must be pinned in the template: without it the
# binary parses with schema 31 (scalar upstream_dns) and rejects the lists.
adguard_schema_version: 34
adguard_admin_address: 127.0.0.1:3001
# Quad9 DoH, which is what the live pair actually resolves through.
adguard_upstreams:
  - https://dns10.quad9.net/dns-query
adguard_bootstrap_dns:
  - 9.9.9.10
  - 149.112.112.10
# bcrypt hash of the AdGuard admin password (carried over from the live pair;
# the two resolvers share it, as lan-dns-02 was cloned from lan-dns-01).
# Without a user in the config AdGuard boots into its first-run wizard on
# :3000 and refuses to serve :53 -- a rebuilt container would come up dead.
adguard_admin_password_hash: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          38663331313237343763376433636463623362303762616638343031376134653435666338396561
          3564643061383337633836313234656438383931383430650a356663373731343631356330633131
          32303130366230633664623061636138303963383263383031303762313465356631303963393831
          6261336365636363650a323332356564373231383234633764366564643038633439343237653565
          65666435613864393561333636666162613961373134363665666136356565346364653661613032
          65653636346638313538333932633361333636306362383436636337636434643737366235646635
          326535396263323965353832303432663239
adguard_filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: false
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
    name: AdAway Default Blocklist
    id: 2

# --- DHCP (lan-dns-01 only) ---------------------------------------------------
# dnsmasq is DHCP-only here (port=0 in the template); DNS is AdGuard.
# kea-dhcp4-server is deliberately removed by the role: two enabled DHCP servers
# on one broadcast domain raced for :67 on 2026-11-10 and the house ended up
# with neither of them running.
lan_dns_dhcp_interface: eth0
lan_dns_dhcp_domain: lan
lan_dns_dhcp_range: "192.168.86.20,192.168.86.99"
lan_dns_dhcp_netmask: 255.255.255.0
lan_dns_dhcp_lease: 12h
lan_dns_dhcp_ntp:
  - 216.239.35.0
  - 216.239.35.4
# One line per device: a second dhcp-host for the same MAC silently drops the
# reservation. Tag blocks (cam= Nest cameras onto the mitm interceptor, sw2=
# Switch 2 console, opphone= lab phone) each key a single dhcp-option to the tag.
#
# NOTE: live DHCP on lan-dns-01 is KEA (/etc/kea/kea-dhcp4.conf, rendered by
# roles/lan_dhcp_kea). This list only feeds roles/lan_dns/templates/dnsmasq.conf.j2
# (a dnsmasq variant that is not running), so keep it matching KEA — it is the
# file people read first, and a stale entry here has already sent one probe at
