---
# Re-apply JUST the vm_backup role to vm-01.
#
# Exists because deploy_monitoring.yml is too broad for a single-role fix
# (it also re-installs victoriametrics / loki / alloy and restarts them).
# This playbook re-renders the backup scripts + units and re-enables the
# timers; it does not touch the monitoring services themselves.
#
# Run from the personal MacBook (the inventory's default ProxyCommand
# points at that machine's own Tailscale IP 100.66.19.20, which loops back
# to itself when executing from there -- override with -e ansible_ssh_common_args=''):
#
#   ansible-playbook ansible/deploy_vm_backup.yml \
#     --vault-password-file .vault_pass \
#     -e 'ansible_ssh_common_args="-o ProxyCommand=\"ssh -W %h:%p -q root@100.119.249.49\" -o StrictHostKeyChecking=accept-new"'
#
- name: Install VM GDrive backup (vm-01)
  # Pin to vm-01, NOT the `victoriametrics` group: that group now also holds the
  # vm-clus-0{1,2,3} cluster members, and this role installs an rclone config
  # (GDrive credentials) plus timers that assume they run on the single host that
  # holds the snapshot pull key. Running it on a cluster node spreads the GDrive
  # secret and starts a backup unit that cannot reach its own snapshots.
  hosts: vm-01
  gather_facts: true
  tasks:
    - name: Install VM GDrive backup
      ansible.builtin.include_role:
        name: vm_backup
