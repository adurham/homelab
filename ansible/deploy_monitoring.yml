---
- name: Provision Monitoring Containers
  hosts: pve01
  gather_facts: true
  tasks:
    - name: Deploy VictoriaMetrics
      ansible.builtin.include_role:
        name: monitoring_host
      vars:
        net_private_ip: "{{ hostvars['vm-01']['net_private_ip'] }}"
        vmid: "{{ hostvars['vm-01']['vmid'] }}"
        inventory_hostname: "vm-01"
        template: "{{ hostvars['vm-01']['template'] }}"
        lxc_root_pass: "{{ vm_01_root_pass }}"

    - name: Deploy Grafana
      ansible.builtin.include_role:
        name: monitoring_host
      vars:
        net_private_ip: "{{ hostvars['graf-01']['net_private_ip'] }}"
        vmid: "{{ hostvars['graf-01']['vmid'] }}"
        inventory_hostname: "graf-01"
        template: "{{ hostvars['graf-01']['template'] }}"
        lxc_root_pass: "{{ graf_01_root_pass }}"

- name: Configure pve hosts for monitoring egress
  # pve hosts host the `private` SDN bridge but have no L3 endpoint there
  # by default — without an IP on the bridge, Alloy push to vm-01:8428
  # routes via the LAN gateway and times out. This play assigns each pve
  # host a private-subnet IP (172.16.0.{2,3,4}) and hardens inbound on
  # that interface via plain iptables. Must run before the Install
  # Telemetry Agents play so alloy has a working push path.
  hosts: proxmox_nodes
  gather_facts: false
  roles:
    - pve_private_ip

- name: Register Proxmox's native metric export to VictoriaMetrics
  # pvestatd already collects node + per-guest (VM/CT) resource metrics
  # for the GUI's RRD graphs every 10s -- this points that existing
  # collector at VM's InfluxDB v2 write endpoint instead of just the
  # GUI, no new agent. Cluster-wide config (pmxcfs), so one node applies
  # it for the whole cluster; safe to run against all proxmox_nodes since
  # the task is idempotent (checks /cluster/metrics/server first).
  hosts: proxmox_nodes
  gather_facts: false
  roles:
    - pve_metrics_export

- name: Install Telemetry Agents
  hosts: all:!victoriametrics:!grafana:!localhost:!tanium_cluster:!bwt_lab
  gather_facts: true
  # Every host in this play's scope runs Alloy. Any legacy
  # promtail / node_exporter artifacts on existing hosts were cleaned
  # up during the 2026-05-01 migration; defensive cleanup tasks were
  # removed once the migration finished. If a host ever ends up with
  # leftovers again, run `git log -- deploy_monitoring.yml` for the
  # cleanup snippet.
  #
  # media_ingest / media_ingest_02 / media_gallery run Alloy in
  # METRICS-ONLY mode (alloy_ship_logs: false, set per-host in
  # inventory/proxmox.yml) since 2026-08-05 -- host resource counters
  # (CPU/mem/disk/net) are safe to centralize, but these hosts run the
  # secondary-source scraper/gallery pipeline that's obfuscated in this
  # public repo (vault_media_ingest_02_scraper_pkg, _scrape_usernames,
  # etc. -- see roles/media_ingest_02_host and the
  # git-history-identity-scrub skill), so journal logs (which could
  # reference platform/username/chat details in process output or error
  # traces) still never leave these CTs. Fully excluded from Alloy
  # 2026-07-27 through 2026-08-04; see roles/alloy/README.md
  # "Metrics-only hosts" for the mechanism. Alloy was briefly live
  # (unfiltered, logs included) on media-ingest-01/02 for ~15min on
  # 2026-07-27 before that original exclusion landed; the shipped log
  # entries were deleted from Loki via its /loki/api/v1/delete API.
  # bwt_lab is fully excluded per user direction (deleted 2026-08-05,
  # was out of scope for centralized logging even before that).
  tasks:
    - name: Install alloy
      ansible.builtin.include_role:
        name: alloy

- name: Configure VictoriaMetrics
  hosts: victoriametrics
  gather_facts: true
  tasks:
    - name: Install pve_exporter
      # Installed before victoriametrics so the prometheus.yml.j2 scrape
      # target it defines (job 'pve_exporter') is live immediately
      # instead of showing "down" for one deploy cycle.
      ansible.builtin.include_role:
        name: pve_exporter

    - name: Install victoriametrics
      ansible.builtin.include_role:
        name: victoriametrics

    - name: Install blackbox_exporter
      ansible.builtin.include_role:
        name: blackbox_exporter

    - name: Install loki
      ansible.builtin.include_role:
        name: loki

    - name: Install alloy
      ansible.builtin.include_role:
        name: alloy

    - name: Install VM GDrive backup
      ansible.builtin.include_role:
        name: vm_backup

- name: Configure Grafana
  hosts: grafana
  gather_facts: true
  # Secrets loaded from group_vars/all.yml.
  tasks:
    - name: Install grafana
      ansible.builtin.include_role:
        name: grafana

    - name: Install alloy
      ansible.builtin.include_role:
        name: alloy

# Tanium appliances (tanium_cluster) run NO monitoring agent -- retired
# 2026-08-09 (see cleanup_tanium_node_exporter.yml and the comment near
# the top of roles/victoriametrics/templates/prometheus.yml.j2). TanOS's
# default-deny iptables never actually opened the port the old
# node_exporter install needed, so that scrape job was silently broken
# from day one, AND per explicit direction these vendor appliances
# shouldn't run custom software regardless. Host-down detection for
# tanium_cluster now comes entirely from the agentless
# blackbox_tanium_reachable probe (TCP/22) defined in
# roles/victoriametrics/templates/prometheus.yml.j2 -- no role/play
# needed here.
