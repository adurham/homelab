---
# Pushes the HA config files we manage in this repo to the Home Assistant
# host and reloads automations via the REST API. Pass `-e ha_restart=true`
# to do a full `ha core restart` instead of just automation reload — needed
# when configuration.yaml changes (everything else can be hot-reloaded).
#
# This playbook is destructive: it overwrites files on the HA host and can
# trigger a core restart. `--check` mode is not meaningful here; for safe
# rehearsal pass `-e ha_restart=false` (the default) so the slow path is
# skipped and only an automation reload happens.
- name: Deploy Home Assistant Automations
  # gather_facts must stay false: Home Assistant OS ships no Python
  # interpreter, so the setup module cannot run on this host. We derive the
  # backup timestamp from a local `date` lookup instead of ansible_date_time.
  hosts: homeassistant
  gather_facts: false
  vars:
    deploy_ts: "{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"
    ha_root: "{{ playbook_dir }}/../homeassistant"
    ha_restart: false
    ssh_opts: "-o StrictHostKeyChecking=accept-new"
    # How many pre-deploy backups to retain (most recent N by date). These
    # backups have NO built-in retention (unlike HA's own daily automatic
    # backups, which cap at 3 copies via HA's own backup manager) and
    # accumulate ~330-400MB per deploy run — 15 of them ate 5.4GB of the
    # 28GB disk and contributed to a near-outage (2026-07-26, freed via
    # `ha backups remove`). Pruned after every deploy so this can't
    # silently recur.
    pre_deploy_backup_keep: 3
    # AppDaemon apps live under the addon's own config dir, NOT /config/apps
    # (that is a placeholder). The addon slug is part of the path. AppDaemon
    # hot-reloads on file change, so no core restart is needed for these.
    appdaemon_apps_dir: "/addon_configs/a0d7b954_appdaemon/apps"
    # Files that go to /config/ (root). Add new ones here as the surface
    # of this repo's HA config grows.
    config_files:
      - templates.yaml
      - sensors.yaml
      - configuration.yaml
      - scripts.yaml
      - input_datetime.yaml
      - input_number.yaml

  tasks:
    # homeassistant inventory is a single host, this lint is local-only,
    # free-strategy concerns don't apply.
    - name: Lint local YAML before touching the host  # noqa: run-once[task]
      ansible.builtin.command: yamllint homeassistant/
      args:
        chdir: "{{ ha_root }}/.."
      delegate_to: localhost
      run_once: true
      changed_when: false

    - name: Take pre-deploy backup on the HA host
      # NOTE: this HAOS uses `ha backups new`, not `ha core backup`
      # (the latter has no `backup` subcommand on current Supervisor).
      #
      # `--folders homeassistant` makes this a PARTIAL backup of just the
      # HA Core config directory (automations, templates, sensors, etc.) —
      # the only thing this playbook ever touches or restores from. A full
      # backup (the old default, no --folders flag) additionally exports
      # every installed add-on's Docker image to a tarball, which is what
      # this playbook actually needs to protect against, but at a massive
      # time cost: on this host the shark2mqtt add-on's image alone (bundles
      # Chromium/Patchright from its upstream base) took 12-20 minutes to
      # export, blowing deploy runtime up 15-20x for zero benefit — this
      # playbook never modifies or restores add-ons. Confirmed 2026-07-26:
      # partial backup (368MB, HA config + supervisor metadata only)
      # completes in ~70 seconds vs 15-20 min for a full backup with 17
      # add-on images. If a real add-on-level backup is ever needed, use
      # `ha backups new` (full, no --folders) manually — this playbook's
      # pre-deploy safety net only needs to cover the HA config surface.
      ansible.builtin.raw: >-
        ha backups new --name pre-deploy-{{ deploy_ts }} --folders homeassistant
      register: ha_backup
      changed_when: ha_backup.rc == 0
      failed_when: ha_backup.rc != 0

    # Prune old pre-deploy-* backups, keeping only the N most recent
    # (pre_deploy_backup_keep). These backups have no built-in retention
    # policy and silently accumulated to 5.4GB/15 copies before this task
    # was added (2026-07-26 disk-space incident). `ha backups list
    # --raw-json` sorts everything named pre-deploy-* newest first, then
    # list-slicing (NOT the `first(N)` filter, which only ever returns a
    # single element in Jinja2) keeps the first N and marks the rest stale.
    - name: List backups for pruning
      ansible.builtin.raw: "ha backups list --raw-json"
      register: backups_list_raw
      changed_when: false

    - name: Determine stale pre-deploy backups to remove
      ansible.builtin.set_fact:
        pre_deploy_slugs_by_age: >-
          {{
            (backups_list_raw.stdout | from_json).data.backups
            | selectattr('name', 'match', '^pre-deploy-')
            | sort(attribute='date', reverse=true)
            | map(attribute='slug') | list
          }}

    - name: Set stale slugs (everything past the keep count)
      ansible.builtin.set_fact:
        stale_pre_deploy_slugs: "{{ pre_deploy_slugs_by_age[pre_deploy_backup_keep | int :] }}"

    - name: Remove stale pre-deploy backups
      ansible.builtin.raw: "ha backups remove {{ item }}"
      loop: "{{ stale_pre_deploy_slugs }}"
      register: prune_result
      changed_when: prune_result.rc == 0
      when: stale_pre_deploy_slugs | length > 0

    - name: Ensure target directories exist
      ansible.builtin.raw: "mkdir -p /config/automations /config/apps {{ appdaemon_apps_dir }}"
      register: mkdir_result
      changed_when: mkdir_result.rc == 0

    - name: Copy automations directory
      # Copy the directory *contents* (automations/.) not the directory
      # itself: `scp -r src/ dest/` nests as dest/src when dest exists,
      # which silently lands files in /config/automations/automations/.
      ansible.builtin.shell: >-
        scp -P {{ ansible_port }} -r {{ ssh_opts }}
        {{ ha_root }}/automations/.
        {{ ansible_user }}@{{ ansible_host }}:/config/automations/
      delegate_to: localhost
      register: scp_automations
      changed_when: scp_automations.rc == 0

    - name: Remove stale automation files (not in local source)
      # scp only pushes — it doesn't delete. Any .yaml removed from the
      # local `automations/` directory stays on the remote and HA still
      # loads it via `!include_dir_merge_list`. This task SSHes in, lists
      # the remote dir, and rm -f any file not present locally.
      ansible.builtin.shell: |
        set -eo pipefail
        cd {{ ha_root }}/automations
        local_=$(ls *.yaml | sort)
        remote_=$(ssh -p {{ ansible_port }} {{ ssh_opts }} \
          {{ ansible_user }}@{{ ansible_host }} \
          "ls /config/automations/" 2>/dev/null | sort)
        for f in $(comm -23 <(echo "$remote_") <(echo "$local_")); do
          [ -n "$f" ] || continue
          # Skip non-.yaml files (bak files, directories)
          case "$f" in *.yaml) ;; *) continue ;; esac
          echo "Removing orphan: $f"
          ssh -p {{ ansible_port }} {{ ssh_opts }} \
            {{ ansible_user }}@{{ ansible_host }} \
            "rm -v /config/automations/$f"
        done
      delegate_to: localhost
      register: cleanup_orphans
      changed_when: cleanup_orphans.stdout | default('') | length > 0

    - name: Copy /config/ files
      ansible.builtin.shell: >-
        scp -P {{ ansible_port }} {{ ssh_opts }}
        {{ ha_root }}/{{ item }}
        {{ ansible_user }}@{{ ansible_host }}:/config/
      delegate_to: localhost
      loop: "{{ config_files }}"
      register: scp_config
      changed_when: scp_config.rc == 0

    - name: Copy apps/apps.yaml
      ansible.builtin.shell: >-
        scp -P {{ ansible_port }} {{ ssh_opts }}
        {{ ha_root }}/apps/apps.yaml
        {{ ansible_user }}@{{ ansible_host }}:/config/apps/
      delegate_to: localhost
      register: scp_apps
      changed_when: scp_apps.rc == 0

    # AppDaemon apps (e.g. smart_vent_controller.py). Copy the directory
    # *contents* (appdaemon/apps/.) into the addon's apps dir. AppDaemon
    # watches this dir and hot-reloads changed apps automatically — no core
    # restart needed. The `.` suffix avoids the nested-dir trap (see the
    # automations copy above).
    - name: Copy AppDaemon apps
      ansible.builtin.shell: >-
        scp -P {{ ansible_port }} -r {{ ssh_opts }}
        {{ ha_root }}/appdaemon/apps/.
        {{ ansible_user }}@{{ ansible_host }}:{{ appdaemon_apps_dir }}/
      delegate_to: localhost
      register: scp_appdaemon
      changed_when: scp_appdaemon.rc == 0

    - name: Check Configuration
      ansible.builtin.raw: "ha core check"
      register: config_check
      changed_when: false
      failed_when: config_check.rc != 0

    - name: Surface ha core check failure
      ansible.builtin.fail:
        msg: |
          ha core check failed on the HA host. stdout/stderr below.
          ----- stdout -----
          {{ config_check.stdout | default('') }}
          ----- stderr -----
          {{ config_check.stderr | default('') }}
      when: config_check.rc | default(0) != 0

    # changed_when: rc == 0 always reports "changed" — intentional, this is a
    # one-shot REST POST with no idempotency signal from HA.
    - name: Reload Automations via API (fast path — no restart)
      ansible.builtin.command: "python3 {{ ha_root }}/reload_ha_automations.py"
      delegate_to: localhost
      register: reload_result
      changed_when: reload_result.rc == 0
      when: not (ha_restart | bool)

    - name: Restart HA core (slow path — required for configuration.yaml changes)
      ansible.builtin.raw: "ha core restart"
      register: restart_result
      changed_when: restart_result.rc == 0
      when: ha_restart | bool
